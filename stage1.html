                    e.preventDefault();
                    mediaEl.classList.add('drop-hover-active');
                };
                mediaEl.ondragleave = () => {
                    mediaEl.classList.remove('drop-hover-active');
                };
                mediaEl.ondrop = async (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    mediaEl.classList.remove('drop-hover-active');
                    const file = e.dataTransfer?.files?.[0];
                    if (file) await replaceStationMediaWithFile(mediaEl, file, defData);
                };

                const parent = mediaEl.parentElement;
                if (parent) {
                    if (window.getComputedStyle(parent).position === 'static') {
                        parent.style.position = 'relative';
                    }
                    if (!parent.querySelector('.media-plus-upload-btn')) {
                        const plusBtn = document.createElement('button');
                        plusBtn.type = 'button';
                        plusBtn.className = 'media-plus-upload-btn';
                        plusBtn.innerText = '+';
                        plusBtn.title = 'إدراج ملف من الجهاز';
                        plusBtn.onclick = (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            const picker = document.getElementById('global-media-file-picker');
                            if (!picker) return;
                            picker.accept = (mediaEl.tagName === 'VIDEO') ? 'video/*,image/*' : 'image/*';
                            picker.value = '';
                            picker.onchange = async (ev) => {
                                const file = ev.target.files?.[0];
                                if (file) await replaceStationMediaWithFile(mediaEl, file, defData);
                            };
                            picker.click();
                        };
                        parent.appendChild(plusBtn);
                    }
                }
            });
        }

        // ================= ٢. الحفظ والرفع اللامركزي وتحديث كبسولة الهوية الوسطى =================
        async function saveAllEditedContent() {
            document.querySelectorAll('[data-edit-field]').forEach(el => syncEditableElementToCurriculum(el));
            const yearKey = (typeof RAW_YEAR !== 'undefined') ? RAW_YEAR : 7;
            const editOwner = localStorage.getItem('edit_mode_owner') || 'main';
            const jwt = localStorage.getItem('platform_pinata_jwt') || "";

            if (editOwner === 'main') {
                try {
                    localStorage.setItem(`custom_curriculum_edits_y${yearKey}`, JSON.stringify(window.curriculumData[yearKey]));
                } catch (storageErr) {
                    alert("⚠️ ذاكرة المتصفح ممتلئة! يرجى تصدير نسخة احتياطية أو تقليل حجم الفيديوهات المضافة.");
                    return;
                }

                if (jwt && navigator.onLine) {
                    try {
                        await fetch('https://api.pinata.cloud/pinning/pinJSONToIPFS', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${jwt}` },
                            body: JSON.stringify({
                                pinataMetadata: {
                                    name: `3lm_main_y${yearKey}`,
                                    keyvalues: { app: "3lm_platform_main", year: String(yearKey) }
                                },
                                pinataContent: window.curriculumData[yearKey]
                            })
                        });
                        alert(`✅ تم حفظ ونشر تحديثات (مدرسة العلم الأساسية - السنة ${yearKey}) لا مركزياً بنجاح!`);
                        return;
                    } catch (e) {}
                }
                alert(`✅ تم حفظ التعديلات على (مدرسة العلم الأساسية - السنة ${yearKey}) بنجاح!`);
                return;
            }

            const storageKey = `custom_curriculum_edits_${editOwner}_y${yearKey}`;
            const existingDelta = JSON.parse(localStorage.getItem(storageKey) || '{}');

            Object.keys(window._touchedLessons).forEach(k => {
                const [w, s] = k.split('_');
                if (!existingDelta[w]) existingDelta[w] = {};
                existingDelta[w][s] = window.curriculumData[yearKey][w][s];
            });
            const finalDelta = Object.keys(existingDelta).length > 0 ? existingDelta : window.curriculumData[yearKey];

            try {
                localStorage.setItem(storageKey, JSON.stringify(finalDelta));
            } catch (storageErr) {
                alert("⚠️ ذاكرة المتصفح ممتلئة! يرجى تصدير حزمة مدرستك أو تقليل حجم الفيديوهات المضافة.");
                return;
            }

            const schools = JSON.parse(localStorage.getItem('private_schools_directory') || '[]');
            const mySchoolIdx = schools.findIndex(s => s.id === editOwner);
            let schoolMeta = mySchoolIdx >= 0 ? schools[mySchoolIdx] : { id: editOwner, name: editOwner, owner: 'معلم', targetYears: [yearKey], yearHashes: {} };

            if (!Array.isArray(schoolMeta.targetYears)) schoolMeta.targetYears = [];
            if (!schoolMeta.targetYears.includes(yearKey)) {
                schoolMeta.targetYears.push(yearKey);
                schoolMeta.targetYears.sort((a, b) => a - b);
            }
            if (mySchoolIdx >= 0) {
                schools[mySchoolIdx] = schoolMeta;
                localStorage.setItem('private_schools_directory', JSON.stringify(schools));
            }

            if (jwt && navigator.onLine) {
                try {
                    const res = await fetch('https://api.pinata.cloud/pinning/pinJSONToIPFS', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${jwt}` },
                        body: JSON.stringify({
                            pinataMetadata: {
                                name: `3lm_${editOwner}_y${yearKey}`,
                                keyvalues: {
                                    app: "3lm_platform_school",
                                    schoolId: String(schoolMeta.id),
                                    schoolName: String(schoolMeta.name),
                                    ownerName: String(schoolMeta.owner),
                                    targetYear: String(yearKey),
                                    pin: String(schoolMeta.pin || '')
                                }
                            },
                            pinataContent: {
                                schoolId: schoolMeta.id,
                                schoolName: schoolMeta.name,
                                ownerName: schoolMeta.owner,
                                targetYear: yearKey,
                                curriculumDelta: finalDelta
                            }
                        })
                    });
                    if (res.ok) {
                        const pinData = await res.json();
                        if (mySchoolIdx >= 0) {
                            schools[mySchoolIdx].ipfsHash = pinData.IpfsHash;
                            schools[mySchoolIdx].ipfsUrl = `https://gateway.pinata.cloud/ipfs/${pinData.IpfsHash}`;
                            schools[mySchoolIdx].yearHashes = schools[mySchoolIdx].yearHashes || {};
                            schools[mySchoolIdx].yearHashes[yearKey] = pinData.IpfsHash;
                            localStorage.setItem('private_schools_directory', JSON.stringify(schools));
                        }
                        alert(`✅ تم حفظ ونشر السنة (${yearKey}) في مدرستك (${schoolMeta.name}) لا مركزياً بنجاح!`);
                        return;
                    }
                } catch (e) {}
            }

            alert(`✅ تم حفظ تعديلات السنة (${yearKey}) في مدرسة (${schoolMeta.name}) بنجاح!`);
        }

        async function loadCustomCurriculumEdits() {
            try {
                const yearKey = (typeof RAW_YEAR !== 'undefined') ? RAW_YEAR : 7;
                const activeBranch = (typeof ACTIVE_SCHOOL_BRANCH !== 'undefined') ? ACTIVE_SCHOOL_BRANCH : 'main';
                const blocked = JSON.parse(localStorage.getItem('blocked_schools_list') || '[]');

                updateHeaderSchoolAndTeacherLabel();

                const branchSelect = document.getElementById('school-branch-select');
                if (branchSelect) {
                    const schools = JSON.parse(localStorage.getItem('private_schools_directory') || '[]')
                        .filter(s => !blocked.includes(s.id) && (!s.ipfsHash || !blocked.includes(s.ipfsHash)));

                    schools.filter(s => Array.isArray(s.targetYears) && s.targetYears.includes(yearKey)).forEach(sc => {
                        if (!branchSelect.querySelector(`option[value="${sc.id}"]`)) {
                            const opt = document.createElement('option');
                            opt.value = sc.id;
                            opt.innerText = `🌟 ${sc.name} (المعلم: ${sc.owner})`;
                            branchSelect.appendChild(opt);
                        }
                    });
                    if (branchSelect.querySelector(`option[value="${activeBranch}"]`)) {
                        branchSelect.value = activeBranch;
                    }
                }

                if (activeBranch === 'main' || blocked.includes(activeBranch)) {
                    updateHeaderSchoolAndTeacherLabel('مدرسة العلم', null);
                    const mainSaved = localStorage.getItem(`custom_curriculum_edits_y${yearKey}`);
                    if (mainSaved && window.curriculumData) {
                        const parsedSaved = JSON.parse(mainSaved);
                        if (parsedSaved && typeof parsedSaved === 'object' && Object.keys(parsedSaved).length > 0) {
                            window.curriculumData[yearKey] = Object.assign(window.curriculumData[yearKey] || {}, parsedSaved);
                        }
                    }
                    return;
                }

                const applyDeltaOverlay = (deltaObj) => {
                    if (!deltaObj || !window.curriculumData || !window.curriculumData[yearKey]) return;
                    Object.keys(deltaObj).forEach(w => {
                        if (!window.curriculumData[yearKey][w]) window.curriculumData[yearKey][w] = {};
                        Object.keys(deltaObj[w]).forEach(s => {
                            window.curriculumData[yearKey][w][s] = deltaObj[w][s];
                        });
                    });
                };

                const privLocal = localStorage.getItem(`custom_curriculum_edits_${activeBranch}_y${yearKey}`);
                if (privLocal) {
                    applyDeltaOverlay(JSON.parse(privLocal));
                    return;
                }

                const schools = JSON.parse(localStorage.getItem('private_schools_directory') || '[]');
                const schoolMeta = schools.find(s => s.id === activeBranch);
                if (schoolMeta && navigator.onLine) {
                    const hashForYear = (schoolMeta.yearHashes && schoolMeta.yearHashes[yearKey]) ? schoolMeta.yearHashes[yearKey] : schoolMeta.ipfsHash;
                    const fetchUrl = hashForYear ? `https://gateway.pinata.cloud/ipfs/${hashForYear}` : schoolMeta.ipfsUrl;
                    if (fetchUrl) {
                        const res = await fetch(fetchUrl);
                        const pkg = await res.json();
                        if (pkg) {
                            if (pkg.schoolName) updateHeaderSchoolAndTeacherLabel(pkg.schoolName, pkg.ownerName);
                            if (pkg.curriculumDelta) {
                                applyDeltaOverlay(pkg.curriculumDelta);
                                if (document.getElementById('welcome-screen').style.display === 'none') {
                                    renderCurrentStep();
                                }
                            }
                        }
                    }
                }
            } catch (e) {}
        }

            function getTipInfo(target) {
                let el = target;
                while (el && el !== document.body) {

                    if (el.classList.contains('media-plus-upload-btn')) {

                    }

                if (x < pad) x = pad;
                if (x + rect.width > window.innerWidth - pad) x = window.innerWidth - rect.width - pad;
                if (y + rect.height > window.innerHeight - pad) y = Math.max(pad, clientY - rect.height - 12);

            document.addEventListener('mousedown', function() {

        (function setupTTSQuestionFirstGuard() {
            if (!('speechSynthesis' in window)) return;

            let _questionEndGraceTimer = null;
            const _nativeSpeak = window.speechSynthesis.speak.bind(window.speechSynthesis);

            window.speechSynthesis.speak = function(utterance) {
                if (!utterance) return;

                clearTimeout(_questionEndGraceTimer);
                window._questionReadCompleted = false;
                window._isSpeakingMainQuestion = true;

                const onQuestionDone = () => {
                    clearTimeout(_questionEndGraceTimer);
                    _questionEndGraceTimer = setTimeout(() => {
                        if (!window.speechSynthesis.speaking && !window.speechSynthesis.pending) {
                            window._isSpeakingMainQuestion = false;
                            window._questionReadCompleted = true;
                        }
                    }, 220);
                };

                utterance.addEventListener('end', onQuestionDone);
                utterance.addEventListener('error', onQuestionDone);

                return _nativeSpeak(utterance);
            };
        })();

    <script>
    (function setupLightboxZoomControls() {
        let currentZoomWidthPct = 95;
        const zoomModal = document.getElementById('kid-img-zoom-modal');
        const zoomImg = document.getElementById('kid-img-zoom-target');
        const zoomViewport = document.getElementById('kid-img-zoom-viewport');
        const sharePopover = document.getElementById('kid-share-popover');

        function closeSharePopover() { if (sharePopover) sharePopover.classList.remove('open'); }

        window.openKidImageZoom = function(src) {
            if (!src || !zoomModal || !zoomImg) return;
            closeSharePopover();
            currentZoomWidthPct = 95;
            zoomImg.src = src;
            zoomImg.style.width = '95%';
            zoomModal.style.display = 'flex';
        };
        window.stepKidImageZoom = function(deltaPct) {
            currentZoomWidthPct = Math.min(360, Math.max(50, currentZoomWidthPct + deltaPct));
            if (zoomImg) zoomImg.style.width = currentZoomWidthPct + '%';
        };
        window.resetKidImageZoom = function() {
            currentZoomWidthPct = 95;
            if (zoomImg) zoomImg.style.width = '95%';
        };
        window.toggleKidShareMenu = function() {
            if (sharePopover) sharePopover.classList.toggle('open');
        };
        window.sendOrSystemShareImage = async function() {
            if (!zoomImg || !zoomImg.src) return;
            closeSharePopover();
            if (navigator.share) {
                try { await navigator.share({ url: zoomImg.src }); return; } catch (e) {}
            }
            window.open(zoomImg.src, '_blank');
        };
        window.saveKidZoomedImage = function() {
            if (!zoomImg || !zoomImg.src) return;
            closeSharePopover();
            const a = document.createElement('a');
            a.href = zoomImg.src;
            a.download = zoomImg.src.split('/').pop().split('?')[0] || 'lesson-slide.jpg';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };
        window.printKidZoomedImage = function() {
            if (!zoomImg || !zoomImg.src) return;
            closeSharePopover();
            window.print();
        };
        window.closeKidImageZoom = function() {
            closeSharePopover();
            if (zoomModal) zoomModal.style.display = 'none';
        };

        if (zoomViewport) {
            zoomViewport.addEventListener('wheel', function(e) {
                e.preventDefault();
                window.stepKidImageZoom(e.deltaY < 0 ? 25 : -25);
            }, { passive: false });
        }

        function attachZoomTrigger() {
            const imgBox = document.querySelector('.slider-image-box');
            if (!imgBox) return;
            const img = imgBox.querySelector('img');
            if (!img || img.style.display === 'none') return;
            if (!imgBox.querySelector('.real-zoom-trigger-btn')) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'real-zoom-trigger-btn';
                btn.innerHTML = '🔍';
                btn.onclick = function(e) {
                    e.stopPropagation();
                    if (img.src) window.openKidImageZoom(img.src);
                };
                imgBox.appendChild(btn);
            }
            if (!img.dataset.zoomClickBound) {
                img.dataset.zoomClickBound = 'true';
                img.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (this.src) window.openKidImageZoom(this.src);
                });
            }
        }

        const obs = new MutationObserver(attachZoomTrigger);
        window.addEventListener('DOMContentLoaded', () => {
            const mainArea = document.getElementById('main-content') || document.body;
            obs.observe(mainArea, { childList: true, subtree: true, attributes: true, attributeFilter: ['src', 'style'] });
            attachZoomTrigger();
        });
        document.addEventListener('click', function(e) {
            if (e.target.closest('.slider-nav-btn')) {
                const sc = document.querySelector('.slider-container');
                if (sc) sc.scrollTop = 0;
            }
        });
    })();
    </script>

<script>
(function initAl3lmStagePortalBridge() {
    const params = new URLSearchParams(window.location.search);
    const isTeacher = (params.get('from') === 'teachers') || (localStorage.getItem('al3lm_active_role') === 'teacher');
    const stageKey = document.title.includes('صَاحِب') || window.location.pathname.includes('stage3') ? 'stage3'
                   : (document.title.includes('عبد') || window.location.pathname.includes('stage2') ? 'stage2' : 'stage1');

    // 1. Default TTS OFF in stage2 and stage3 unless explicitly turned on ('true')
    if (stageKey === 'stage2' || stageKey === 'stage3') {
        if (localStorage.getItem('tts_enabled_state') === null) {
            localStorage.setItem('tts_enabled_state', 'false');
        }
        if (localStorage.getItem('tts_enabled_state') !== 'true') {
            window.isTTSActive = false;
            if (typeof updateTTSButtonUI === 'function') {
                try { updateTTSButtonUI(); } catch (_) {}
            }
        }
    }

    // 2. Stop All Audio helper + dedicated Stop button (⏹)
    window.stopAllAl3lmAudio = function() {
        try { if (typeof window._stopActiveSlideAutoAndLine === 'function') window._stopActiveSlideAutoAndLine(); } catch (_) {}
        try { if (typeof stopAllSpeech === 'function') stopAllSpeech(); } catch (_) {}
        try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (_) {}
        try {
            const ca = document.getElementById('custom-audio');
            if (ca) { ca.pause(); ca.currentTime = 0; }
        } catch (_) {}
        window._isSpeakingMainQuestion = false;
        window._questionReadCompleted = true;
    };

    function ensureStopButtonBeside(replayEl) {
        if (!replayEl || !replayEl.parentElement) return;
        const next = replayEl.nextElementSibling;
        if (next && next.classList && next.classList.contains('al3lm-tts-stop-btn')) return;
        const stopBtn = document.createElement('button');
        stopBtn.type = 'button';
        stopBtn.className = 'al3lm-tts-stop-btn';
        stopBtn.title = 'إيقاف القارئ الآلي';
        stopBtn.setAttribute('aria-label', 'إيقاف القارئ الآلي');
        stopBtn.innerHTML = '⏹';
        stopBtn.onclick = function(e) {
            e.preventDefault();
            e.stopPropagation();
            window.stopAllAl3lmAudio();
        };
        replayEl.insertAdjacentElement('afterend', stopBtn);
    }

    function scanAndInjectStopButtons() {
        document.querySelectorAll('.glass-audio-btn, .tutor-speak-mini').forEach(ensureStopButtonBeside);
        const tutorBox = document.getElementById('embedded-tutor-box');
        if (tutorBox && !tutorBox.querySelector('.al3lm-tutor-top-stop')) {
            const hdr = tutorBox.querySelector('.embedded-tutor-hdr');
            if (hdr) {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'al3lm-tts-stop-btn al3lm-tutor-top-stop';
                b.title = 'إيقاف القارئ الآلي';
                b.innerHTML = '⏹';
                b.onclick = function(e) { e.preventDefault(); e.stopPropagation(); window.stopAllAl3lmAudio(); };
                hdr.appendChild(b);
            }
        }
    }

    // 3. Sync active student's progress snapshot into al3lm_student_accounts_v1
    window.syncAl3lmStudentProgressSnapshot = function(unitDoneMeta) {
        if (isTeacher) return;
        try {
            const activeUser = localStorage.getItem('al3lm_active_student_user');
            if (!activeUser) return;
            const accounts = JSON.parse(localStorage.getItem('al3lm_student_accounts_v1') || '{}');
            if (!accounts[activeUser]) return;
            const stu = accounts[activeUser];
            const snap = stu.progress || {};
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (!k) continue;
                if (k.startsWith('student_week_') || k.startsWith('student_subj_') || k.startsWith('subj_star_') || k.startsWith('subj_score_') || k.startsWith('subj_coins_') || k.startsWith('seal_done_') || k.startsWith('gift_diamond_') || k.startsWith('s3_')) {
                    snap[k] = localStorage.getItem(k);
                }
            }
            stu.progress = snap;
            if (unitDoneMeta) {
                stu.lastScore = unitDoneMeta.score || stu.lastScore || '';
                stu.lastVisitStatus = 'wrapup';
                if (!Array.isArray(stu.lessonHistory)) stu.lessonHistory = [];
                const nowStr = new Date().toLocaleDateString('ar-EG') + ' ' + new Date().toTimeString().slice(0, 5);
                stu.lessonHistory.push({
                    date: nowStr,
                    year: unitDoneMeta.year || stu.assignedYear || 1,
                    week: unitDoneMeta.week || 1,
                    letter: unitDoneMeta.letter || '',
                    title: unitDoneMeta.title || '',
                    score: unitDoneMeta.score || ''
                });
            }
            accounts[activeUser] = stu;
            localStorage.setItem('al3lm_student_accounts_v1', JSON.stringify(accounts));
            if (navigator.onLine && stu.username && stu.pwHash) {
                const syncUrl = localStorage.getItem('al3lm_sync_api_url') || localStorage.getItem('al3lm_tutor_worker_url') || 'https://al-3lm-tutor.noorsaade-1841989.workers.dev';
                fetch(syncUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'sync_student', username: stu.username, pwHash: stu.pwHash, profile: stu }),
                    keepalive: true
                }).catch(() => {});
            }
        } catch (_) {}
    };

    window.addEventListener('beforeunload', () => {
        window.syncAl3lmStudentProgressSnapshot();
    });

    // 4. End-of-lesson transition back to student.html?wrapup=1 (or teacher continuation)
    window.recordUnitCompletionAndExitToStudentPortal = function(hostEl, meta) {
        window.stopAllAl3lmAudio();

        if (isTeacher) {

                        <a href="teachers.html" class="al3lm-exit-btn">🏫 العودة إلى بوابة المعلمين</a>
                        <button type="button" class="al3lm-exit-btn" style="background:#0f172a;" onclick="location.reload()">⬅ متابعة المعاينة</button>
                    </div>
                </div>
            `;
            return;
        }

        if (hostEl) {
            hostEl.innerHTML = `
                <div class="al3lm-exit-portal-card">

                    <div style="background:#fef9c3;border:2px solid #eab308;color:#713f12;padding:6px 18px;border-radius:999px;font-weight:900;font-size:1.1rem;">
                        عَلَامَتُكَ: ${meta.score || 'مكتمل ⭐'}
                    </div>
                    <p style="font-weight:800;color:#334155;font-size:0.95rem;">جاري تسجيل علامتك والانتقال إلى بوابتك الشخصية لضبط منبّه الدرس القادم...</p>
                    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
                        ${meta.extraExamBtn ? `<button type="button" class="al3lm-exit-btn" id="al3lm-cyc-exam-trigger" style="background:#b45309;">${meta.extraExamBtn.label}</button>` : ''}
                        <a href="student.html?wrapup=1" class="al3lm-exit-btn">🏠 الانتقال إلى بوابتي وسجل علاماتي ⬅</a>
                    </div>
                </div>
            `;
            if (meta.extraExamBtn) {
                const exB = hostEl.querySelector('#al3lm-cyc-exam-trigger');
                if (exB) exB.onclick = () => { clearTimeout(window._al3lmAutoRedirectTmr); meta.extraExamBtn.onClick(); };
            }
        }

        if (!meta.extraExamBtn) {
            window._al3lmAutoRedirectTmr = setTimeout(() => {
                window.location.href = 'student.html?wrapup=1';
            }, 2200);
        }
    };

    // 5. Wire top identity capsule link & auto-start when arriving from student.html or teachers.html
    document.addEventListener('DOMContentLoaded', () => {
        const mo = new MutationObserver(scanAndInjectStopButtons);
        mo.observe(document.body, { childList: true, subtree: true });
        scanAndInjectStopButtons();

        const homeLink = document.getElementById('header-year-badge') || document.getElementById('home-identity-capsule');
        if (homeLink) {
            homeLink.href = isTeacher ? 'teachers.html' : 'student.html';
            homeLink.title = isTeacher ? 'العودة إلى بوابة المعلمين' : 'العودة إلى بوابة التلميذ وسجل العلامات';
            homeLink.addEventListener('click', () => {
                window.stopAllAl3lmAudio();
                window.syncAl3lmStudentProgressSnapshot();
            });
        }

        // Auto-bypass internal #welcome-screen when launched from student.html (?autostart=1) or teachers.html
        const shouldAutoStart = (typeof RAW_YEAR !== 'undefined' && RAW_YEAR === 1 && !isTeacher) ? false : ((params.get('autostart') === '1') || isTeacher || Boolean(localStorage.getItem('al3lm_active_student_user')));
        const ws = document.getElementById('welcome-screen');
        if (ws && shouldAutoStart) {
            ws.style.display = 'none';
            if (typeof startLesson === 'function') {
                try { startLesson(); } catch (_) {}
            }
        }
    });
})();

<script>
(function initAl3lmOrientationManager() {
    const isInstalledApp = window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches || window.navigator.standalone === true;
    if (isInstalledApp) {
        document.documentElement.classList.add('is-installed-pwa');
        if (document.body) document.body.classList.add('is-installed-pwa');
        else document.addEventListener('DOMContentLoaded', () => document.body.classList.add('is-installed-pwa'));
    }
    if (!isInstalledApp) return;
    const KEY = 'al3lm_screen_orientation'; // 'any' | 'landscape' | 'portrait'
    const LABELS = {
        any: '🔄 تلقائي (حر)',
        landscape: '↔️ أفقي',
        portrait: '↕️ عمودي'
    };
    const SHORT_LABELS = {
        any: '🔄 حر',
        landscape: '↔️ أفقي',
        portrait: '↕️ عمودي'
    };

    function getPref() {
        const v = localStorage.getItem(KEY);
        return (v === 'landscape' || v === 'portrait') ? v : 'any';
    }

    let hintDismissedForMode = '';

    function checkPhysicalMismatchHint(mode) {
        let banner = document.getElementById('al3lm-rotate-hint-banner');
        if (!banner) {
            banner = document.createElement('div');
            banner.id = 'al3lm-rotate-hint-banner';
            banner.innerHTML = '<span id="al3lm-rotate-hint-txt"></span><button type="button" title="إخفاء">×</button>';
            banner.querySelector('button').onclick = function() {
                hintDismissedForMode = getPref();
                banner.style.display = 'none';
            };
            document.body.appendChild(banner);
        }
        if (mode === 'any' || hintDismissedForMode === mode) {
            banner.style.display = 'none';
            return;
        }
        const isCurrentlyLandscape = window.innerWidth > window.innerHeight;
        if (mode === 'landscape' && !isCurrentlyLandscape) {
            banner.querySelector('#al3lm-rotate-hint-txt').textContent = '↔️ أدر الهاتف أفقياً للعرض بالوضع الأفقي الذي اخترته';
            banner.style.display = 'inline-flex';
        } else if (mode === 'portrait' && isCurrentlyLandscape) {
            banner.querySelector('#al3lm-rotate-hint-txt').textContent = '↕️ أدر الهاتف عمودياً للعرض بالوضع العمودي الذي اخترته';
            banner.style.display = 'inline-flex';
        } else {
            banner.style.display = 'none';
        }
    }

    async function applyOrientationLock(mode, fromUserGesture = false) {
        try {
            if (mode === 'any') {
                if (screen.orientation && typeof screen.orientation.unlock === 'function') {
                    screen.orientation.unlock();
                }
                if (fromUserGesture && document.fullscreenElement && document.exitFullscreen) {
                    await document.exitFullscreen().catch(() => {});
                }
            } else {
                const lockTarget = mode === 'landscape' ? 'landscape' : 'portrait';
                let lockedOk = false;
                if (screen.orientation && typeof screen.orientation.lock === 'function') {
                    try {
                        await screen.orientation.lock(lockTarget);
                        lockedOk = true;
                    } catch (err) {
                        // في المتصفح العادي على أندرويد (خارج التطبيق المثبّت)، قد يتطلب قفل الشاشة تفعيل ملء الشاشة أولاً عند نقر المستخدم
                        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
                        if (fromUserGesture && !isStandalone && document.documentElement.requestFullscreen && !document.fullscreenElement) {
                            try {
                                await document.documentElement.requestFullscreen();
                                await screen.orientation.lock(lockTarget);
                                lockedOk = true;
                            } catch (_) {}
                        }
                    }
                }
            }
        } catch (_) {}
        updateAllOrientationButtonsUI(mode);
        setTimeout(() => checkPhysicalMismatchHint(mode), 220);
    }

    function updateAllOrientationButtonsUI(mode) {
        document.querySelectorAll('[data-orient-choice]').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-orient-choice') === mode);
        });
        document.querySelectorAll('.al3lm-orient-cycle-btn').forEach(btn => {
            const isCompact = btn.classList.contains('compact-orient');
            const lblEl = btn.querySelector('.btn-lbl');
            const icoEl = btn.querySelector('.btn-ico');
            if (lblEl && icoEl) {
                icoEl.textContent = mode === 'landscape' ? '↔️' : (mode === 'portrait' ? '↕️' : '🔄');
                lblEl.textContent = mode === 'landscape' ? 'أفقي' : (mode === 'portrait' ? 'عمودي' : 'تلقائي');
            } else {
                btn.innerHTML = isCompact ? SHORT_LABELS[mode] : `📱 الاتجاه: ${LABELS[mode]}`;
            }
            btn.title = `اتجاه شاشة الهاتف الحالي: ${LABELS[mode]} (اضغط للتبديل بين حر / أفقي / عمودي)`;
        });
    }

    window.setAl3lmOrientation = function(mode) {
        const clean = (mode === 'landscape' || mode === 'portrait') ? mode : 'any';
        hintDismissedForMode = '';
        localStorage.setItem(KEY, clean);
        applyOrientationLock(clean, true);
    };

    window.cycleAl3lmOrientation = function() {
        const cur = getPref();
        const next = cur === 'any' ? 'landscape' : (cur === 'landscape' ? 'portrait' : 'any');
        window.setAl3lmOrientation(next);
    };

    window.addEventListener('resize', () => checkPhysicalMismatchHint(getPref()));
    window.addEventListener('orientationchange', () => setTimeout(() => checkPhysicalMismatchHint(getPref()), 200));

    document.addEventListener('DOMContentLoaded', () => {
        const saved = getPref();
        updateAllOrientationButtonsUI(saved);
        if (saved !== 'any') {
            applyOrientationLock(saved, false);
            // إعادة تطبيق القفل عند أول لمسة للمستخدم إذا كان التطبيق المثبّت يحتاج تفاعلاً أولياً
            const onceLock = () => {
                const cur = getPref();
                if (cur !== 'any' && screen.orientation && typeof screen.orientation.lock === 'function') {
                    screen.orientation.lock(cur).catch(() => {});
                }
                document.removeEventListener('click', onceLock);
            };
            document.addEventListener('click', onceLock, { once: true });
        }
    });
})();
</script>

<script>
(function setupYear1ExclusiveExperience() {
    if (typeof RAW_YEAR === 'undefined' || RAW_YEAR !== 1) return;

    const params = new URLSearchParams(window.location.search);
    const isTeacher = (params.get('from') === 'teachers') || (localStorage.getItem('al3lm_active_role') === 'teacher');
    const isGuestExplore = (params.get('explore') === '1') || (localStorage.getItem('al3lm_explore_guest_mode') === '1');

    document.body.classList.add('year1-minimal-mode');

    // ١. إيقاف القارئ الآلي والموسيقى الخلفية كلياً في السنة الأولى
    isTTSActive = false;
    isMusicPlaying = false;
    currentMusicIndex = -1;
    try {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        const bgM = document.getElementById('bg-music');
        if (bgM) { bgM.pause(); bgM.removeAttribute('src'); }
    } catch (_) {}

    // ٢. فتح الأختام السبعة كلها في السنة الأولى ليتمكن الطفل/الأهل من فتح أي فيديو من الفيديوهات الـ 7 بحرية
    playMaxSubj = 7;
    isFreeExplore = true;

    // ٣. إضافة زر «مدرسة العلم» أعلى شريط الأختام العمودي للعودة المباشرة إلى الصفحة الرئيسية / البوابة
    const sidebar = document.getElementById('seals-sidebar');
    if (sidebar && !document.getElementById('y1-home-return-btn')) {
        const homeBtn = document.createElement('a');
        homeBtn.id = 'y1-home-return-btn';
        homeBtn.className = 'y1-sidebar-home-btn';
        // يعيد الزائر إلى index.html، والمعلم إلى teachers.html، والتلميذ المسجل إلى بوابته الرئيسية student.html (أو index.html إن لم يكن مسجلاً)
        const hasActiveStudent = Boolean(localStorage.getItem('al3lm_active_student_user'));
        homeBtn.href = isTeacher ? 'teachers.html' : ((hasActiveStudent && !isGuestExplore) ? 'student.html' : 'index.html');
        homeBtn.title = 'العودة إلى الصفحة الرئيسية — مدرسة العلم';
        homeBtn.innerHTML = `
            <img src="icon-512.png" onerror="this.src='cc.ico'" alt="مدرسة العلم">
            <span>مدرسة العلم</span>
        `;
        homeBtn.addEventListener('click', () => {
            try {
                const v = document.getElementById('lesson-video');
                if (v) v.pause();
                if (typeof window.syncAl3lmStudentProgressSnapshot === 'function') {
                    window.syncAl3lmStudentProgressSnapshot();
                }
            } catch (_) {}
        });
        sidebar.insertBefore(homeBtn, sidebar.firstChild);
    }

    // ٤. تخصيص رسالة الترحيب الموجهة للأهل في شاشة البداية للسنة الأولى (تظهر للأهل عند أول دخول حتى لو جاء من البوابة ليفهموا طبيعة السنة الأولى)
    const ws = document.getElementById('welcome-screen');
    const wBox = ws ? ws.querySelector('.welcome-box') : null;
    if (ws && wBox) {
        wBox.style.maxWidth = '500px';
        if (!document.getElementById('y1-parents-msg-box')) {
            const note = document.createElement('div');
            note.id = 'y1-parents-msg-box';
            note.className = 'y1-parents-welcome-note';
            note.innerHTML = `
                <strong>🌿 رسالة ترحيبية إلى الأهل الكرام (بداية الرحلة)</strong>
                سوف نبدأ رحلة التعليم من هذه السنة التمهيدية الهادئة؛ لا يوجد في هذه السنة محتوى تلقيني أو أسئلة دراسية، بل يشاهد الطفل فقط <strong>٧ مرئيات مريحة بموسيقى هادئة</strong> عبر الأختام السبعة الجانبية توضّح عوالم المنصة بشكل عام بعيداً عن أي تشتيت، ويُحتسب تقدّم الطفل تلقائياً بعدد مشاهداته على مدار <strong>٢٨ مشاهدة</strong>.
            `;
            const startBtn = document.getElementById('start-lesson-btn');
            if (startBtn) wBox.insertBefore(note, startBtn);
            else wBox.appendChild(note);
        }
        // إظهار الرسالة الترحيبية للأهل دائماً عند فتح السنة الأولى ليقرؤوها بطمأنينة قبل بدء الفيديو
        if (!isTeacher) {
            ws.style.display = 'flex';
            ws.style.opacity = '1';
        }
    }

    // ٥. احتساب التقدم في السنة الأولى بعدد مشاهدات الفيديو على 28 (كل مشاهدة ترفع العداد 1 من 28 وتزامن سجل التلميذ تلقائياً)
    window.recordYear1VideoWatch = function(sealIdx) {
        if (isTeacher || isGuestExplore || isSecretEditMode) return;
        const watchKey = `y1_views_count_${SAVE_KEY}`;
        let views = parseInt(localStorage.getItem(watchKey), 10);
        if (isNaN(views)) {
            views = Math.max(0, (parseInt(localStorage.getItem(`student_week_${SAVE_KEY}`), 10) || 1) - 1);
        }
        views = Math.min(28, views + 1);
        localStorage.setItem(watchKey, String(views));

        // مزامنة المفاتيح القياسية (student_week_ / seal_done_ / subj_score_) ليتطابق التقدم مع نسق الـ 28 في كل المنصة
        localStorage.setItem(`seal_done_${SAVE_KEY}_w${views}_s${sealIdx}`, 'true');
        const nextWeekPtr = Math.min(28, views + 1);
        localStorage.setItem(`student_week_${SAVE_KEY}`, String(nextWeekPtr));
        localStorage.setItem(`student_subj_${SAVE_KEY}`, '1');

        // تحديث نجمة الختم الحالي بصرياً على الشريط العمودي
        const sealBtn = document.getElementById('btn-subj-' + sealIdx);
        if (sealBtn) sealBtn.classList.add('completed');

        // حفظ السجل في حساب الطالب السحابي والمحلي
        try {
            const activeUser = localStorage.getItem('al3lm_active_student_user');
            if (activeUser) {
                const accounts = JSON.parse(localStorage.getItem('al3lm_student_accounts_v1') || '{}');
                const stu = accounts[activeUser];
                if (stu) {
                    stu.progress = stu.progress || {};
                    stu.progress[watchKey] = String(views);
                    stu.progress[`student_week_${SAVE_KEY}`] = String(nextWeekPtr);
                    if (views >= 28) stu.completed = true;
                    const pct = Math.min(100, Math.round((views / 28) * 100));
                    stu.lastScore = `🎬 ${views} / 28 مشاهدة (${pct}%)`;
                    if (!Array.isArray(stu.lessonHistory)) stu.lessonHistory = [];
                    const nowStr = new Date().toLocaleDateString('ar-EG') + ' ' + new Date().toTimeString().slice(0, 5);
                    stu.lessonHistory.push({
                        date: nowStr,
                        year: 1,
                        week: views,
                        letter: STRICT_ABJAD_LETTERS[(views - 1) % 28] || 'أ',
                        title: `مشاهدة مرئية الختم (${sealIdx}) — المشاهدة ${views} من 28`,
                        score: `${views}/28 ⭐`
                    });
                    accounts[activeUser] = stu;
                    localStorage.setItem('al3lm_student_accounts_v1', JSON.stringify(accounts));
                }
            }
            if (typeof window.syncAl3lmStudentProgressSnapshot === 'function') {
                window.syncAl3lmStudentProgressSnapshot();
            }
        } catch (_) {}
    };
})();
</script>
