        function loadSubjCoins(w, s) {
            if (MAX_COINS_FOR_YEAR === 0) return [];
            let raw = localStorage.getItem(`subj_coins_${SAVE_KEY}_w${w}_s${s}`);
            if (raw) {
                try {
                    let parsed = JSON.parse(raw);
                    if (Array.isArray(parsed) && parsed.length === MAX_COINS_FOR_YEAR) return parsed;
                } catch (e) {}
            }
            return new Array(MAX_COINS_FOR_YEAR).fill('empty');
        }

        function saveSubjCoins(w, s, coinsArr) {
            if (MAX_COINS_FOR_YEAR === 0) return;
            if (!isFreeExplore && !isReviewMode) {
                localStorage.setItem(`subj_coins_${SAVE_KEY}_w${w}_s${s}`, JSON.stringify(coinsArr));
                let earned = coinsArr.filter(c => c === 'silver' || c === 'gold').length;
                localStorage.setItem(`subj_score_${SAVE_KEY}_w${w}_s${s}`, earned);
            }
        }

        function getWeekRelativeScore(w) {
            if (MAX_COINS_FOR_YEAR === 0) return (w < actualWeek) ? 1 : 0;
            let sumRaw = 0;
            for (let s = 1; s <= 7; s++) {
                let saved = parseInt(localStorage.getItem(`subj_score_${SAVE_KEY}_w${w}_s${s}`), 10);
                if (!isNaN(saved)) sumRaw += Math.min(MAX_COINS_FOR_YEAR, saved);
                else if (w < actualWeek || (w === actualWeek && s < actualSubj)) sumRaw += MAX_COINS_FOR_YEAR;
            }
            return Math.min(MAX_COINS_FOR_YEAR, Math.round(sumRaw / 7));
        }

        function getYearCumulativeStats() {
            let maxPerSubj = Math.max(1, MAX_COINS_FOR_YEAR);
            let totalEarnedRaw = 0;
            let totalMaxRaw = TOTAL_WEEKS * 7 * maxPerSubj;
            for (let w = 1; w <= TOTAL_WEEKS; w++) {
                for (let s = 1; s <= 7; s++) {
                    let saved = parseInt(localStorage.getItem(`subj_score_${SAVE_KEY}_w${w}_s${s}`), 10);
                    if (!isNaN(saved)) totalEarnedRaw += Math.min(maxPerSubj, saved);
                    else if (w < actualWeek || (w === actualWeek && s < actualSubj)) totalEarnedRaw += maxPerSubj;
                }
            }
            let relativeYearScore = Math.min(maxPerSubj, Math.round((totalEarnedRaw / totalMaxRaw) * maxPerSubj));
            let percentage = Math.min(100, Math.round((totalEarnedRaw / totalMaxRaw) * 100));
            return { relativeYearScore, percentage, totalEarnedRaw, totalMaxRaw, maxPerSubj };
        }

            let defData = getActiveCurriculumObj();

        // ================= ١. المحطة 2: الحج (الأسئلة المتدرجة 1-3، صح/خطأ للفردي، واختيارات للزوجي، وبالونات لعمر 3-4) =================
        function getTargetQuestionCountForSubject() {
            return MAX_COINS_FOR_YEAR;
        }

        function ensureOptionsForQuestion(rawOpts, isTrueFalseQuestion = false) {
            let letterChar = getAbjadChar(playWeek - 1);
            let abjadVal = getAbjadNum(playWeek - 1);

            if (isTrueFalseQuestion || (rawOpts.length === 2 && (String(rawOpts[0]?.text).includes('صَح') || String(rawOpts[0]?.text).includes('صح') || String(rawOpts[0]?.text).includes('✔️')))) {
                return rawOpts.slice(0, 2).map((o, idx) => ({
                    mainText: o.text,
                    subText: '',
                    correct: Boolean(o.correct || o.isCorrect),
                    origIdx: idx
                }));
            }

            let cleaned = [];
            let seenTexts = new Set();

            rawOpts.forEach((o, idx) => {
                let rawStr = String(o.text || '').trim();
                let mainPart = rawStr;
                let subPart = o.subText || '';
                if (!seenTexts.has(mainPart)) {
                    seenTexts.add(mainPart);
                    cleaned.push({
                        mainText: mainPart,
                        subText: o.showSubDetail ? subPart : '',
                        correct: Boolean(o.correct || o.isCorrect),
                        origIdx: idx
                    });
                }
            });

            let fallbackPool = (activeViewSubj === 4)
                ? [`${abjadVal + 1}`, `${Math.max(1, abjadVal - 1)}`, `٥`, `١٠`]
                : [`${letterChar}\u064E`, `${letterChar}\u064F`, `${letterChar}\u0650`, STRICT_ABJAD_LETTERS[(playWeek + 2) % 28]];

            let pIdx = 0;
            while (cleaned.length < 4 && pIdx < fallbackPool.length) {
                let cand = String(fallbackPool[pIdx++]).trim();
                if (!seenTexts.has(cand)) {
                    seenTexts.add(cand);
                    cleaned.push({ mainText: cand, subText: '', correct: false, origIdx: cleaned.length });
                }
            }

            return cleaned.slice(0, 4);
        }

        function buildUniqueHajjQuestions(defData, targetCount) {
            if (targetCount <= 0) return [];
            let sourcePool = [];
            if (defData && defData.play) {
                if (Array.isArray(defData.play.questions) && defData.play.questions.length > 0) {
                    sourcePool = defData.play.questions;
                } else if (Array.isArray(defData.play.hajjQuestions) && defData.play.hajjQuestions.length > 0) {
                    sourcePool = defData.play.hajjQuestions;
                }
            }

            let uniqueQuestions = [];
            let seenQ = new Set();
            sourcePool.forEach(qItem => {
                let key = `${qItem?.q || ''}_${qItem?.focusWord || ''}`;
                if (qItem && (qItem.q || qItem.focusWord) && !seenQ.has(key)) {
                    seenQ.add(key);
                    uniqueQuestions.push(qItem);
                }
            });

            if (uniqueQuestions.length === 0) {
                let ltr = getAbjadChar(playWeek - 1);
                let isOddSubj = (activeViewSubj % 2 === 1);
                uniqueQuestions.push({
                    isTrueFalse: isOddSubj,
                    isBalloonMode: (SCHOOL_YEAR <= 4),
                    q: isOddSubj ? `هَلْ هٰذَا الدَّرْسُ عَنْ حَرْفِ «${ltr}»؟` : `مَا هُوَ حَرْفُ هٰذَا الدَّرْسِ؟`,
                    focusWord: ltr,
                    options: isOddSubj
                        ? [{ text: 'صَحّ ✔️', correct: true }, { text: 'خَطَأ ✖️', correct: false }]
                        : [{ text: ltr, correct: true }, { text: 'م', correct: false }, { text: 'س', correct: false }, { text: 'ب', correct: false }]
                });
            }

            return uniqueQuestions.slice(0, targetCount);
        }

        function extractQuestionStemAndFocus(qObj) {
            let rawQ = String(qObj.q || '').trim();
            if (qObj.focusWord) {
                return { stem: rawQ.replace(`«${qObj.focusWord}»`, '').trim(), focus: qObj.focusWord };
            }
            let guillemetMatch = rawQ.match(/«([^»]+)»/);
            if (guillemetMatch) {
                let focusW = guillemetMatch[1];
                let cleanStem = rawQ.replace(guillemetMatch[0], '').replace(/\s+/g, ' ').trim();
                return { stem: cleanStem, focus: focusW };
            }
            return { stem: rawQ, focus: '' };
        }

        function renderQuizStation(contentDiv, defData) {
            let targetCount = getTargetQuestionCountForSubject();
            if (targetCount === 0 && !isSecretEditMode) {
                handleNextClick();
                return;

                sessionHajjQuestions = buildUniqueHajjQuestions(defData, Math.max(1, targetCount));

            let isTrueFalse = Boolean(qObj.isTrueFalse) || (Array.isArray(qObj.options) && qObj.options.length === 2);
            let processedOpts = ensureOptionsForQuestion(qObj.options || [], isTrueFalse);
            let isTrueFalseLabels = isTrueFalse && processedOpts.some(o => /صَح|صح|خَطَأ|خطأ|✔️|✖️/.test(String(o.mainText)));
            let shuffledOpts = (isTrueFalseLabels || isSecretEditMode) ? processedOpts : [...processedOpts].sort(() => Math.random() - 0.5);

            let useBalloons = (SCHOOL_YEAR === 3 || SCHOOL_YEAR === 4 || qObj.isBalloonMode) && !isSecretEditMode;

            let maxOptLen = Math.max(...shuffledOpts.map(o => o.mainText.replace(/[\u064B-\u0652]/g, '').length));
            let gridClass = useBalloons ? 'balloons-stage' : (isTrueFalse ? 'grid-2x1' : (maxOptLen > 22 ? 'grid-stack' : 'grid-2x2'));
            let btnSizeClass = isTrueFalse ? 'opt-word' : (maxOptLen <= 4 ? 'opt-huge-glyph' : (maxOptLen > 22 ? 'opt-sentence' : 'opt-word'));

            let optsGrid = document.createElement('div');

            let isAnswered = false;

                if (currentQuestionIdx + 1 < currentStationTotalQuestions) {

            shuffledOpts.forEach((opt) => {

                }

                btn.innerHTML = `
                    <span class="opt-main-text" data-edit-field="q_opt_${opt.origIdx}" style="${isSecretEditMode ? '' : 'pointer-events:none;'}">${colorizeHarakaAndMadd(opt.mainText)}</span>
                    ${opt.subText ? `<span class="opt-sub-detail" style="pointer-events:none;">(${opt.subText})</span>` : ''}
                `;

                btn.onclick = (ev) => {

                    void targetBtn.offsetWidth;

                    if (opt.correct) {
                        targetBtn.classList.add('correct');

                        awardCoin('hajj', currentQuestionIdx);

            card.appendChild(optsGrid);

            let spokenQ = qObj.tts || ((focus && focus !== stem) ? `${stem} ، ${focus}` : stem);

        // ================= ٢. المحطة 3: الصدقة (توصيل القائمتين مع قفل الخيار الخاطئ فوراً لمنع العشوائية) =================
        function buildSadaqahPairs(defData, neededCount) {
            let pool = [];
            if (defData && defData.play && Array.isArray(defData.play.sadaqahPairs)) {
                pool = [...defData.play.sadaqahPairs];
            } else if (defData && defData.learn && Array.isArray(defData.learn.slides)) {
                defData.learn.slides.forEach(sl => {
                    if (sl.cardData && sl.cardData.word && sl.cardData.glyph) {
                        pool.push({ right: sl.cardData.word, left: sl.cardData.glyph });
                    }
                });
            }

            let uniquePairs = [];
            let seenR = new Set();
            let seenL = new Set();
            pool.forEach(p => {
                if (p.right && p.left && !seenR.has(p.right) && !seenL.has(p.left)) {
                    seenR.add(p.right);
                    seenL.add(p.left);
                    uniquePairs.push(p);
                }
            });

            let letterChar = getAbjadChar(playWeek - 1);
            let fallbackPairs = [
                { right: `حَرْفُ (${letterChar}) بِالفَتْحْ`, left: `${letterChar}\u064E` },
                { right: `حَرْفُ (${letterChar}) بِالضَّمّْ`, left: `${letterChar}\u064F` },
                { right: `حَرْفُ (${letterChar}) بِالكَسْرْ`, left: `${letterChar}\u0650` }
            ];
            let fIdx = 0;
            while (uniquePairs.length < neededCount && fIdx < fallbackPairs.length) {
                let fp = fallbackPairs[fIdx++];
                if (!seenR.has(fp.right) && !seenL.has(fp.left)) {
                    seenR.add(fp.right);
                    seenL.add(fp.left);
                    uniquePairs.push(fp);
                }
            }

            let selectedPairs = uniquePairs.slice(0, neededCount);
            let decoyLeft = (defData && defData.play && defData.play.sadaqahDecoy) ? defData.play.sadaqahDecoy : `${letterChar}\u0652`;
            if (seenL.has(decoyLeft)) decoyLeft = STRICT_ABJAD_LETTERS[(playWeek + 2) % 28];

            return { pairs: selectedPairs, decoy: decoyLeft };
        }

        function renderSadaqahMatchingStation(contentDiv, defData) {
            let needed = Math.min(3, Math.max(1, getSadaqahCount()));
            let { pairs, decoy } = buildSadaqahPairs(defData, needed);

            let card = document.createElement('div');
            card.className = 'fancy-card sadaqah-matching-card';

            let promptBar = document.createElement('div');
            promptBar.className = 'sadaqah-prompt-bar';
            let promptTxt = '🪙 صِلْ كُلَّ عُنْصُرٍ فِي اليَمِينِ بِجَوَابِهِ الصَّحِيحِ فِي اليَسَارِ (احْذَرْ: الخِيَارُ الخَاطِئُ يُقْفَلُ وَلَا يَتَكَرَّرْ!):';
            promptBar.innerText = promptTxt;
            card.appendChild(promptBar);

            let board = document.createElement('div');
            board.className = 'matching-board';

            let svgLayer = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svgLayer.setAttribute('id', 'match-svg-layer');
            board.appendChild(svgLayer);

            let rightCol = document.createElement('div');
            rightCol.className = 'match-col match-col-right';

            let leftCol = document.createElement('div');
            leftCol.className = 'match-col match-col-left';

            let leftOptions = pairs.map((p, idx) => ({ text: p.left, pairId: idx }));
            leftOptions.push({ text: decoy, pairId: -1 });
            if (!isSecretEditMode) leftOptions.sort(() => Math.random() - 0.5);

            let activeRightBtn = null;
            let activeLeftBtn = null;
            let resolvedCount = 0;

            function drawBlackLineBetween(rBtn, lBtn) {
                const boardRect = board.getBoundingClientRect();
                const rDot = rBtn.querySelector('.match-anchor-dot').getBoundingClientRect();
                const lDot = lBtn.querySelector('.match-anchor-dot').getBoundingClientRect();

                const x1 = (rDot.left + rDot.width / 2) - boardRect.left;
                const y1 = (rDot.top + rDot.height / 2) - boardRect.top;
                const x2 = (lDot.left + lDot.width / 2) - boardRect.left;
                const y2 = (lDot.top + lDot.height / 2) - boardRect.top;

                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x1);
                line.setAttribute('y1', y1);
                line.setAttribute('x2', x2);
                line.setAttribute('y2', y2);
                line.setAttribute('stroke', '#16a34a');
                line.setAttribute('stroke-width', '4.5');
                line.setAttribute('stroke-linecap', 'round');
                svgLayer.appendChild(line);
            }

            function checkIfStationFinished() {
                if (resolvedCount >= pairs.length) {
                    updateNavButtons(true);
                    setTimeout(() => showCenterAction(() => handleNextClick(), false, '🪙'), 550);
                }
            }

            function checkPairMatch(rBtn, lBtn) {
                let rId = parseInt(rBtn.dataset.pairId, 10);
                let lId = parseInt(lBtn.dataset.pairId, 10);

                rBtn.classList.remove('selected');
                lBtn.classList.remove('selected');
                activeRightBtn = null;
                activeLeftBtn = null;

                if (rId === lId) {
                    rBtn.classList.add('matched');
                    lBtn.classList.add('matched');
                    drawBlackLineBetween(rBtn, lBtn);
                    playCorrectChime();
                    awardCoin('sadaqah', resolvedCount);
                    resolvedCount++;
                    checkIfStationFinished();
                } else {
                    playWrongTone();
                    rBtn.classList.add('locked-wrong');
                    rBtn.disabled = true;
                    lBtn.classList.add('locked-wrong');
                    lBtn.disabled = true;
                    resolvedCount++;
                    checkIfStationFinished();
                }
            }

            pairs.forEach((p, idx) => {
                let rBtn = document.createElement('button');
                rBtn.type = 'button';
                rBtn.className = 'match-item-btn';
                rBtn.dataset.pairId = idx;
                rBtn.innerHTML = `<span data-edit-field="sad_r_${idx}">${colorizeHarakaAndMadd(p.right)}</span><span class="match-anchor-dot"></span>`;
                rBtn.onclick = () => {
                    if (isSecretEditMode || rBtn.classList.contains('matched') || rBtn.classList.contains('locked-wrong')) return;
                    rightCol.querySelectorAll('.match-item-btn').forEach(b => b.classList.remove('selected'));
                    rBtn.classList.add('selected');
                    activeRightBtn = rBtn;
                    if (activeLeftBtn) checkPairMatch(activeRightBtn, activeLeftBtn);
                };
                rightCol.appendChild(rBtn);
            });

            leftOptions.forEach(opt => {
                let lBtn = document.createElement('button');
                lBtn.type = 'button';
                lBtn.className = 'match-item-btn';
                lBtn.dataset.pairId = opt.pairId;
                let editKey = opt.pairId === -1 ? 'sad_decoy' : `sad_l_${opt.pairId}`;
                lBtn.innerHTML = `<span class="match-anchor-dot"></span><span data-edit-field="${editKey}">${colorizeHarakaAndMadd(opt.text)}</span>`;
                lBtn.onclick = () => {
                    if (isSecretEditMode || lBtn.classList.contains('matched') || lBtn.classList.contains('locked-wrong')) return;
                    leftCol.querySelectorAll('.match-item-btn').forEach(b => b.classList.remove('selected'));
                    lBtn.classList.add('selected');
                    activeLeftBtn = lBtn;
                    if (activeRightBtn) checkPairMatch(activeRightBtn, activeLeftBtn);
                };
                leftCol.appendChild(lBtn);
            });

            board.appendChild(rightCol);
            board.appendChild(leftCol);
            card.appendChild(board);
            contentDiv.appendChild(card);

            updateNavButtons(true);
            showCenterAction(() => handleNextClick(), false, '🪙');
            speakText(promptTxt, () => { updateNavButtons(true); });
            if (isSecretEditMode) attachEditHooksToCurrentStation(defData);
        }

        // ================= ٣. المحطة 4: الهدية التفاعلية العصرية (فقاعات الهدايا وصندوق المفاجآت 🎁) =================
        function buildGiftBasketConfig(defData) {
            if (defData && defData.play && defData.play.giftBasket) {
                return defData.play.giftBasket;
            }
            let letterChar = getAbjadChar(playWeek - 1);
            let abjadVal = getAbjadNum(playWeek - 1);

            if (activeViewSubj === 2) {
                return {
                    prompt: `🎁 اضْغَطْ عَلَى فُقَاعَاتِ حَرْفِ (${letterChar}) لِتَضَعَهَا فِي صُنْدُوقِ الهَدِيَّةْ:`,
                    targetCount: 3,
                    items: [
                        { emoji: '✨', label: `${letterChar}`, good: true },
                        { emoji: '🎨', label: `${letterChar}\u064E`, good: true },
                        { emoji: '🌟', label: `${letterChar}\u064F`, good: true },
                        { emoji: '🔸', label: STRICT_ABJAD_LETTERS[(playWeek + 1) % 28], good: false },
                        { emoji: '🔸', label: STRICT_ABJAD_LETTERS[(playWeek + 3) % 28], good: false }
                    ]
                };
            } else if (activeViewSubj === 4) {
                let countToCollect = Math.min(4, Math.max(2, abjadVal <= 5 ? abjadVal : 3));
                let apples = [];
                for (let i = 0; i < countToCollect; i++) {
                    apples.push({ emoji: '🍎', label: `${i + 1}`, good: true });
                }
                apples.push({ emoji: '🪨', label: 'حَجَرٌ', good: false });
                return {
                    prompt: `🎁 اِمْلَأْ صُنْدُوقَ الهَدِيَّةِ بـ (${countToCollect}) تُفَّاحَاتٍ طَيِّبَةٍ:`,
                    targetCount: countToCollect,
                    items: apples
                };
            } else {
                return {
                    prompt: `🎁 اخْتَرْ فُقَاعَاتِ الخَيْرِ وَالعِلْمِ لِتَفْتَحَ أَلْمَاسَةَ صُنْدُوقِ الهَدِيَّةْ:`,
                    targetCount: 3,
                    items: [
                        { emoji: '🤝', label: 'السَّلَامْ', good: true },
                        { emoji: '✨', label: 'الصِّدْقْ', good: true },
                        { emoji: '💝', label: 'الأَمَانَةْ', good: true },
                        { emoji: '🚫', label: 'الكَذِبْ', good: false },
                        { emoji: '💢', label: 'الغَضَبْ', good: false }
                    ]
                };
            }
        }

        function renderGiftBasketStation(contentDiv, defData) {
            let cfg = buildGiftBasketConfig(defData);
            if (defData && defData.play) defData.play.giftBasket = cfg;

            let card = document.createElement('div');
            card.className = 'fancy-card gift-basket-card';

            let promptBox = document.createElement('div');
            promptBox.className = 'gift-prompt-box';
            promptBox.style.display = 'flex';
            promptBox.style.alignItems = 'center';
            promptBox.style.justifyContent = 'space-between';
            promptBox.style.gap = '10px';
            promptBox.innerHTML = `
                <span data-edit-field="gift_prompt" style="flex:1;">${colorizeHarakaAndMadd(cfg.prompt)}</span>
                <button class="skip-gift-btn" onclick="handleNextClick()">تَخَطِّي ◄</button>
            `;
            card.appendChild(promptBox);

            let itemsZone = document.createElement('div');
            itemsZone.className = 'basket-items-zone';

            let basketZone = document.createElement('div');
            basketZone.className = 'basket-target-zone';
            let collectedCount = 0;
            let wrongClicks = 0;
            let allGoodCount = (cfg.items || []).filter(x => x.good || x.isCorrect).length;
            let neededTotal = Math.min(allGoodCount || 3, cfg.targetCount || 3);

            basketZone.innerHTML = `
                <span class="basket-icon-txt" id="gift-box-icon">🎁</span>
                <span class="basket-counter-badge" id="basket-counter-badge">0 / ${neededTotal}</span>
            `;

            let indexedItems = (cfg.items || []).map((it, idx) => ({ ...it, origIdx: idx }));
            let displayItems = isSecretEditMode ? indexedItems : [...indexedItems].sort(() => Math.random() - 0.5);
            let isCompleted = false;

            displayItems.forEach((item) => {
                let tokenBtn = document.createElement('button');
                tokenBtn.type = 'button';
                tokenBtn.className = 'collectible-token';
                let isGoodItem = Boolean(item.good || item.isCorrect);

                tokenBtn.innerHTML = `
                    <span class="token-emoji" data-edit-field="gift_emoji_${item.origIdx}">${item.emoji || '🌟'}</span>
                    <span class="token-label" data-edit-field="gift_label_${item.origIdx}">${colorizeHarakaAndMadd(item.label || '')}</span>
                `;

                tokenBtn.onclick = () => {
                    if (isSecretEditMode || isCompleted || tokenBtn.classList.contains('collected') || tokenBtn.classList.contains('wrong-token')) return;

                    if (isGoodItem) {
                        tokenBtn.classList.add('collected');
                        collectedCount++;
                        playCorrectChime();
                        let counterEl = document.getElementById('basket-counter-badge');
                        if (counterEl) counterEl.innerText = `${collectedCount} / ${neededTotal}`;
                        basketZone.classList.add('bounce');
                        setTimeout(() => basketZone.classList.remove('bounce'), 260);

                        if (collectedCount >= neededTotal) {
                            isCompleted = true;
                            let gIcon = document.getElementById('gift-box-icon');
                            if (gIcon) gIcon.innerText = '💎';
                            lightUpGiftDiamond();
                            updateNavButtons(true);
                            setTimeout(() => showCenterAction(() => handleNextClick(), false, '💎'), 500);
                        }
                    } else {
                        tokenBtn.classList.add('wrong-token');
                        tokenBtn.disabled = true;
                        wrongClicks++;
                        playWrongTone();
                        if (wrongClicks >= 2) {
                            isCompleted = true;
                            itemsZone.querySelectorAll('.collectible-token').forEach(b => { b.disabled = true; });
                            let pSpan = promptBox.querySelector('[data-edit-field="gift_prompt"]');
                            if (pSpan) pSpan.innerHTML = '🌟 أَحْسَنْتَ المُحَاوَلَةَ! اضْغَطْ عَلَى زِرِّ المُتَابَعَةِ لِلِانْتِقَالِ ⬅';
                            updateNavButtons(true);
                            setTimeout(() => showCenterAction(() => handleNextClick(), false, '➡️'), 500);
                        }
                    }
                };
                itemsZone.appendChild(tokenBtn);
            });

            card.appendChild(itemsZone);
            card.appendChild(basketZone);
            contentDiv.appendChild(card);

            speakText(cfg.prompt, () => { updateNavButtons(true); });
            if (isSecretEditMode) attachEditHooksToCurrentStation(defData);
        }

        // ================= ٤. المحطة 5: التطبيق العملي والكتابة الورقية المتدرجة =================
        function formatApplySteps(defData) {
            if (defData && defData.apply && Array.isArray(defData.apply.steps)) {
                return defData.apply.steps.map(stepStr =>
                    colorizeHarakaAndMadd(String(stepStr)).replace(/\(([^\)]+)\)/g, '<span class="apply-hl-target">$1</span>')
                );
            }
            let rawText = (defData && defData.apply && defData.apply.text)
                ? defData.apply.text
                : "أُطَبِّقُ مَا تَعَلَّمْتُهُ اليَوْمَ (بِنَشَاطٍ وَسُرُورْ).";

            let parts = rawText.split(/[،.؛]/).map(s => s.trim()).filter(Boolean);
            if (parts.length === 0) parts = [rawText];

            return parts.map(stepStr =>
                colorizeHarakaAndMadd(stepStr).replace(/\(([^\)]+)\)/g, '<span class="apply-hl-target">$1</span>')
            );
        }

        function renderApplyStation(contentDiv, defData) {
            let card = document.createElement('div');
            card.className = 'fancy-card apply-structured-card';

            if (defData && defData.apply && defData.apply.img) {
                let imgWrap = document.createElement('div');
                imgWrap.style.position = 'relative';
                imgWrap.style.display = 'flex';
                imgWrap.style.justifyContent = 'center';
                let imgEl = document.createElement('img');
                imgEl.className = 'apply-img-preview';
                imgEl.src = defData.apply.img;
                imgEl.dataset.editAssetKey = 'apply_img';
                imgEl.onerror = function() { if (!this.dataset.extTried) this.style.display = 'none'; };
                imgWrap.appendChild(imgEl);
                card.appendChild(imgWrap);
            }

            let stepsArr = formatApplySteps(defData);
            let stepsContainer = document.createElement('div');
            stepsContainer.className = 'apply-steps-list';

            stepsArr.forEach((stHtml, idx) => {
                let row = document.createElement('div');
                row.className = 'apply-step-row';
                row.innerHTML = `
                    <span class="apply-step-num">${idx + 1}</span>
                    <div class="apply-step-text" data-edit-field="apply_step_${idx}">${stHtml}</div>
                `;
                stepsContainer.appendChild(row);
            });

            card.appendChild(stepsContainer);
            contentDiv.appendChild(card);

            let rawSteps = defData?.apply?.applyTTS || defData?.apply?.pocoyoScene?.narratorTTS || ((defData && defData.apply && Array.isArray(defData.apply.steps) && defData.apply.steps.length > 0) ? defData.apply.steps.join(' ، ') : stepsArr.join(' ، '));
            speakText(rawSteps, () => {
                updateNavButtons(true);
                showCenterAction(() => completeLesson(activeViewSubj), true);
            });
            if (isSecretEditMode) attachEditHooksToCurrentStation(defData);
        }

        // ================= ٥. المحرك الرئيسي لعرض المحطات الست + البدء الدائم من الشريحة الأولى (0) =================
        function getIntroBannerInfo(defData) {
            let letterChar = getAbjadChar(playWeek - 1);
            let abjadVal = getAbjadNum(playWeek - 1);
            if (defData && defData.learn && defData.learn.introTitle && defData.learn.introGoal) {
                return { title: defData.learn.introTitle, goal: defData.learn.introGoal };
            }
            return {
                title: `دَرْسُ حَرْفِ (${letterChar}) — (${abjadVal})`,
                goal: `لِنَتَعَلَّمَ الحِكْمَةَ وَالعِلْمَ النَّافِعَ وَنُطَبِّقَهُ بِنَشَاطْ!`
            };
        }

        function renderCurrentStep() {
            let currentData = getActiveCurriculumObj();

            // تصفير عداد الشريحة فور الخروج من محطة العرض (1) لضمان فتح أي درس قادم من الصفحة الأولى دوماً
            if (globalStep !== 1) {
                window._activeSlideIdx = 0;
                window._lastSlideLessonKey = null;
            }

            if (SCHOOL_YEAR === 1 && !isSecretEditMode) {
                // إيقاف أي موسيقى خلفية أو ناطق آلي تماماً في السنة الأولى ليبقى صوت الفيديو فقط
                isMusicPlaying = false;
                currentMusicIndex = -1;
                try {
                    const bgM = document.getElementById('bg-music');
                    if (bgM) { bgM.pause(); bgM.removeAttribute('src'); }
                    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                    const cAud = document.getElementById('custom-audio');
                    if (cAud) cAud.pause();
                } catch (_) {}
                if (globalStep === 0) globalStep = 1;
                else if (globalStep > 1) { completeLesson(activeViewSubj); return; }
            }

            if (!isSecretEditMode) {
                if (globalStep === 1 && currentData && currentData.learn && currentData.learn.skipSom) {
                    globalStep = (SCHOOL_YEAR === 2) ? 5 : 2;
                    renderCurrentStep();
                    return;
                }
                if (globalStep === 4 && currentData && currentData.play && currentData.play.skipGift) {
                    globalStep = 5;
                    renderCurrentStep();
                    return;
                }
            }

            updateNavButtons(false);
            let contentDiv = document.getElementById('main-content');
            contentDiv.innerHTML = '';

            const defaultImg = STAGE_PRIMARY_IMG[STAGE_GROUP];
            let defData = currentData || {
                learn: { slides: [{ img: defaultImg, text: 'مَرْحَبًا بِكَ فِي مَدْرَسَةِ العِلْمْ.' }] },
                play: {},
                apply: { steps: ["أُطَبِّقُ (المَعْرِفَةَ اليَوْمَ) بِسُرُورٍ وَنَشَاطْ."] }
            };

            const yFolder = `assets/y${RAW_YEAR}`;
            const defaultVidPath = `${yFolder}/videos/v${playWeek}.mp4`;
            const defaultArtPath = `${yFolder}/art/art${playWeek}.jpg`;
            const defaultSportPath = `${yFolder}/sports/sprt${playWeek}.jpg`;
            const defaultSciPath = (RAW_YEAR >= 7) ? `${yFolder}/scince/s${playWeek}.1.jpg` : `${yFolder}/scince/s${playWeek}.jpg`;
            const defaultRightPath = `${yFolder}/rights/r${playWeek}.jpg`;

            const subjDefaultImgMap = {
                1: defaultArtPath, 2: defaultArtPath, 3: defaultArtPath, 4: defaultArtPath,
                5: defaultSportPath, 6: defaultSciPath, 7: defaultRightPath
            };
            const activeDefaultImg = subjDefaultImgMap[activeViewSubj] || defaultImg;

            // ---------------- 0. محطة الصلاة (التعريف بالدرس) ----------------
            if (globalStep === 0) {
                let bannerInfo = getIntroBannerInfo(defData);
                let card = document.createElement('div');
                card.className = 'fancy-card';
                card.style.padding = '0';

                let slideImgSrc = defData.learn?.coverImg || activeDefaultImg;
                let percentRevealed = (activeViewSubj / 7) * 100;

                card.innerHTML = `
                <div class="intro-reveal-stage">
                    <div class="intro-Formatted-backdrop"></div>
                    <img src="${slideImgSrc}" class="intro-img-gray" >
                    <img src="${slideImgSrc}" class="intro-img-color"  data-edit-asset-key="cover_img" style="clip-path: inset(0 0 0 calc(100% - ${percentRevealed}%));">
                    <div class="intro-info-banner">
                        <h2 class="intro-info-title" data-edit-field="intro_title">${colorizeHarakaAndMadd(bannerInfo.title)}</h2>
                        <p class="intro-info-desc" data-edit-field="intro_goal">${colorizeHarakaAndMadd(bannerInfo.goal)}</p>
                    </div>
                </div>`;

                contentDiv.appendChild(card);

                showCenterAction(() => handleNextClick(), false, SUBJ_EMOJIS[activeViewSubj]);
                updateNavButtons(true);
                speakText(defData.learn?.introTTS || `${bannerInfo.title} ، ${bannerInfo.goal}`, () => {
                    showCenterAction(() => handleNextClick(), false, SUBJ_EMOJIS[activeViewSubj]);
                    updateNavButtons(true);
                }, defData.learn?.audio);
                if (isSecretEditMode) attachEditHooksToCurrentStation(defData);
            }

            // ---------------- 1. محطة الصوم (العرض الذكي: يبدأ دائماً من الشريحة الأولى 0 عند فتح أي درس) ----------------
            else if (globalStep === 1) {
                const currentLessonSlideKey = `${playWeek}_${activeViewSubj}`;
                if (window._lastSlideLessonKey !== currentLessonSlideKey) {
                    window._activeSlideIdx = 0;
                    window._lastSlideLessonKey = currentLessonSlideKey;
                }

                if (isSecretEditMode) {
                    let editControlsHTML = `
                        <div style="display:flex; gap:6px; flex-wrap:wrap;">
                            <button class="skip-gift-btn" onclick="window.setSomDisplayMode('video')">🎬 وضع الفيديو</button>
                            <button class="skip-gift-btn" onclick="window.setSomDisplayMode('slides')">📖 وضع الشرائح والنصوص</button>
                            <button class="skip-gift-btn" style="border-color:#22c55e; color:#15803d;" onclick="window.addSomSlide()">➕ شريحة جديدة</button>
                            <button class="skip-gift-btn" style="border-color:#ef4444; color:#b91c1c;" onclick="window.removeSomVideoOrSlide()">🗑️ حذف الفيديو/الشريحة</button>
                        </div>
                    `;
                    createRoomHeader(contentDiv, 'إعداد محطة العرض (فيديو تلقائي أو شرائح)', editControlsHTML);
                }

                window.setSomDisplayMode = (mode) => {
                    if (!defData.learn) defData.learn = {};
                    window._touchedLessons[`${playWeek}_${activeViewSubj}`] = true;
                    if (mode === 'slides') {
                        defData.learn.preferSlidesOnly = true;
                        defData.learn.useVideo = false;
                    } else {
                        defData.learn.preferSlidesOnly = false;
                        defData.learn.useVideo = true;
                    }
                    renderCurrentStep();
                };

                window.addSomSlide = () => {
                    if (!defData.learn) defData.learn = {};
                    if (!Array.isArray(defData.learn.slides)) defData.learn.slides = [];
                    window._touchedLessons[`${playWeek}_${activeViewSubj}`] = true;
                    defData.learn.preferSlidesOnly = true;
                    defData.learn.useVideo = false;
                    defData.learn.slides.push({ img: activeDefaultImg, text: 'نَصُّ الشَّرِيحَةِ الجَدِيدَةِ...' });
                    window._lastSlideLessonKey = `${playWeek}_${activeViewSubj}`;
                    window._activeSlideIdx = defData.learn.slides.length - 1;
                    renderCurrentStep();
                };

                window.removeSomVideoOrSlide = () => {
                    if (!defData.learn) return;
                    window._touchedLessons[`${playWeek}_${activeViewSubj}`] = true;
                    if (!defData.learn.preferSlidesOnly && defData.learn.useVideo !== false) {
                        defData.learn.video = '';
                        defData.learn.useVideo = false;
                        defData.learn.preferSlidesOnly = true;
                        renderCurrentStep();
                        return;
                    }
                    if (Array.isArray(defData.learn.slides) && defData.learn.slides.length > 1) {
                        let sIdx = window._activeSlideIdx || 0;
                        defData.learn.slides.splice(sIdx, 1);
                        window._activeSlideIdx = Math.max(0, sIdx - 1);
                        renderCurrentStep();
                    }
                };

                const renderSlidesFallbackView = () => {
                    contentDiv.querySelectorAll('.fancy-card').forEach(c => c.remove());

                    let card = document.createElement('div');
                    card.className = 'fancy-card';
                    let slides = (defData.learn?.slides && defData.learn.slides.length > 0) ? defData.learn.slides : [
                        { img: activeDefaultImg, text: `دَرْسُ حَرْفِ (${getAbjadChar(playWeek - 1)})` }
                    ];
                    let currentSlide = Math.min(window._activeSlideIdx || 0, slides.length - 1);

                    let sliderContainer = document.createElement('div');
                    sliderContainer.className = 'slider-container';
                    let imgBox = document.createElement('div');
                    imgBox.className = 'slider-image-box';
                    let imgEl = document.createElement('img');
                    imgEl.className = 'pan-zoom-img';
                    imgEl.dataset.editAssetKey = 'slide_img';
                    

                    let cardStageEl = document.createElement('div');
                    cardStageEl.className = 'auto-flashcard-stage';
                    cardStageEl.style.display = 'none';

                    let clickOverlay = document.createElement('div');
                    clickOverlay.style.cssText = "position:absolute; top:0; left:0; width:100%; height:100%; z-index:5; cursor:pointer;";

                    let nextBtn = document.createElement('button');
                    nextBtn.className = 'slider-nav-btn next';
                    nextBtn.innerHTML = '❮';
                    let prevBtn = document.createElement('button');
                    prevBtn.className = 'slider-nav-btn prev';
                    prevBtn.innerHTML = '❯';

                    let textBox = document.createElement('div');
                    textBox.className = 'slider-text-box';
                    let textContent = document.createElement('div');
                    textContent.className = 'slider-text-content';
                    textContent.dataset.editField = 'slide_text';
                    let ttsControlsWrap = document.createElement('div');
                    ttsControlsWrap.className = 'slider-tts-controls';

                    let soundIcon = document.createElement('div');
                    soundIcon.innerHTML = '🔊';
                    soundIcon.className = 'glass-audio-btn';
                    ttsControlsWrap.appendChild(soundIcon);

                    let isSlideAutoPlay = false;
                    let lineReadSession = 0;
                    let autoAdvanceTimer = null;
                    let autoPlayBtn = null;

                    const clearLineHighlight = () => {
                        textContent.querySelectorAll('.tts-line-item.active-reading-line').forEach(el => {
                            el.classList.remove('active-reading-line');
                        });
                    };

                    const setAutoPlayUI = (active) => {
                        isSlideAutoPlay = active;
                        if (autoPlayBtn) {
                            autoPlayBtn.innerHTML = active ? '⏸' : '▶';
                            autoPlayBtn.classList.toggle('is-playing', active);
                            autoPlayBtn.title = active ? 'إيقاف التشغيل التلقائي' : 'تشغيل الشرائح تلقائياً';
                        }
                    };

                    const stopAllSlideReading = () => {
                        lineReadSession++;
                        clearTimeout(autoAdvanceTimer);
                        setAutoPlayUI(false);
                        clearLineHighlight();
                    };
                    window._stopActiveSlideAutoAndLine = stopAllSlideReading;

                    if (slides.length > 1) {
                        autoPlayBtn = document.createElement('div');
                        autoPlayBtn.innerHTML = '▶';
                        autoPlayBtn.className = 'glass-autoplay-btn';
                        autoPlayBtn.title = 'تشغيل الشرائح تلقائياً';
                        ttsControlsWrap.appendChild(autoPlayBtn);
                        autoPlayBtn.onclick = (e) => {
                            e.stopPropagation();
                            if (isSlideAutoPlay) {
                                stopAllSlideReading();
                                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                            } else {
                                setAutoPlayUI(true);
                                playCurrentSlideAudio(() => updateNavButtons(true));
                            }
                        };
                    }

                    textBox.appendChild(textContent);
                    textBox.appendChild(ttsControlsWrap);

                    const splitSlideIntoBalancedLines = (rawText) => {
                        let str = String(rawText || '').trim();
                        if (!str) return [];
                        let rawChunks = str.split(/(?<=[.،!؟؛\n])\s+/).map(p => p.trim()).filter(Boolean);
                        if (rawChunks.length <= 1) return [str];
                        let merged = [];
                        let buffer = '';
                        for (let ch of rawChunks) {
                            let plainLen = (buffer + ' ' + ch).replace(/[\u064B-\u0652\u0670]/g, '').trim().length;
                            if (!buffer) {
                                buffer = ch;
                            } else if (plainLen < 42 && !/[.!؟\n]$/.test(buffer)) {
                                buffer += ' ' + ch;
                            } else {
                                merged.push(buffer);
                                buffer = ch;
                            }
                        }
                        if (buffer) merged.push(buffer);
                        return merged;
                    };

                    const renderSlideLines = (rawText) => {
                        lineReadSession++;
                        clearLineHighlight();
                        if (isSecretEditMode) {
                            textContent.innerHTML = colorizeHarakaAndMadd(rawText);
                            return;
                        }
                        let lines = splitSlideIntoBalancedLines(rawText);
                        if (lines.length === 0) {
                            textContent.innerHTML = '';
                            return;
                        }
                        textContent.innerHTML = lines.map((ln, idx) =>
                            `<span class="tts-line-item" data-line-idx="${idx}">${colorizeHarakaAndMadd(ln)}</span>`
                        ).join('');
                    };

                    const playCurrentSlideAudio = (onDone) => {
                        let s = slides[currentSlide];
                        if (activeViewSubj === 3 && s.cardData) {
                            playEarTone(s.cardData.feature || s.text);
                        }

                        const handleSlideFinished = () => {
                            clearLineHighlight();
                            if (onDone) onDone();
                            if (isSlideAutoPlay && !isSecretEditMode) {
                                if (currentSlide < slides.length - 1) {
                                    clearTimeout(autoAdvanceTimer);
                                    let waitMs = isTTSActive ? 500 : 3200;
                                    autoAdvanceTimer = setTimeout(() => {
                                        if (!isSlideAutoPlay) return;
                                        currentSlide++;
                                        updateSlider();
                                        playCurrentSlideAudio(() => updateNavButtons(true));
                                    }, waitMs);
                                } else {
                                    setAutoPlayUI(false);
                                    updateNavButtons(true);
                                }
                            }
                        };

                        if (s.tts || isSecretEditMode) {
                            speakText(s.tts || s.text, handleSlideFinished);
                            return;
                        }

                        let lineEls = Array.from(textContent.querySelectorAll('.tts-line-item'));
                        if (lineEls.length === 0 || !isTTSActive) {
                            speakText(s.text, handleSlideFinished);
                            return;
                        }

                        lineReadSession++;
                        clearLineHighlight();
                        const mySession = lineReadSession;
                        let idx = 0;

                        const readNextLine = () => {
                            if (mySession !== lineReadSession || !isTTSActive) {
                                clearLineHighlight();
                                return;
                            }
                            clearLineHighlight();
                            if (idx >= lineEls.length) {
                                handleSlideFinished();
                                return;
                            }
                            let curEl = lineEls[idx];
                            curEl.classList.add('active-reading-line');
                            curEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            let lineText = curEl.textContent || '';
                            idx++;
                            speakText(lineText, () => {
                                if (mySession === lineReadSession) {
                                    setTimeout(readNextLine, 50);
                                }
                            });
                        };

                        readNextLine();
                    };

                    const updateSlider = () => {
                        let s = slides[currentSlide];
                        window._activeSlideIdx = currentSlide;
                        clickOverlay.style.display = isSecretEditMode ? 'none' : 'block';

                        if (s.cardData) {
                            sliderContainer.classList.remove('has-img-and-text');
                            imgEl.style.display = 'none';
                            cardStageEl.style.display = 'flex';
                            cardStageEl.style.backgroundImage = s.cardData.bgImg
                                ? `url('${s.cardData.bgImg}'), var(--stage-bg-image)`
                                : `var(--stage-bg-image)`;
                            let modeClass = s.cardData.mode || (activeViewSubj === 2 ? 'eye-card' : (activeViewSubj === 3 ? 'ear-card' : 'hand-card'));
                            let letterChar = getAbjadChar(playWeek - 1);
                            let coloredWord = s.cardData.noHighlight
                                ? colorizeHarakaAndMadd(s.cardData.word)
                                : highlightTargetChar(s.cardData.word, letterChar);
                            let coloredGlyph = colorizeHarakaAndMadd(s.cardData.glyph || letterChar);
                            let tokensHTML = s.cardData.visualTokens ? `<div class="fc-visual-tokens" data-edit-field="card_tokens">${s.cardData.visualTokens}</div>` : '';

                            cardStageEl.innerHTML = `
                                <div class="auto-flashcard-box ${modeClass}">
                                    <div class="fc-top-row">
                                        <span class="fc-tag">${s.cardData.tag || SUBJ_TITLES[activeViewSubj]} (${currentSlide + 1}/${slides.length})</span>
                                        <span class="fc-glyph" data-edit-field="card_glyph">${coloredGlyph}</span>
                                    </div>
                                    <h1 class="fc-word-main" data-edit-field="card_word">${coloredWord}</h1>
                                    ${tokensHTML}
                                    <div class="fc-bottom-pill" data-edit-field="card_feature">${colorizeHarakaAndMadd(s.cardData.feature || '')}</div>
                                </div>`;
                        } else {
                            cardStageEl.style.display = 'none';
                            imgEl.style.display = 'block';
                            imgEl.src = s.img || activeDefaultImg;
                            if (s.text && String(s.text).trim().length > 0 && SCHOOL_YEAR >= 5) {
                                sliderContainer.classList.add('has-img-and-text');
                            } else {
                                sliderContainer.classList.remove('has-img-and-text');
                            }
                        }
                        renderSlideLines(s.text);
                        prevBtn.style.display = currentSlide === 0 ? 'none' : 'flex';
                        nextBtn.style.display = currentSlide === slides.length - 1 ? 'none' : 'flex';
                        if (isSecretEditMode) attachEditHooksToCurrentStation(defData);
                    };

                    nextBtn.onclick = (e) => { e.stopPropagation(); stopAllSlideReading(); if ('speechSynthesis' in window) window.speechSynthesis.cancel(); if (currentSlide < slides.length - 1) { currentSlide++; updateSlider(); playCurrentSlideAudio(); } };
                    prevBtn.onclick = (e) => { e.stopPropagation(); stopAllSlideReading(); if ('speechSynthesis' in window) window.speechSynthesis.cancel(); if (currentSlide > 0) { currentSlide--; updateSlider(); playCurrentSlideAudio(); } };
                    clickOverlay.onclick = (e) => { e.stopPropagation(); playCurrentSlideAudio(); };
                    soundIcon.onclick = (e) => { e.stopPropagation(); playCurrentSlideAudio(); };

                    imgBox.appendChild(imgEl);
                    imgBox.appendChild(cardStageEl);
                    imgBox.appendChild(clickOverlay);
                    if (slides.length > 1) { imgBox.appendChild(prevBtn); imgBox.appendChild(nextBtn); }
                    sliderContainer.appendChild(imgBox);
                    sliderContainer.appendChild(textBox);
                    card.appendChild(sliderContainer);
                    contentDiv.appendChild(card);

                    updateSlider();
                    updateNavButtons(true);
                    showCenterAction(() => handleNextClick(), false, null);
                    playCurrentSlideAudio(() => {
                        updateNavButtons(true);
                        showCenterAction(() => handleNextClick(), false, null);
                    });
                };

                let preferSlides = (defData.learn?.preferSlidesOnly === true);
                let hasCustomVideo = Boolean(defData.learn?.video && String(defData.learn.video).startsWith('data:video'));

                // سياسة الفيديوهات حسب الصفوف:
                // - الصف الأول (SCHOOL_YEAR === 1): فيديوهات فقط (الفيديوهات الـ 8 الموزعة على الأسابيع)
                // - الصفوف 2 إلى 5 (SCHOOL_YEAR >= 2 && SCHOOL_YEAR <= 5): بدون فيديوهات إطلاقاً (شرائح فقط إلا إذا رفع المعلم فيديو مخصصاً في وضع التعديل)
                // - الصفان 6 و7 (SCHOOL_YEAR === 6 || SCHOOL_YEAR === 7): زر الفيديو يضاء ويعمل الفيديو إن وُجد ملف فيديو خاص بالدرس، ويبدو الزر مطفأ وتظهر الشرائح إن لم يوجد
                let isGrades2To5 = (SCHOOL_YEAR >= 2 && SCHOOL_YEAR <= 5);
                let isGrades6Or7 = (SCHOOL_YEAR === 6 || SCHOOL_YEAR === 7);

                if (isGrades2To5 && !hasCustomVideo) {
                    renderSlidesFallbackView();
                } else if (SCHOOL_YEAR === 1) {
                    // في السنة الأولى: 7 فيديوهات عبر الأختام السبعة (1 -> v1.mp4 ... 7 -> v7.mp4) بأزرار التحكم العالمية المعتادة وبدون موسيقى خارجية أو ناطق آلي
                    let sealVidIdx = Math.min(7, Math.max(1, activeViewSubj));
                    let candidateVideos = [];
                    if (defData.learn?.video) candidateVideos.push(defData.learn.video);
                    candidateVideos.push(
                        `assets/y1/videos/v${sealVidIdx}.mp4`,
                        `assets/videos/v${sealVidIdx}.mp4`,
                        `v${sealVidIdx}.mp4`
                    );
                    candidateVideos = [...new Set(candidateVideos.filter(Boolean))];

                    let card = document.createElement('div');
                    card.className = 'fancy-card y1-pure-video-card';
                    card.innerHTML = `
                        <div class="video-wrapper-box">
                            <video id="lesson-video" data-edit-asset-key="lesson_video" poster="${defData.learn?.coverImg || `assets/y4/art/art${sealVidIdx}.jpg`}" class="media-box-vid" controls controlsList="nodownload" playsinline preload="metadata"></video>
                        </div>`;
                    contentDiv.appendChild(card);

                    let vidEl = document.getElementById('lesson-video');
                    let currentCandidateIdx = 0;

                    const tryLoadY1Video = () => {
                        if (currentCandidateIdx < candidateVideos.length) {
                            vidEl.src = candidateVideos[currentCandidateIdx];
                            vidEl.load();
                            vidEl.onloadeddata = () => {
                                updateNavButtons(true);
                            };
                        } else if (isSecretEditMode) {
                            updateNavButtons(true);
                            attachEditHooksToCurrentStation(defData);
                        }
                    };

                    vidEl.onerror = () => {
                        currentCandidateIdx++;
                        tryLoadY1Video();
                    };
                    vidEl.onended = () => {
                        if (typeof window.recordYear1VideoWatch === 'function') {
                            window.recordYear1VideoWatch(sealVidIdx);
                        }
                    };

                    tryLoadY1Video();
                    if (isSecretEditMode) attachEditHooksToCurrentStation(defData);
                } else if (isGrades6Or7 || hasCustomVideo) {
                    renderSlidesFallbackView();
                    const fancyCard = contentDiv.querySelector('.fancy-card');
                    const sliderContainer = fancyCard ? fancyCard.querySelector('.slider-container') : null;
                    if (fancyCard && sliderContainer) {
                        let candidateVideos = [];
                        if (defData.learn?.video && String(defData.learn.video).startsWith('data:video')) {
                            candidateVideos.push(defData.learn.video);
                        } else {
                            if (activeViewSubj === 1) {
                                if (defData.learn?.video) candidateVideos.push(defData.learn.video);
                                candidateVideos.push(`${yFolder}/videos/v${playWeek}.mp4`, `${yFolder}/videos/v${playWeek}_s1.mp4`);
                            } else {
                                candidateVideos.push(`${yFolder}/videos/v${playWeek}_s${activeViewSubj}.mp4`);
                            }
                        }
                        candidateVideos = [...new Set(candidateVideos.filter(Boolean))];

                        let miniBtn = document.createElement('button');
                        miniBtn.type = 'button';
                        miniBtn.id = 'stage1-sawm-mini-video-btn';
                        miniBtn.className = 'video-btn-dimmed';
                        miniBtn.innerHTML = '🎬';
                        miniBtn.disabled = true;
                        fancyCard.appendChild(miniBtn);

                        let isShowingVideo = false;
                        let resolvedVideoUrl = null;

                        const toggleInlineVideo = () => {
                            if (!resolvedVideoUrl) return;
                            let vidStage = fancyCard.querySelector('.sawm-inline-video-stage');
                            if (!isShowingVideo) {
                                isShowingVideo = true;
                                if (window._stopActiveSlideAutoAndLine) window._stopActiveSlideAutoAndLine();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                                sliderContainer.style.display = 'none';
                                if (!vidStage) {
                                    vidStage = document.createElement('div');
                                    vidStage.className = 'sawm-inline-video-stage';
                                    vidStage.innerHTML = `<video id="lesson-video" data-edit-asset-key="lesson_video" poster="${defData.learn?.coverImg || activeDefaultImg}" class="media-box-vid" controls playsinline preload="metadata" src="${resolvedVideoUrl}"></video>`;
                                    fancyCard.appendChild(vidStage);
                                    const vEl = vidStage.querySelector('video');
                                    const bgMusic = document.getElementById('bg-music');
                                    if (vEl) {
                                        vEl.onplay = () => { if (isMusicPlaying && bgMusic) bgMusic.volume = 0.02; };
                                        vEl.onpause = () => { if (isMusicPlaying && bgMusic) bgMusic.volume = 0.15; };
                                        vEl.onended = () => {
                                            if (isMusicPlaying && bgMusic) bgMusic.volume = 0.15;
                                            updateNavButtons(true);
                                        };
                                    }
                                } else {
                                    vidStage.style.display = 'flex';
                                }
                                const vEl = vidStage.querySelector('video');
                                if (vEl && !isSecretEditMode) vEl.play().catch(() => {});
                                miniBtn.innerHTML = '📖';
                                updateNavButtons(true);
                            } else {
                                isShowingVideo = false;
                                if (vidStage) {
                                    const vEl = vidStage.querySelector('video');
                                    if (vEl) vEl.pause();
                                    vidStage.style.display = 'none';
                                }
                                sliderContainer.style.display = '';
                                miniBtn.innerHTML = '🎬';
                            }
                        };

                        window._stage1VideoCache = window._stage1VideoCache || {};
                        const probeCandidates = (idx) => {
                            if (idx >= candidateVideos.length) return;
                            const url = candidateVideos[idx];
                            const onResult = (ok) => {
                                if (!document.body.contains(miniBtn)) return;
                                if (ok) {
                                    resolvedVideoUrl = url;
                                    miniBtn.className = 'video-btn-lit';
                                    miniBtn.disabled = false;
                                    miniBtn.onclick = (ev) => { ev.stopPropagation(); toggleInlineVideo(); };
                                    if (!preferSlides || hasCustomVideo) toggleInlineVideo();
                                } else {
                                    probeCandidates(idx + 1);
                                }
                            };
                            if (url.startsWith('data:video')) { onResult(true); return; }
                            if (Object.prototype.hasOwnProperty.call(window._stage1VideoCache, url)) {
                                onResult(window._stage1VideoCache[url]);
                                return;
                            }
                            const pv = document.createElement('video');
                            let done = false;
                            const finishProbe = (res) => {
                                if (done) return;
                                done = true;
                                window._stage1VideoCache[url] = res;
                                pv.removeAttribute('src');
                                pv.load();
                                onResult(res);
                            };
                            const tmr = setTimeout(() => finishProbe(false), 1400);
                            pv.preload = 'metadata';
                            pv.onloadedmetadata = () => { clearTimeout(tmr); finishProbe(true); };
                            pv.onerror = () => { clearTimeout(tmr); finishProbe(false); };
                            pv.src = url;
                        };
                        probeCandidates(0);
                    }
                }
            }

            // ---------------- 2. محطة الحج (الأسئلة) ----------------
            else if (globalStep === 2) {
                if (currentQuestionIdx === 0 && !isSecretEditMode) {
                    subjCoinsList = new Array(MAX_COINS_FOR_YEAR).fill('empty');
                    hajjErrorsCount = 0;
                    saveSubjCoins(playWeek, activeViewSubj, subjCoinsList);
                    updateHeaderScoreUI();
                }
                renderQuizStation(contentDiv, defData);
            }

            // ---------------- 3. محطة الصدقة (التوصيل مع قفل الخيار الخاطئ) ----------------
            else if (globalStep === 3) {
                if (!isSadaqahRequired() && !isSecretEditMode) { handleNextClick(); return; }
                renderSadaqahMatchingStation(contentDiv, defData);
            }

            // ---------------- 4. محطة الهدية (فقاعات الهدايا وصندوق المفاجآت) ----------------
            else if (globalStep === 4) {
                renderGiftBasketStation(contentDiv, defData);
            }

            // ---------------- 5. محطة التطبيق العملي والكتابة الورقية ----------------
            else if (globalStep === 5) {
                renderApplyStation(contentDiv, defData);
            }
        }

        function completeLesson(subjId) {
            playCorrectChime();
            if (!isSecretEditMode) {
                localStorage.setItem(`seal_done_${SAVE_KEY}_w${playWeek}_s${subjId}`, 'true');
                if (typeof window.syncAl3lmStudentProgressSnapshot === 'function') window.syncAl3lmStudentProgressSnapshot();
            }
            updateSealBatteriesUI();
            let contentDiv = document.getElementById('main-content');
            document.getElementById('next-btn').disabled = true;
            document.getElementById('prev-btn').disabled = true;

            if (isFreeExplore || isReviewMode || isSecretEditMode) {
                contentDiv.innerHTML = `<div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100%; width:100%;"><div style="font-size: clamp(6rem, 22vmin, 11rem);">🔓</div><h1 style="color:#0369a1;">تَمَّ الاِسْتِكْشَافُ</h1></div>`;
                setTimeout(() => {
                    if (subjId < 7) { activeViewSubj = subjId + 1; initApp(); }
                    else { activeViewSubj = 1; initApp(); }
                }, 1100);
                return;
            }

            if (subjId < 7) {
                contentDiv.innerHTML = `<div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100%; width:100%;"><div style="font-size: clamp(7rem, 26vmin, 13rem);">⭐</div><h1 style="color:#15803d;">أَحْسَنْت!</h1></div>`;
                speakText('أَحْسَنْت! أَتْمَمْتَ الدَّرْسْ', () => {
                    if (playWeek === actualWeek && subjId === actualSubj) {
                        actualSubj++;
                        localStorage.setItem(`student_subj_${SAVE_KEY}`, actualSubj);
                    }
                    if (subjId === playMaxSubj) playMaxSubj++;
                    activeViewSubj = subjId + 1;
                    initApp();
                });
            } else {
                if (playWeek === actualWeek && subjId === actualSubj) {
                    actualSubj = 1;
                    if (actualWeek < TOTAL_WEEKS) actualWeek++;
                    localStorage.setItem(`student_week_${SAVE_KEY}`, actualWeek);
                    localStorage.setItem(`student_subj_${SAVE_KEY}`, actualSubj);
                }
                const finishedW = Math.max(1, actualWeek - 1);
                const finishedLtr = getAbjadChar(finishedW - 1);
                const relScore = typeof getWeekRelativeScore === 'function' ? getWeekRelativeScore(finishedW) : 3;
                const maxPer = Math.max(1, typeof MAX_COINS_FOR_YEAR !== 'undefined' ? MAX_COINS_FOR_YEAR : 3);
                const scoreStr = `${relScore} / ${maxPer} ⭐`;
                if (typeof window.recordUnitCompletionAndExitToStudentPortal === 'function') {
                    window.recordUnitCompletionAndExitToStudentPortal(contentDiv, {
                        year: RAW_YEAR,
                        week: finishedW,
                        letter: finishedLtr,
                        title: `حرف (${finishedLtr}) — الوحدة ${finishedW}`,
                        score: scoreStr
                    });
                }
            }
        }

        // ================= ٦. محرك التوريث التنازلي الشامل للصور (y7 -> y6 -> ... -> y1) دون تكرار طلبات 404 =================
        (function setupUnifiedCascadingAssetEngine() {
            const EXT_LIST = ['.jpg', '.png', '.webp', '.jpeg', '.gif'];
            const resolvedCache = {};
            let lastWorkingSlideSrc = '';
            let lastLessonKey = '';

            function getLessonKey() {
                return `y${RAW_YEAR}_w${playWeek}_s${activeViewSubj}`;
            }

            function getFolderAliases(folderName) {
                const f = String(folderName || '').toLowerCase();
                if (f === 'sports' || f === 'sport') return ['sports', 'sport'];
                if (f === 'scince' || f === 'science') return ['scince', 'science'];
                if (f === 'rights' || f === 'right') return ['rights', 'right'];
                return [f];
            }

            function buildOrderedCandidates(rawSrc) {
                const cleanSrc = String(rawSrc || '').split('?')[0];
                const m = cleanSrc.match(/^(.*)\.(jpg|png|webp|jpeg|gif)$/i);
                const baseNoExt = m ? m[1] : cleanSrc;
                const candidates = [];
                const add = (u) => { if (u && u !== rawSrc && !candidates.includes(u)) candidates.push(u); };

                if (resolvedCache[cleanSrc]) add(resolvedCache[cleanSrc]);
                if (resolvedCache[baseNoExt]) add(resolvedCache[baseNoExt]);

                // 1) نفس المسار الأساسي بجميع الامتدادات القياسية
                EXT_LIST.forEach(ext => add(baseNoExt + ext));

                // 2) التوريث التدريجي سنةً بسنة من السنة الحالية نزولاً حتى y1 دون القفز فوق أي سنة
                const folderMatch = baseNoExt.match(/^(.*\/)?y(\d+)\/([^\/]+)\/(.+)$/i);
                if (folderMatch) {
                    const prefix = folderMatch[1] || 'assets/';
                    const pathYear = parseInt(folderMatch[2], 10) || 1;
                    const startYear = Math.max(RAW_YEAR, pathYear);
                    const catAliases = getFolderAliases(folderMatch[3]);
                    const exactFile = folderMatch[4];
                    const mainStem = exactFile.replace(/\.\d+$/, '');

                    for (let yr = startYear; yr >= 1; yr--) {
                        catAliases.forEach(cat => {
                            EXT_LIST.forEach(ext => {
                                add(`${prefix}y${yr}/${cat}/${exactFile}${ext}`);
                            });
                        });
                        if (mainStem !== exactFile) {
                            catAliases.forEach(cat => {
                                EXT_LIST.forEach(ext => {
                                    add(`${prefix}y${yr}/${cat}/${mainStem}.1${ext}`);
                                    add(`${prefix}y${yr}/${cat}/${mainStem}${ext}`);
                                });
                            });
                        }
                    }

                    catAliases.forEach(cat => {
                        EXT_LIST.forEach(ext => {
                            add(`${prefix}${cat}/${exactFile}${ext}`);
                            if (mainStem !== exactFile) add(`${prefix}${cat}/${mainStem}${ext}`);
                        });
                    });
                }

                // 3) تثبيت آخر صورة شريحة ناجحة لنفس الدرس قبل الرجوع لخلفية المرحلة
                if (lastWorkingSlideSrc && lastLessonKey === getLessonKey()) {
                    add(lastWorkingSlideSrc);
                }
                add(STAGE_FALLBACK_IMG[STAGE_GROUP]);
                return candidates;
            }

            window.handleSmartImageFallback = function(img) {
                if (!img || img.id === 'brand-home-link') return;
                const currentSrc = img.getAttribute('src') || '';
                if (!currentSrc || currentSrc.startsWith('data:') || currentSrc.startsWith('blob:')) return;

                img.dataset.extTried = 'true';

                if (img._lastFallbackAssigned !== currentSrc) {
                    img.dataset.origSrc = currentSrc;
                    img._assetQueue = buildOrderedCandidates(currentSrc);
                    img._assetIdx = 0;
                }

        function changeEditableFontSize(scaleFactor) {

                const range = sel.getRangeAt(0);
                const parentEl = (range.commonAncestorContainer.nodeType === 1 ? range.commonAncestorContainer : range.commonAncestorContainer.parentElement);
                const currentPx = parseFloat(window.getComputedStyle(parentEl).fontSize) || 24;
                const newPx = Math.max(12, Math.min(130, Math.round(currentPx * scaleFactor)));
                const span = document.createElement('span');
                span.style.fontSize = newPx + 'px';
                try {
                    span.appendChild(range.extractContents());
                    range.insertNode(span);
                    sel.removeAllRanges();

                    newRange.selectNodeContents(span);
                    sel.addRange(newRange);

                const firstChild = lastActiveEditableEl.firstElementChild;
                if (firstChild && firstChild.tagName === 'SPAN' && firstChild.dataset.sizeWrapper === '1' && lastActiveEditableEl.childNodes.length === 1) {

        // قراءة وضغط الصور تلقائياً لتوفير أكثر من 90% من ذاكرة المتصفح
        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                if (file && file.type && file.type.startsWith('image/') && file.type !== 'image/gif' && file.type !== 'image/svg+xml') {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const MAX_DIM = 900;
                            let w = img.width;
                            let h = img.height;
                            if (w > MAX_DIM || h > MAX_DIM) {
                                if (w > h) {
                                    h = Math.round((h * MAX_DIM) / w);
                                    w = MAX_DIM;
                                } else {
                                    w = Math.round((w * MAX_DIM) / h);
                                    h = MAX_DIM;
                                }
                            }
                            const canvas = document.createElement('canvas');
                            canvas.width = w;
                            canvas.height = h;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, w, h);

                            let compressedDataUrl = canvas.toDataURL('image/webp', 0.78);
                            if (!compressedDataUrl.startsWith('data:image/webp')) {
                                compressedDataUrl = canvas.toDataURL('image/jpeg', 0.78);
                            }
                            resolve(compressedDataUrl);
                        };
                        img.onerror = () => resolve(e.target.result);
                        img.src = e.target.result;
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function replaceStationMediaWithFile(mediaEl, file, defData) {
            if (!file || !mediaEl || !defData) return;

            const confirmed = confirm("⚠️ تأكيد الاستبدال:\nهذا الإدخال سيلغي الصورة أو الفيديو الموجود حالياً ويضع الملف الجديد مكانه.\nهل أنت متأكد من المتابعة؟");
            if (!confirmed) return;

            window._touchedLessons[`${playWeek}_${activeViewSubj}`] = true;
            let assetKey = mediaEl.dataset.editAssetKey || '';
            if (!assetKey) {
                if (mediaEl.tagName === 'VIDEO') assetKey = 'lesson_video';
                else if (globalStep === 0) assetKey = 'cover_img';
                else if (globalStep === 1) assetKey = 'slide_img';
                else if (globalStep === 5) assetKey = 'apply_img';
            }

            let sIdx = window._activeSlideIdx || 0;
            const newMediaDataUrl = await readFileAsDataURL(file);

            mediaEl.src = newMediaDataUrl;
            if (mediaEl.tagName === 'VIDEO') mediaEl.load();

            if (assetKey === 'cover_img' && defData.learn) {
                defData.learn.coverImg = newMediaDataUrl;
                let grayEl = document.querySelector('.intro-img-gray');
                if (grayEl) grayEl.src = newMediaDataUrl;
            } else if (assetKey === 'slide_img' && defData.learn?.slides?.[sIdx]) {
                defData.learn.slides[sIdx].img = newMediaDataUrl;
            } else if (assetKey === 'apply_img' && defData.apply) {
                defData.apply.img = newMediaDataUrl;
            } else if (assetKey === 'lesson_video' && defData.learn) {
                defData.learn.video = newMediaDataUrl;
                defData.learn.useVideo = true;
                defData.learn.preferSlidesOnly = false;
            } else if (assetKey.startsWith('q_img_') && sessionHajjQuestions[currentQuestionIdx]) {
                sessionHajjQuestions[currentQuestionIdx].img = newMediaDataUrl;
            }
        }
