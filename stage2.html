                const examUnlocked = isFreeExplore || isSecretEditMode || (actualWeek > endOfSelectedCycle) || (actualWeek === endOfSelectedCycle && actualSubj >= 7);
                const passedBadge = localStorage.getItem(`cycle_exam_passed_${SAVE_KEY}_c${selectedMapCycle}`) === 'true' ? ' ✅' : '';
                examLbl.innerText = `الامتحان التطبيقي الشامل للدورة ${ARABIC_CYCLE_NAMES[selectedMapCycle]} (${toArDigits(cycleOffset + 1)} - ${toArDigits(endOfSelectedCycle)})${passedBadge}`;
                examBtn.classList.toggle('locked', !examUnlocked);
            }

            updateHeaderScoreUI();
        }

        function openCycleComprehensiveExam() {
            const examBtn = document.getElementById('cycle-exam-btn');
            if (examBtn && examBtn.classList.contains('locked')) return;
            closeWeekModal();

            isCycleExamActive = true;
            const cyc = selectedMapCycle;
            const startW = ((cyc - 1) * 28) + 1;
            const endW = cyc * 28;

            let examPool = [];
            const customExams = window.CYCLE_EXAMS_DATA?.[RAW_YEAR]?.[cyc];
            if (Array.isArray(customExams) && customExams.length > 0) {
                examPool = [...customExams];
            } else {
                const sampleWeeks = [startW, startW + 6, startW + 13, startW + 20, endW];
                sampleWeeks.forEach((w, idx) => {
                    const targetSubj = [3, 4, 5, 6, 2][idx % 5];
                    const prevPlayW = playWeek, prevSubj = activeViewSubj;
                    playWeek = w; activeViewSubj = targetSubj;
                    const lessonObj = getActiveCurriculumObj();
                    const picked = pickSingleRandomQuestionFromPool(lessonObj);
                    playWeek = prevPlayW; activeViewSubj = prevSubj;
                    if (picked) examPool.push(picked);
                });
            }

            let contentDiv = document.getElementById('main-content');
            let qIdx = 0;
            let score = 0;

            function renderExamStep() {
                contentDiv.innerHTML = '';
                if (qIdx >= examPool.length) {
                    const pct = Math.round((score / examPool.length) * 100);
                    if (pct >= 60) {
                        localStorage.setItem(`cycle_exam_passed_${SAVE_KEY}_c${cyc}`, 'true');
                        playCorrectChime();
                    }
                    contentDiv.innerHTML = `
                        <div class="fancy-card" style="justify-content:center; gap:16px;">
                            <div style="font-size:clamp(4rem,14vmin,7rem);">${pct >= 60 ? '🏆🌟' : '🧭'}</div>
                            <h2 style="color:#065f46; font-size:clamp(1.4rem,3.8vmin,2.2rem);">نتيجة الامتحان الشامل للدورة ${ARABIC_CYCLE_NAMES[cyc]}</h2>
                            <div style="font-size:1.6rem; font-weight:900; color:#ca8a04;">${toArDigits(score)} / ${toArDigits(examPool.length)} (${toArDigits(pct)}%)</div>
                            <button class="cycle-exam-banner-btn" style="max-width:340px;" onclick="isCycleExamActive=false; initApp();">العودة إلى الدروس</button>
                        </div>`;
                    speakText(`نتيجة الامتحان الشامل هي ${score} من ${examPool.length}`);
                    return;
                }

                let qObj = examPool[qIdx];
                let card = document.createElement('div');
                card.className = 'fancy-card quiz-card';
                card.innerHTML = `
                    <div class="quiz-question-box">
                        <div style="font-size:0.84rem; font-weight:900; color:#ca8a04; margin-bottom:4px;">🏆 الامتحان الشامل للدورة ${ARABIC_CYCLE_NAMES[cyc]} (${toArDigits(qIdx + 1)}/${toArDigits(examPool.length)})</div>
                        <p class="quiz-question-stem">${colorizeHarakaAndMadd(qObj.q || '')}</p>
                        ${qObj.focusWord ? `<div class="quiz-focus-target">${colorizeHarakaAndMadd(qObj.focusWord)}</div>` : ''}
                    </div>`;

                let optsGrid = document.createElement('div');
                let opts = [...(qObj.options || [])].sort(() => Math.random() - 0.5);
                optsGrid.className = `quiz-options-grid ${opts.length <= 2 ? 'grid-2x1' : 'grid-2x2'}`;

                let locked = false;
                opts.forEach(o => {
                    let b = document.createElement('button');
                    b.className = 'quiz-opt-btn opt-sentence';
                    b.innerHTML = `<span class="opt-main-text">${colorizeHarakaAndMadd(o.text)}</span>`;
                    b.onclick = () => {
                        if (locked) return;
                        locked = true;
                        if (o.correct) { b.classList.add('correct'); score++; playCorrectChime(); }
                        else { b.classList.add('wrong'); playWrongTone(); }
                        setTimeout(() => { qIdx++; renderExamStep(); }, 900);
                    };
                    optsGrid.appendChild(b);
                });

                card.appendChild(optsGrid);
                contentDiv.appendChild(card);
                speakText(qObj.q || '');
            }

            renderExamStep();
        }

        function openWeekModal() {
            selectedMapCycle = getCycleFromGlobalWeek(playWeek);
            updateFreeExploreUI();
            updateTTSButtonUI();
            loadCycleScriptIfNeeded(RAW_YEAR, selectedMapCycle, () => {
                buildWeekGrid();
                document.getElementById('week-modal').style.display = 'flex';
            });
        }

        function closeWeekModal(e) {
            if (e) e.stopPropagation();
            document.getElementById('week-modal').style.display = 'none';
        }

        function resetProgress() {
            if (confirm("هل أنت متأكد من مسح إنجازات الطالب في هذه السنة والبدء من الدورة الأولى؟")) {
                localStorage.removeItem(`student_week_${SAVE_KEY}`);
                localStorage.removeItem(`student_subj_${SAVE_KEY}`);
                for (let w = 1; w <= TOTAL_WEEKS; w++) {
                    for (let s = 1; s <= 7; s++) {
                        localStorage.removeItem(`subj_star_${SAVE_KEY}_w${w}_s${s}`);
                        localStorage.removeItem(`subj_bat_${SAVE_KEY}_w${w}_s${s}`);
                    }
                }
                for (let c = 1; c <= 7; c++) localStorage.removeItem(`cycle_exam_passed_${SAVE_KEY}_c${c}`);
                location.reload();
            }
        }
// ==================== [ نهاية القسم 4 من 6 ] ====================
</script>

<script>
// ==================== [ بداية القسم 5 من 6 : العارض التفاعلي والمختبر والسلايد الآلي والسؤال العشوائي والزر السفلي ] ====================
        let _lbScale = 1;
        let _lbPanX = 0;
        let _lbPanY = 0;
        let _lbIsDragging = false;
        let _lbStartX = 0;
        let _lbStartY = 0;
        let _lbPinchStartDist = 0;
        let _lbPinchStartScale = 1;

        // تفعيل التقليب التلقائي للسلايدات افتراضياً عند وجود أكثر من شريحة
        let isAutoAdvanceSlidesActive = localStorage.getItem('auto_advance_slides_stage2') !== 'false';

        function applyLightboxTransform() {
            const img = document.getElementById('lb-target-img');
            if (!img) return;
            img.style.transform = `translate3d(${_lbPanX}px, ${_lbPanY}px, 0) scale(${_lbScale})`;
        }

        function resetLightboxTransform() {
            _lbScale = 1; _lbPanX = 0; _lbPanY = 0;
            applyLightboxTransform();
        }

        function zoomLightbox(delta) {
            _lbScale = Math.max(0.5, Math.min(6, Number((_lbScale + delta).toFixed(2))));
            if (_lbScale <= 1) { _lbPanX = 0; _lbPanY = 0; }
            applyLightboxTransform();
        }

        function openSlideLightbox(imgSrc) {
            if (!imgSrc) return;
            const modal = document.getElementById('slide-lightbox-modal');
            const img = document.getElementById('lb-target-img');
            if (!modal || !img) return;
            img.src = imgSrc;
            resetLightboxTransform();
            modal.classList.add('open');
            modal.setAttribute('aria-hidden', 'false');
        }

        function closeSlideLightbox() {
            const modal = document.getElementById('slide-lightbox-modal');
            if (!modal) return;
            modal.classList.remove('open');
            modal.setAttribute('aria-hidden', 'true');
            resetLightboxTransform();
        }

        async function shareCurrentLightboxImage() {
            const img = document.getElementById('lb-target-img');
            if (!img || !img.src) return;
            try {
                if (navigator.share) { await navigator.share({ url: img.src }); return; }
            } catch (e) {}
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(img.src);
            } catch (e) {}
        }

        (function initLightboxGestures() {
            const viewport = document.getElementById('lb-viewport');
            if (!viewport) return;

            viewport.addEventListener('wheel', (e) => {
                e.preventDefault();
                zoomLightbox(e.deltaY < 0 ? 0.2 : -0.2);
            }, { passive: false });

            viewport.addEventListener('mousedown', (e) => {
                _lbIsDragging = true;
                viewport.classList.add('dragging');
                _lbStartX = e.clientX - _lbPanX;
                _lbStartY = e.clientY - _lbPanY;
            });

            window.addEventListener('mousemove', (e) => {
                if (!_lbIsDragging) return;
                _lbPanX = e.clientX - _lbStartX;
                _lbPanY = e.clientY - _lbStartY;
                applyLightboxTransform();
            });

            window.addEventListener('mouseup', () => {
                if (!_lbIsDragging) return;
                _lbIsDragging = false;
                viewport.classList.remove('dragging');
            });

            function getTouchDist(t1, t2) {
                return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
            }

            viewport.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    _lbIsDragging = false;
                    _lbPinchStartDist = getTouchDist(e.touches[0], e.touches[1]);
                    _lbPinchStartScale = _lbScale;
                } else if (e.touches.length === 1) {
                    _lbIsDragging = true;
                    _lbStartX = e.touches[0].clientX - _lbPanX;
                    _lbStartY = e.touches[0].clientY - _lbPanY;
                }
            }, { passive: true });

            viewport.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    const dist = getTouchDist(e.touches[0], e.touches[1]);
                    if (_lbPinchStartDist > 0) {
                        _lbScale = Math.max(0.5, Math.min(6, Number((_lbPinchStartScale * (dist / _lbPinchStartDist)).toFixed(2))));
                        applyLightboxTransform();
                    }
                } else if (e.touches.length === 1 && _lbIsDragging) {
                    e.preventDefault();
                    _lbPanX = e.touches[0].clientX - _lbStartX;
                    _lbPanY = e.touches[0].clientY - _lbStartY;
                    applyLightboxTransform();
                }
            }, { passive: false });

            viewport.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) _lbPinchStartDist = 0;
                if (e.touches.length === 0) {
                    _lbIsDragging = false;
                    viewport.classList.remove('dragging');
                }
            });
        })();

        // المحرك التفاعلي المدمج الأصلي
        window.InteractiveLabEngine = (function() {
            let activeAnimId = null;
            let activeInterval = null;

            function stopActiveTimers() {
                if (activeAnimId) { cancelAnimationFrame(activeAnimId); activeAnimId = null; }
                if (activeInterval) { clearInterval(activeInterval); activeInterval = null; }
            }

            function render(stageContainer, labData, subjId) {
                stopActiveTimers();
                stageContainer.innerHTML = '';
                const type = labData?.type || (subjId === 4 ? 'pythagoras' : (subjId === 6 ? 'optics_lens' : 'avatar_trainer'));

                const headerPill = document.createElement('div');
                headerPill.className = 'lab-header-pill';
                const canvasWrap = document.createElement('div');
                canvasWrap.className = 'lab-canvas-wrap';
                const controlsBar = document.createElement('div');
                controlsBar.className = 'lab-controls-bar';

                stageContainer.appendChild(headerPill);
                stageContainer.appendChild(canvasWrap);
                stageContainer.appendChild(controlsBar);

                if (type === 'fractions') {
                    headerPill.innerHTML = '<span>مُخْتَبَرُ الكُسُورِ وَالنِّسَبِ</span>';
                    let num = labData.num || 3, den = labData.den || 8;
                    const canvas = document.createElement('canvas');
                    canvas.width = 520; canvas.height = 250;
                    canvasWrap.appendChild(canvas);
                    const ctx = canvas.getContext('2d');

                    function drawFrac() {
                        if (num > den) num = den;
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        const cx = 155, cy = 125, r = 92;
                        for (let i = 0; i < den; i++) {
                            const a1 = (i / den) * Math.PI * 2 - Math.PI / 2;
                            const a2 = ((i + 1) / den) * Math.PI * 2 - Math.PI / 2;
                            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, a1, a2); ctx.closePath();
                            ctx.fillStyle = (i < num) ? '#10b981' : 'rgba(255,255,255,0.1)';
                            ctx.fill(); ctx.strokeStyle = '#fde047'; ctx.lineWidth = 2; ctx.stroke();
                        }
                        const pct = ((num / den) * 100).toFixed(1).replace(/\.0$/, '');
                        ctx.fillStyle = '#fef08a'; ctx.font = 'bold 34px Tajawal, sans-serif'; ctx.textAlign = 'center';
                        ctx.fillText(`${num} من ${den}`, 380, 95);
                        ctx.fillStyle = '#6ee7b7'; ctx.font = 'bold 22px Tajawal, sans-serif';
                        ctx.fillText(`${(num / den).toFixed(2)}  (${pct}%)`, 380, 145);
                    }

                    controlsBar.innerHTML = `
                        <label class="lab-ctrl-group">البسط <input type="range" id="f-num" min="0" max="12" value="${num}"><span class="lab-val-badge" id="f-num-v">${num}</span></label>
                        <label class="lab-ctrl-group">المقام <input type="range" id="f-den" min="1" max="12" value="${den}"><span class="lab-val-badge" id="f-den-v">${den}</span></label>
                    `;
                    const numIn = controlsBar.querySelector('#f-num'), denIn = controlsBar.querySelector('#f-den');
                    numIn.oninput = () => { num = parseInt(numIn.value, 10); if (num > den) { den = num; denIn.value = den; } controlsBar.querySelector('#f-num-v').innerText = num; controlsBar.querySelector('#f-den-v').innerText = den; drawFrac(); };
                    denIn.oninput = () => { den = parseInt(denIn.value, 10); if (num > den) { num = den; numIn.value = num; } controlsBar.querySelector('#f-num-v').innerText = num; controlsBar.querySelector('#f-den-v').innerText = den; drawFrac(); };
                    drawFrac();
                } else if (type === 'pythagoras') {
                    headerPill.innerHTML = '<span>مُخْتَبَرُ الهَنْدَسَةِ وَالمِقْدَارِ</span>';
                    let a = labData.a || 3, b = labData.b || 4;
                    const canvas = document.createElement('canvas');
                    canvas.width = 560; canvas.height = 260;
                    canvasWrap.appendChild(canvas);
                    const ctx = canvas.getContext('2d');

                    function drawPyth() {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        const scale = 18, ox = 190, oy = 185;
                        const pxA = a * scale, pxB = b * scale;
                        const c = Math.sqrt(a * a + b * b);

                        ctx.fillStyle = 'rgba(16, 185, 129, 0.28)'; ctx.strokeStyle = '#10b981'; ctx.lineWidth = 2;
                        ctx.fillRect(ox - pxA, oy - pxA, pxA, pxA); ctx.strokeRect(ox - pxA, oy - pxA, pxA, pxA);

                        ctx.fillStyle = 'rgba(56, 189, 248, 0.28)'; ctx.strokeStyle = '#38bdf8';
                        ctx.fillRect(ox, oy, pxB, pxB * 0.85); ctx.strokeRect(ox, oy, pxB, pxB * 0.85);

                        ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox, oy - pxA); ctx.lineTo(ox + pxB, oy); ctx.closePath();
                        ctx.fillStyle = 'rgba(250, 204, 21, 0.35)'; ctx.fill(); ctx.strokeStyle = '#fde047'; ctx.lineWidth = 3; ctx.stroke();
                        ctx.strokeRect(ox, oy - 12, 12, 12);

                        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 18px Tajawal, sans-serif'; ctx.textAlign = 'right';
                        ctx.fillText(`أ يساوي ${a} ومربعه ${a * a}`, 535, 75);
                        ctx.fillText(`ب يساوي ${b} ومربعه ${b * b}`, 535, 115);
                        ctx.fillStyle = '#fde047'; ctx.font = 'bold 20px Tajawal, sans-serif';
                        ctx.fillText(`الوتر يساوي ${c.toFixed(2).replace(/\.00$/, '')}`, 535, 165);
                    }

                    controlsBar.innerHTML = `
                        <label class="lab-ctrl-group">الضلع الأول <input type="range" id="p-a" min="2" max="8" value="${a}"><span class="lab-val-badge" id="p-a-v">${a}</span></label>
                        <label class="lab-ctrl-group">الضلع الثاني <input type="range" id="p-b" min="2" max="9" value="${b}"><span class="lab-val-badge" id="p-b-v">${b}</span></label>
                    `;
                    controlsBar.querySelector('#p-a').oninput = (e) => { a = +e.target.value; controlsBar.querySelector('#p-a-v').innerText = a; drawPyth(); };
                    controlsBar.querySelector('#p-b').oninput = (e) => { b = +e.target.value; controlsBar.querySelector('#p-b-v').innerText = b; drawPyth(); };
                    drawPyth();
                } else {
                    headerPill.innerHTML = '<span>المُدَرِّبُ الحَرَكِيُّ وَالتَّنَفُّسُ</span>';
                    let currentPose = labData.pose || 0;
                    const POSES = [
                        { name: 'الاستقامة ورفع الذراعين مع الشهيق', lArm: -145, rArm: 145, lLeg: -8, rLeg: 8 },
                        { name: 'التوازن على قدم واحدة وثبات المركز', lArm: -90, rArm: 90, lLeg: 0, rLeg: 55 },
                        { name: 'القرفصاء المعتدلة مع الاتزان', lArm: -75, rArm: 75, lLeg: -32, rLeg: 32 },
                        { name: 'إرخاء الكتفين والزفير الهادئ', lArm: -25, rArm: 25, lLeg: -10, rLeg: 10 }
                    ];

                    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    svg.setAttribute('viewBox', '0 0 420 230');
                    svg.style.width = '100%'; svg.style.height = '100%';
                    canvasWrap.appendChild(svg);

                    let breathPhase = 0;
                    function drawAvatar() {
                        const p = POSES[currentPose % POSES.length];
                        breathPhase += 0.045;
                        const breathR = 26 + Math.sin(breathPhase) * 11;
                        const breathTxt = Math.cos(breathPhase) >= 0 ? 'شهيق' : 'زفير';

                        svg.innerHTML = `
                            <circle cx="330" cy="105" r="${breathR}" fill="rgba(16,185,129,0.28)" stroke="#fde047" stroke-width="2.5"/>
                            <text x="330" y="110" fill="#fef08a" font-size="13" font-weight="900" text-anchor="middle">${breathTxt}</text>
                            <text x="210" y="24" fill="#a7f3d0" font-size="14" font-weight="900" text-anchor="middle">${p.name}</text>
                            <line x1="60" y1="208" x2="240" y2="208" stroke="#34d399" stroke-width="3"/>
                            <circle cx="150" cy="64" r="16" fill="#fde047" stroke="#ffffff" stroke-width="2"/>
                            <line x1="150" y1="80" x2="150" y2="142" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
                            <g transform="translate(150, 90) rotate(${p.lArm})"><line x1="0" y1="0" x2="0" y2="46" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/><circle cx="0" cy="46" r="4.5" fill="#fde047"/></g>
                            <g transform="translate(150, 90) rotate(${p.rArm})"><line x1="0" y1="0" x2="0" y2="46" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/><circle cx="0" cy="46" r="4.5" fill="#fde047"/></g>
                            <g transform="translate(150, 142) rotate(${p.lLeg})"><line x1="0" y1="0" x2="0" y2="60" stroke="#eab308" stroke-width="7" stroke-linecap="round"/></g>
                            <g transform="translate(150, 142) rotate(${p.rLeg})"><line x1="0" y1="0" x2="0" y2="60" stroke="#eab308" stroke-width="7" stroke-linecap="round"/></g>
                        `;
                        activeAnimId = requestAnimationFrame(drawAvatar);
                    }

                    controlsBar.innerHTML = `
                        <button class="lab-action-mini-btn" id="av-prev">السابق</button>
                        <button class="lab-action-mini-btn" id="av-next">التالي</button>
                    `;
                    controlsBar.querySelector('#av-prev').onclick = () => { currentPose = (currentPose + POSES.length - 1) % POSES.length; };
                    controlsBar.querySelector('#av-next').onclick = () => { currentPose = (currentPose + 1) % POSES.length; };
                    drawAvatar();
                }
            }

            return { render, stopActiveTimers };
        })();

        function createRoomHeader(container, shortTitle, extraBtnHTML = '') {
            if (!isSecretEditMode && !extraBtnHTML) return;
            let header = document.createElement('div');
            header.className = 'room-header-box edit-only-bar';
            header.style.display = 'flex';
            header.innerHTML = `<span style="flex:1;">${shortTitle || SUBJ_TITLES[activeViewSubj]}</span>${extraBtnHTML}`;
            container.appendChild(header);
        }

        // زر الانتقال يظهر في الزاوية السفلية اليسرى بدلاً من منتصف الشاشة (سهم في الخطوات العادية، ونجمة في ختام التطبيق)
        function showCornerAction(callback, isStar = false) {
            if (isSecretEditMode) return;
            let existing = document.getElementById('corner-action');
            if (existing) existing.remove();
            let btn = document.createElement('button');
            btn.id = 'corner-action';
            btn.className = 'corner-action-btn';
            if (isStar) {
                btn.innerHTML = '🌟';
                btn.style.fontSize = 'clamp(1.8rem, 5vmin, 2.4rem)';
                btn.style.background = 'linear-gradient(135deg, #eab308, #ca8a04)';
            } else {
                btn.innerHTML = `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>`;
            }
            btn.onclick = () => {
                playNextChime();
                btn.remove();
                if (callback) callback();
                else handleNextClick();
            };
            document.querySelector('.content-area').appendChild(btn);
        }

        // سحب سؤال واحد عشوائي في كل مرة من مصفوفة الأسئلة الداخلية (أو توليد سؤال ديناميكي من الشرائح عند عدم وجود مصفوفة)
        function buildDynamicFallbackPoolFromSlides(defData) {
            const slides = defData?.learn?.slides || [];
            const pool = [];
            slides.forEach((sl) => {
                if (!sl || !sl.text) return;
                const sents = String(sl.text).split(/(?<=[.؟!؛])\s+/).map(s => s.trim()).filter(s => s.split(/\s+/).length >= 5);
                sents.slice(0, 2).forEach(sent => {
                    const words = sent.split(/\s+/);
                    const half = Math.ceil(words.length / 2);
                    const stem = words.slice(0, half).join(' ') + ' ...';
                    const rightRest = words.slice(half).join(' ');
                    if (rightRest) {
                        pool.push({
                            q: `أَكْمِلِ العِبَارَةَ الوَارِدَةَ فِي الدَّرْسِ: ${stem}`,
                            focusWord: '',
                            options: [
                                { text: rightRest, correct: true },
                                { text: 'يَتَرَاجَعُ عَنِ الفَهْمِ وَيَتْرُكُ مِيزَانَ الحِكْمَةِ.', correct: false },
                                { text: 'يَتَسَرَّعُ بِلَا تَثَبُّتٍ وَلَا دَلِيلٍ وَاضِحٍ.', correct: false },
                                { text: 'يُهْمِلُ التَّطْبِيقَ وَيَنْسَى أَصْلَ القَاعِدَةِ.', correct: false }
                            ]
                        });
                    }
                });
            });
            return pool;
        }

        function pickSingleRandomQuestionFromPool(defData) {
            let sourcePool = [];
            if (defData?.play) {
                if (Array.isArray(defData.play.questions) && defData.play.questions.length > 0) sourcePool = defData.play.questions;
                else if (Array.isArray(defData.play.hajjQuestions) && defData.play.hajjQuestions.length > 0) sourcePool = defData.play.hajjQuestions;
            }
            if (sourcePool.length === 0) {
                sourcePool = buildDynamicFallbackPoolFromSlides(defData);
            }
            if (sourcePool.length === 0) {
                const subjName = SUBJ_TITLES[activeViewSubj] || 'الدَّرْسُ';
                return {
                    q: `هٰذَا دَرْسُ (${subjName}) قَيْدُ التَّحْضِيرِ`,
                    focusWord: '',
                    options: [
                        { text: `هٰذَا دَرْسُ (${subjName}) قَيْدُ التَّحْضِيرِ`, correct: true },
                        { text: 'بِانْتِظَارِ التَّحْضِيرِ', correct: false }
                    ]
                };
            }
            if (isSecretEditMode) {
                const safeIdx = Math.min(currentQuestionIdx, sourcePool.length - 1);
                return sourcePool[safeIdx];
            }
            const randIdx = Math.floor(Math.random() * sourcePool.length);
            currentQuestionIdx = randIdx;
            return sourcePool[randIdx];
        }

        function ensureOptionsForQuestion(rawOpts) {
            const subjName = SUBJ_TITLES[activeViewSubj] || 'الدَّرْسُ';
            if (!Array.isArray(rawOpts) || rawOpts.length === 0) {
                return [
                    { mainText: `هٰذَا دَرْسُ (${subjName}) قَيْدُ التَّحْضِيرِ`, correct: true, origIdx: 0 },
                    { mainText: 'بِانْتِظَارِ التَّحْضِيرِ', correct: false, origIdx: 1 }
                ];
            }
            return rawOpts.map((o, idx) => ({
                mainText: String(o.text || '').trim(),
                correct: Boolean(o.correct || o.isCorrect),
                origIdx: idx
            }));
        }

        function extractQuestionStemAndFocus(qObj) {
            let rawQ = String(qObj.q || '').trim();
            if (qObj.focusWord) return { stem: rawQ.replace(`«${qObj.focusWord}»`, '').trim(), focus: qObj.focusWord };
            let guillemetMatch = rawQ.match(/«([^»]+)»/);
            if (guillemetMatch) return { stem: rawQ.replace(guillemetMatch[0], '').trim(), focus: guillemetMatch[1] };
            return { stem: rawQ, focus: '' };
        }

        // عرض سؤال واحد عشوائي فقط لكل ختم (وعند إعادة فتح الختم أو ضغط زر التبديل يظهر سؤال آخر من المصفوفة)
        function renderSingleRandomQuizStation(contentDiv, defData) {
            const allQuestions = defData?.play?.questions || [];
            if (!currentRandomQuestion || isSecretEditMode) {
                currentRandomQuestion = pickSingleRandomQuestionFromPool(defData);
            }
            let qObj = currentRandomQuestion;

            if (isSecretEditMode && allQuestions.length > 0) {
                let qNavExtra = `<div style="display:flex; gap:6px; align-items:center;">
                     <button class="skip-gift-btn" onclick="if(currentQuestionIdx>0){currentQuestionIdx--;currentRandomQuestion=null;renderCurrentStep();}">السابق</button>
                     <span>(${currentQuestionIdx + 1}/${allQuestions.length})</span>
                     <button class="skip-gift-btn" onclick="if(currentQuestionIdx+1<allQuestions.length){currentQuestionIdx++;currentRandomQuestion=null;renderCurrentStep();}">التالي</button>
                   </div>`;
                createRoomHeader(contentDiv, SUBJ_TITLES[activeViewSubj], qNavExtra);
            }

            let card = document.createElement('div');
            card.className = 'fancy-card quiz-card';
            let { stem, focus } = extractQuestionStemAndFocus(qObj);
            let qBox = document.createElement('div');
            qBox.className = 'quiz-question-box';
            qBox.innerHTML = `
                <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
                    <span style="font-size:0.86rem; font-weight:900; color:#047857;">${SUBJ_TITLES[activeViewSubj]}</span>
                    ${allQuestions.length > 1 && !isSecretEditMode ? `<button type="button" class="skip-gift-btn" id="reroll-q-btn" title="سؤال آخر من بنك هذا الختم">🎲 سؤال آخر</button>` : ''}
                </div>
                <p class="quiz-question-stem" data-edit-field="q_stem">${colorizeHarakaAndMadd(stem)}</p>
                ${focus ? `<div class="quiz-focus-target" data-edit-field="q_focus">${colorizeHarakaAndMadd(focus)}</div>` : ''}
            `;
            card.appendChild(qBox);

            const rerollBtn = qBox.querySelector('#reroll-q-btn');
            if (rerollBtn) {
                rerollBtn.onclick = () => {
                    currentRandomQuestion = pickSingleRandomQuestionFromPool(defData);
                    renderCurrentStep();
                };
            }

            let isTrueFalse = Boolean(qObj.isTrueFalse) || (qObj.options && qObj.options.length === 2);
            let processedOpts = ensureOptionsForQuestion(qObj.options || []);
            let shuffledOpts = (isTrueFalse || isSecretEditMode) ? processedOpts : [...processedOpts].sort(() => Math.random() - 0.5);

            let maxOptLen = Math.max(...shuffledOpts.map(o => o.mainText.replace(/[\u064B-\u0652]/g, '').length));
            let gridClass = isTrueFalse ? 'grid-2x1' : (maxOptLen > 28 ? 'grid-stack' : 'grid-2x2');
            let btnSizeClass = isTrueFalse ? 'opt-word' : (maxOptLen <= 4 ? 'opt-huge-glyph' : (maxOptLen > 28 ? 'opt-sentence' : 'opt-word'));

            let optsGrid = document.createElement('div');
            optsGrid.className = `quiz-options-grid ${gridClass}`;

            let isAnswered = false;
            shuffledOpts.forEach((opt) => {
                let btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `quiz-opt-btn ${btnSizeClass}`;
                btn.dataset.correct = opt.correct ? '1' : '0';
                if (isSecretEditMode && opt.correct) btn.style.borderColor = '#10b981';

                btn.innerHTML = `<span class="opt-main-text" data-edit-field="q_opt_${opt.origIdx}" style="${isSecretEditMode ? '' : 'pointer-events:none;'}">${colorizeHarakaAndMadd(opt.mainText)}</span>`;

                btn.onclick = (ev) => {
                    if (isSecretEditMode || isAnswered) return;
                    const targetBtn = ev.currentTarget.closest('.quiz-opt-btn') || btn;
                    if (opt.correct) {
                        isAnswered = true;
                        targetBtn.classList.add('correct');
                        optsGrid.querySelectorAll('.quiz-opt-btn').forEach(b => b.disabled = true);
                        playCorrectChime();
                        setSubjBatteryLevel(playWeek, activeViewSubj, 2);
                        updateNavButtons(true);
                        showCornerAction(() => handleNextClick(), false);
                    } else {
                        targetBtn.classList.add('wrong');
                        targetBtn.disabled = true;
                        playWrongTone();
                    }
                };
                optsGrid.appendChild(btn);
            });

            card.appendChild(optsGrid);
            contentDiv.appendChild(card);

            updateNavButtons(true);
            showCornerAction(() => handleNextClick(), false);
            let spokenQ = (focus && focus !== stem) ? `${stem} ، ${focus}` : stem;
            speakText(spokenQ, () => { updateNavButtons(true); showCornerAction(() => handleNextClick(), false); });
            if (isSecretEditMode) attachEditHooksToCurrentStation(defData);
        }

        function formatApplySteps(defData) {
            const subjName = SUBJ_TITLES[activeViewSubj] || 'الدَّرْسُ';
            if (Array.isArray(defData?.apply?.steps) && defData.apply.steps.length > 0) {
                return defData.apply.steps.map(stepStr => colorizeHarakaAndMadd(String(stepStr)).replace(/\(([^\)]+)\)/g, '<span class="apply-hl-target">$1</span>'));
            }
            return [colorizeHarakaAndMadd(`طَبِّقْ مَا تَعَلَّمْتَهُ فِي دَرْسِ (${subjName}).`)];
        }

        function renderApplyStation(contentDiv, defData) {
            let card = document.createElement('div');
            card.className = 'fancy-card apply-structured-card';
            if (defData?.apply?.img) {
                let imgWrap = document.createElement('div');
                imgWrap.style.cssText = 'position:relative; display:flex; justify-content:center;';
                let imgEl = document.createElement('img');
                imgEl.className = 'apply-img-preview'; imgEl.src = defData.apply.img; imgEl.dataset.editAssetKey = 'apply_img';
                imgEl.onerror = function() { if (!this.dataset.extTried) this.style.display = 'none'; };
                imgWrap.appendChild(imgEl); card.appendChild(imgWrap);
            }
            let stepsArr = formatApplySteps(defData);
            let stepsContainer = document.createElement('div'); stepsContainer.className = 'apply-steps-list';
            stepsArr.forEach((stHtml, idx) => {
                let row = document.createElement('div'); row.className = 'apply-step-row';
                row.innerHTML = `<span class="apply-step-num">${toArDigits(idx + 1)}</span><div class="apply-step-text" data-edit-field="apply_step_${idx}">${stHtml}</div>`;
                stepsContainer.appendChild(row);
            });
            card.appendChild(stepsContainer); contentDiv.appendChild(card);

            updateNavButtons(true);
            showCornerAction(() => completeLesson(activeViewSubj), true);

            let rawSteps = Array.isArray(defData?.apply?.steps) ? defData.apply.steps.join(' ، ') : stepsArr.join(' ، ');
            speakText(rawSteps);
            if (isSecretEditMode) attachEditHooksToCurrentStation(defData);
        }

        function getIntroBannerInfo(defData) {
            const subjName = SUBJ_TITLES[activeViewSubj] || 'الدَّرْسُ';
            let cyc = getCycleFromGlobalWeek(playWeek);
            let title = defData?.learn?.introTitle || `هٰذَا دَرْسُ (${subjName}) قَيْدُ التَّحْضِيرِ`;
            let goal = defData?.learn?.introGoal || SUBJ_TITLES[activeViewSubj] || '';
            return {
                cycleTag: `الدورة ${ARABIC_CYCLE_NAMES[cyc]} • الوحدة ${toArDigits(playWeek)}`,
                title,
                goal
            };
        }

        function renderCurrentStep() {
            let defData = getActiveCurriculumObj();
            if (globalStep !== 1) {
                window._activeSlideIdx = 0;
                window._lastSlideLessonKey = null;
                if (window.InteractiveLabEngine) window.InteractiveLabEngine.stopActiveTimers();
            }

            if (!isSecretEditMode && globalStep === 1 && defData?.learn?.skipSom) {
                globalStep = 2;
                renderCurrentStep();
                return;
            }

            let existingCorner = document.getElementById('corner-action');
            if (existingCorner) existingCorner.remove();

            updateNavButtons(false);
            updateHeaderScoreUI();
            let contentDiv = document.getElementById('main-content');
            contentDiv.innerHTML = '';

            const subjName = SUBJ_TITLES[activeViewSubj] || 'الدَّرْسُ';
            const defaultImg = STAGE_PRIMARY_IMG[STAGE_GROUP] || STAGE_PRIMARY_IMG[2];
            const yFolder = `assets/y${RAW_YEAR}`;
            const cycLocalWeek = getCycleIndexFromGlobalWeek(playWeek) + 1;
            const activeDefaultImg = `${yFolder}/art/art${cycLocalWeek}.jpg`;

            // الطور 0: المحور والغلاف
            if (globalStep === 0) {
                let bannerInfo = getIntroBannerInfo(defData);
                let card = document.createElement('div');
                card.className = 'fancy-card'; card.style.padding = '0';
                let slideImgSrc = defData.learn?.coverImg || activeDefaultImg;
                let percentRevealed = (activeViewSubj / 7) * 100;

                card.innerHTML = `
                <div class="intro-reveal-stage">
                    <div class="intro-Formatted-backdrop"></div>
                    <img src="${slideImgSrc}" class="intro-img-gray">
                    <img src="${slideImgSrc}" class="intro-img-color" data-edit-asset-key="cover_img" style="clip-path: inset(0 0 0 calc(100% - ${percentRevealed}%));">
                    <div class="intro-info-banner">
                        <span class="intro-cycle-tag">${bannerInfo.cycleTag}</span>
                        <h2 class="intro-info-title" data-edit-field="intro_title">${colorizeHarakaAndMadd(bannerInfo.title)}</h2>
                        <p class="intro-info-desc" data-edit-field="intro_goal">${colorizeHarakaAndMadd(bannerInfo.goal)}</p>
                    </div>
                </div>`;

                contentDiv.appendChild(card);
                updateNavButtons(true);
                showCornerAction(() => handleNextClick(), false);
                speakText(`${bannerInfo.title} ، ${bannerInfo.goal}`, null, defData.learn?.audio);
                if (isSecretEditMode) attachEditHooksToCurrentStation(defData);
            }

            // الطور 1: الشرائح الآلية + المختبر التفاعلي + الفيديو
            else if (globalStep === 1) {
                setSubjBatteryLevel(playWeek, activeViewSubj, 1);
                const currentLessonSlideKey = `${playWeek}_${activeViewSubj}`;
                if (window._lastSlideLessonKey !== currentLessonSlideKey) {
                    window._activeSlideIdx = 0;
                    window._activeSomLayer = null;
                    window._lastSlideLessonKey = currentLessonSlideKey;
                }

                let slides = (defData.learn?.slides && defData.learn.slides.length > 0) ? defData.learn.slides : [
                    { img: defaultImg, text: `هٰذَا دَرْسُ (${subjName}) قَيْدُ التَّحْضِيرِ` }
                ];

                const hasLabInLesson = slides.some(s => Boolean(s.labData)) || Boolean(defData.learn?.labData) || [3, 4, 5].includes(activeViewSubj);
                const hasCustomVideo = Boolean(defData.learn?.video && String(defData.learn.video).trim().length > 0);
                const hasSlidesInLesson = slides.length > 0;

                if (isSecretEditMode) {
                    let editControlsHTML = `
                        <div style="display:flex; gap:6px; flex-wrap:wrap;">
                            <button class="skip-gift-btn" style="border-color:#10b981;" onclick="window.addSomSlide()">إضافة شريحة</button>
                            <button class="skip-gift-btn" style="border-color:#ef4444; color:#b91c1c;" onclick="window.removeSomSlide()">حذف شريحة</button>
                        </div>`;
                    createRoomHeader(contentDiv, 'إعداد طور العرض والطبقات الثلاث', editControlsHTML);
                }

                window.addSomSlide = () => {
                    if (!defData.learn) defData.learn = {};
                    if (!Array.isArray(defData.learn.slides)) defData.learn.slides = [];
                    window._touchedLessons[`${playWeek}_${activeViewSubj}`] = true;
                    defData.learn.slides.push({ img: defaultImg, text: `شَرِيحَةٌ جَدِيدَةٌ` });
                    window._activeSlideIdx = defData.learn.slides.length - 1;
                    window._activeSomLayer = 'slides';
                    renderCurrentStep();
                };

                window.removeSomSlide = () => {
                    if (Array.isArray(defData.learn?.slides) && defData.learn.slides.length > 1) {
                        window._touchedLessons[`${playWeek}_${activeViewSubj}`] = true;
                        let sIdx = window._activeSlideIdx || 0;
                        defData.learn.slides.splice(sIdx, 1);
                        window._activeSlideIdx = Math.max(0, sIdx - 1);
                        renderCurrentStep();
                    }
                };

                let card = document.createElement('div');
                card.className = 'fancy-card';

                const layersBar = document.createElement('div');
                layersBar.className = 'som-layers-switcher';

                const btnVideo = document.createElement('button');
                btnVideo.type = 'button';
                btnVideo.innerHTML = `<span class="layer-status-dot"></span><span>الفيديو</span>`;

                const btnLab = document.createElement('button');
                btnLab.type = 'button';
                btnLab.innerHTML = `<span class="layer-status-dot"></span><span>المختبر</span>`;

                const btnSlides = document.createElement('button');
                btnSlides.type = 'button';
                btnSlides.innerHTML = `<span class="layer-status-dot"></span><span>الشرائح</span>`;

                const slideCounterChip = document.createElement('span');
                slideCounterChip.className = 'slide-counter-chip';

                const btnAutoSlide = document.createElement('button');
                btnAutoSlide.type = 'button';
                const syncAutoSlideBtnUI = () => {
                    btnAutoSlide.className = 'layer-tab-btn ' + (isAutoAdvanceSlidesActive ? 'active-layer' : 'available');
                    btnAutoSlide.innerHTML = `<span class="layer-status-dot"></span><span>${isAutoAdvanceSlidesActive ? 'تقليب آلي: مفعل' : 'تقليب آلي'}</span>`;
                };
                syncAutoSlideBtnUI();
                btnAutoSlide.onclick = () => {
                    isAutoAdvanceSlidesActive = !isAutoAdvanceSlidesActive;
                    localStorage.setItem('auto_advance_slides_stage2', isAutoAdvanceSlidesActive ? 'true' : 'false');
                    syncAutoSlideBtnUI();
                };

                layersBar.appendChild(btnSlides);
                layersBar.appendChild(slideCounterChip);
                if (slides.length > 1) layersBar.appendChild(btnAutoSlide);
                layersBar.appendChild(btnLab);
                layersBar.appendChild(btnVideo);
                card.appendChild(layersBar);

                const bodyStageWrap = document.createElement('div');
                bodyStageWrap.style.cssText = 'width:100%; flex:1 1 auto; min-height:0; display:flex; flex-direction:column;';
                card.appendChild(bodyStageWrap);
                contentDiv.appendChild(card);

                let videoVerifiedAvailable = hasCustomVideo;

                function activateLayer(layerName) {
                    stopAllSpeech();
                    if (window.InteractiveLabEngine) window.InteractiveLabEngine.stopActiveTimers();

(function enableSmartMultiExtensionImages() {
    const EXT_LIST = ['.jpg', '.png', '.webp', '.jpeg', '.gif'];
    const resolvedCache = {};

    window.addEventListener('error', function(e) {
        const el = e.target;
        if (!el || el.tagName !== 'IMG') return;

        const currentSrc = el.getAttribute('src') || '';
        if (!currentSrc || currentSrc.startsWith('data:') || currentSrc.startsWith('blob:')) return;

        if (!el.dataset.origRequestedSrc) el.dataset.origRequestedSrc = currentSrc;
        const origKey = el.dataset.origRequestedSrc;

        if (resolvedCache[origKey] && resolvedCache[origKey] !== currentSrc) {
            el.src = resolvedCache[origKey];
            return;
        }
        if (el.dataset.finalFallbackReached === 'true') return;

        const fallbackBg = (typeof STAGE_FALLBACK_IMG !== 'undefined' && typeof STAGE_GROUP !== 'undefined')
            ? (STAGE_FALLBACK_IMG[STAGE_GROUP] || STAGE_FALLBACK_IMG[1])
            : 'assets/stage1-bg.jpg';

        const baseMatch = currentSrc.match(/^(.*)\.(jpg|png|webp|jpeg|gif)$/i);
        if (!baseMatch) {
            el.dataset.finalFallbackReached = 'true';
            el.src = fallbackBg;
            return;
        }

        const basePath = baseMatch[1];
        let tryIdx = parseInt(el.dataset.extTryIdx || '0', 10) + 1;

        if (tryIdx < EXT_LIST.length) {
            el.dataset.extTryIdx = String(tryIdx);
            el.dataset.extTried = 'true';
            const nextCandidate = basePath + EXT_LIST[tryIdx];
            el.onload = function() { resolvedCache[origKey] = nextCandidate; };
            el.src = nextCandidate;
            return;
        }

        const yearMatch = basePath.match(/^(.*\/)y(\d+)(\/.*)$/i);
        if (yearMatch) {
            const prefix = yearMatch[1];
            const curY = parseInt(yearMatch[2], 10);
            const suffix = yearMatch[3];

            if (curY > 1) {
                el.dataset.extTryIdx = '0';
                el.dataset.extTried = 'true';
                const prevYearCandidate = `${prefix}y${curY - 1}${suffix}${EXT_LIST[0]}`;
                el.onload = function() { resolvedCache[origKey] = prevYearCandidate; };
                el.src = prevYearCandidate;
                return;
            }
        }

        el.dataset.finalFallbackReached = 'true';
        el.src = fallbackBg;
    }, true);
})();

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                if (file && file.type?.startsWith('image/') && file.type !== 'image/gif' && file.type !== 'image/svg+xml') {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const MAX_DIM = 900;
                            let w = img.width, h = img.height;
                            if (w > MAX_DIM || h > MAX_DIM) {
                                if (w > h) { h = Math.round((h * MAX_DIM) / w); w = MAX_DIM; }
                                else { w = Math.round((w * MAX_DIM) / h); h = MAX_DIM; }
                            }
                            const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
                            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                            let out = canvas.toDataURL('image/webp', 0.78);
                            if (!out.startsWith('data:image/webp')) out = canvas.toDataURL('image/jpeg', 0.78);
                            resolve(out);
                        };
                        img.onerror = () => resolve(e.target.result);
                        img.src = e.target.result;
                    };
                    reader.onerror = reject; reader.readAsDataURL(file); return;
                }
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = reject; reader.readAsDataURL(file);
            });
        }

                    localStorage.setItem(`custom_curriculum_edits_y${yearKey}`, JSON.stringify(window.curriculumData[yearKey]));
                    alert(`تم حفظ تعديلات السنة ${yearKey} بنجاح.`);
                } catch (e) { alert("ذاكرة المتصفح ممتلئة."); }
                return;
            }

            const storageKey = `custom_curriculum_edits_${editOwner}_y${yearKey}`;
            const existingDelta = JSON.parse(localStorage.getItem(storageKey) || '{}');
            Object.keys(window._touchedLessons).forEach(k => {
                const [w, s] = k.split('_');
                if (!existingDelta[w]) existingDelta[w] = {};
                existingDelta[w][s] = window.curriculumData[yearKey][w][s];
            });
            localStorage.setItem(storageKey, JSON.stringify(existingDelta));
            alert(`تم حفظ تعديلات السنة ${yearKey} بنجاح.`);
        }

        function changeSchoolBranch(branchId) {
            localStorage.setItem('selected_school_branch', branchId);
            const newUrl = new URL(window.location.href);
            newUrl.searchParams.set('year', RAW_YEAR);
            newUrl.searchParams.set('school', branchId);
            window.location.href = newUrl.toString();
        }

        function updateHeaderSchoolAndTeacherLabel(customSchoolName = null, customTeacherName = null) {
            const logoEl = document.getElementById('header-logo');
            if (!logoEl) return;
            if (ACTIVE_SCHOOL_BRANCH === 'main') { logoEl.innerText = 'مدرسة العلم'; return; }
            let sName = customSchoolName, sOwner = customTeacherName;
            if (!sName) {
                const schools = JSON.parse(localStorage.getItem('private_schools_directory') || '[]');
                const found = schools.find(s => s.id === ACTIVE_SCHOOL_BRANCH);
                if (found) { sName = found.name; sOwner = found.owner; }
            }
            sName = sName || 'مدرسة خاصة';
            logoEl.innerText = sOwner ? `${sName} — ${sOwner}` : sName;
        }

        async function loadCustomCurriculumEdits() {
            try {
                window.curriculumData = window.curriculumData || {};
                window.curriculumData[RAW_YEAR] = window.curriculumData[RAW_YEAR] || {};
                const blocked = JSON.parse(localStorage.getItem('blocked_schools_list') || '[]');
                updateHeaderSchoolAndTeacherLabel();

                const branchSelect = document.getElementById('school-branch-select');
                if (branchSelect) {
                    const schools = JSON.parse(localStorage.getItem('private_schools_directory') || '[]')
                        .filter(s => !blocked.includes(s.id));
                    schools.filter(s => Array.isArray(s.targetYears) && s.targetYears.includes(RAW_YEAR)).forEach(sc => {
                        if (!branchSelect.querySelector(`option[value="${sc.id}"]`)) {
                            const opt = document.createElement('option');
                            opt.value = sc.id; opt.innerText = `🌟 ${sc.name} (المعلم: ${sc.owner})`;
                            branchSelect.appendChild(opt);
                        }
                    });
                    if (branchSelect.querySelector(`option[value="${ACTIVE_SCHOOL_BRANCH}"]`)) branchSelect.value = ACTIVE_SCHOOL_BRANCH;
                }

                if (ACTIVE_SCHOOL_BRANCH === 'main' || blocked.includes(ACTIVE_SCHOOL_BRANCH)) {
                    const mainSaved = localStorage.getItem(`custom_curriculum_edits_y${RAW_YEAR}`);
                    if (mainSaved) Object.assign(window.curriculumData[RAW_YEAR], JSON.parse(mainSaved));
                    return;
                }

                const privLocal = localStorage.getItem(`custom_curriculum_edits_${ACTIVE_SCHOOL_BRANCH}_y${RAW_YEAR}`);
                if (privLocal) {
                    const deltaObj = JSON.parse(privLocal);
                    Object.keys(deltaObj).forEach(w => {
                        if (!window.curriculumData[RAW_YEAR][w]) window.curriculumData[RAW_YEAR][w] = {};
                        Object.assign(window.curriculumData[RAW_YEAR][w], deltaObj[w]);
                    });
                }
            } catch (e) {}
        }

        loadCustomCurriculumEdits();
        updateTTSButtonUI();
        updateHeaderScoreUI();
        updateNavButtons(false);
// ==================== [ نهاية القسم 6 من 6 ] ====================

<script>
(function initStage2SmartTutor() {
    const PLATFORM_TUTOR_WORKER_URL = localStorage.getItem('al3lm_tutor_worker_url') || 'https://al-3lm-tutor.noorsaade-1841989.workers.dev';
    const STORAGE_PREFIX = 'al3lm_stage2_tutor_mem_v1_';

    // الذاكرة تُحفظ لكل درس/حرف على حدة في sessionStorage لتبقى عند إغلاق النافذة أو العودة لرؤية السلايدات
    const sessionMemoryMap = new Map();
    let currentLessonContextKey = '';
    let isTutorBusy = false;
    let activePendingMsg = null;

    function loadLessonMemory(contextKey) {
        if (sessionMemoryMap.has(contextKey)) {
            return sessionMemoryMap.get(contextKey);
        }
        try {
            const raw = sessionStorage.getItem(STORAGE_PREFIX + encodeURIComponent(contextKey));
            if (raw) {
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed)) {
                    sessionMemoryMap.set(contextKey, parsed);
                    return parsed;
                }
            }
        } catch (_) {}
        const fresh = [];
        sessionMemoryMap.set(contextKey, fresh);
        return fresh;
    }

    function saveLessonMemory(contextKey, messagesArr) {
        if (!contextKey) return;
        sessionMemoryMap.set(contextKey, messagesArr);
        try {
            sessionStorage.setItem(STORAGE_PREFIX + encodeURIComponent(contextKey), JSON.stringify(messagesArr));
        } catch (_) {}
    }

    function cleanArabicForSpeech(rawText) {
        if (!rawText) return '';
        return String(rawText)
            .replace(/[A-Za-z_\/\\@#%^&*+=<>~`|\[\]{}]+/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
    }

    // نبقي القارئ الآلي فعالاً ليقرأ حتى عند الخروج من النافذة والعودة إلى السلايدات والدرس
    function speakReplySafely(text) {
        const arabicOnly = cleanArabicForSpeech(text);
        if (!arabicOnly) return;
        try {
            if (typeof speakText === 'function') {
                speakText(arabicOnly);
            } else if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(arabicOnly);
                u.lang = 'ar-SA';
                u.rate = 0.92;
                window.speechSynthesis.speak(u);
            }
        } catch (_) {}
    }

    function extractCurrentLessonDetails() {
        let defData = null;
        try {
            if (typeof getActiveCurriculumObj === 'function') {
                defData = getActiveCurriculumObj();
            }
        } catch (_) {}

        const headerTitle = document.getElementById('header-lesson-title')?.innerText?.trim() || 'الدرس الحالي';
        const yearNum = document.getElementById('hdr-year-num')?.innerText?.trim() || (typeof RAW_YEAR !== 'undefined' ? String(RAW_YEAR) : '10');
        const mapKey = document.getElementById('week-badge-map-part')?.innerText?.trim() || '';

        const lessonTitle = defData?.learn?.introTitle
            ? String(defData.learn.introTitle).replace(/<[^>]*>/g, '').trim()
            : headerTitle;
        const lessonGoal = defData?.learn?.introGoal
            ? String(defData.learn.introGoal).replace(/<[^>]*>/g, '').trim()
            : '';

        let compactSummary = '';
        if (Array.isArray(defData?.learn?.slides) && defData.learn.slides.length > 0) {
            compactSummary = defData.learn.slides
                .slice(0, 4)
                .map((s, i) => `(${i + 1}) ${String(s.text || '').replace(/<[^>]*>/g, '').slice(0, 140)}`)
                .join(' | ');
        } else {
            compactSummary = (document.getElementById('main-content')?.innerText?.trim() || '').slice(0, 450);
        }

        const contextKey = `${yearNum}_${mapKey}_${lessonTitle}`;
        return { yearNum, lessonTitle, lessonGoal, compactSummary, contextKey };
    }

    // تصاعد متدرج ومنضبط:
    // السؤال 1 (البداية): سطران فقط ثم سؤال للطالب
    // السؤال 2: حوالي 5 أسطر ثم سؤال للطالب
    // السؤال 3: حوالي 7 إلى 8 أسطر ثم سؤال للطالب
    // السؤال 4 فأكثر: حتى 10 أسطر كحد أقصى
    function getEscalationPlan(conversationArr) {
        const studentQuestionsCount = conversationArr.filter(m => m.role === 'student').length;

        if (studentQuestionsCount <= 1) {
            return {
                minLines: 2,
                maxLines: 2,
                maxTokens: 170,
                rule: 'اكتب سطرين فقط (فكرة مركزة من سطرين قصيرين) ثم اطرح سؤالاً قصيراً واحداً للطالب ليتفاعل.'
            };
        }
        if (studentQuestionsCount === 2) {
            return {
                minLines: 4,
                maxLines: 5,
                maxTokens: 320,
                rule: 'اكتب نحو 5 أسطر (فقرة متماسكة من 4 إلى 5 أسطر) تشرح المعنى بمثال واضح، ثم اختم بسؤال واحد للطالب.'
            };
        }
        if (studentQuestionsCount === 3) {
            return {
                minLines: 6,
                maxLines: 8,
                maxTokens: 480,
                rule: 'اكتب نحو 7 إلى 8 أسطر (بحد أقصى 8 أسطر) تعمّق الفكرة وتوضح النتيجة، ثم اختم بسؤال واحد للطالب.'
            };
        }
        return {
            minLines: 8,
            maxLines: 10,
            maxTokens: 650,
            rule: 'اكتب من 8 إلى 10 أسطر كحد أقصى (ولا تتجاوز 10 أسطر أبداً) لتوضيح الصورة الكاملة والنتيجة، ثم اختم بسؤال واحد للطالب.'
        };
    }

    function enforceLineLimit(text, maxLines = 10) {
        const clean = String(text || '').trim();
        if (!clean) return '';
        const lines = clean.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        if (lines.length <= maxLines) {
            return lines.join('\n');
        }
        return lines.slice(0, maxLines).join('\n');
    }

    function buildLessonSystemInstruction(info, plan) {
        return [
            `أنت معلم حكيم ولطيف في "مدرسة العلم"، تحاور طالباً عمره (${info.yearNum}) سنوات في مرحلة "عبد".`,
            `الدرس الحالي: ${info.lessonTitle}.`,
            info.lessonGoal ? `الهدف: ${info.lessonGoal}` : '',
            info.compactSummary ? `ملخص الدرس: ${info.compactSummary}` : '',
            `قاعدة التدرج والطول الصارمة:`,
            `- ${plan.rule}`,
            `- لا تتجاوز 10 أسطر في أي رد مهما كثر السؤال.`,
            `- اكتب بعربية فصيحة واضحة ومختصرة العبارة دون أي حروف أو كلمات إنجليزية.`
        ].filter(Boolean).join('\n');
    }

    function appendMessageBubble(role, text, withSpeakBtn = true) {
        const area = document.getElementById('tutor-messages-area');
        if (!area) return null;
        const row = document.createElement('div');
        row.className = `tutor-msg-row ${role}`;

        const bubble = document.createElement('div');
        bubble.className = 'tutor-bubble';
        bubble.innerText = text;
        row.appendChild(bubble);

        if (role === 'teacher' && withSpeakBtn) {
            const spk = document.createElement('button');
            spk.type = 'button';
            spk.className = 'tutor-speak-mini';
            spk.innerText = '🔊 اسْتَمِعْ لِلشَّرْحِ';
            spk.onclick = () => speakReplySafely(bubble.innerText);
            row.appendChild(spk);
        }

        area.appendChild(row);
        area.scrollTop = area.scrollHeight;
        return { row, bubble };
    }

    function renderSavedConversationToDom(conversationArr) {
        const area = document.getElementById('tutor-messages-area');
        if (!area) return;
        area.innerHTML = '';
        for (const msg of conversationArr) {
            if (!msg || !msg.text) continue;
            if (msg.role === 'teacher') {
                appendMessageBubble('teacher', msg.text, true);
            } else if (msg.role === 'student' && !msg.hiddenPrompt) {
                appendMessageBubble('student', msg.text, false);
            }
        }
        area.scrollTop = area.scrollHeight;
    }

    function clearPendingThinkingBubble() {
        if (activePendingMsg && activePendingMsg.row && activePendingMsg.row.parentNode) {
            activePendingMsg.row.parentNode.removeChild(activePendingMsg.row);
        }
        activePendingMsg = null;
    }

    async function callTutorBackend(systemInstruction, historyMessages, maxTokens) {
        const workerUrl = localStorage.getItem('al3lm_tutor_worker_url') || PLATFORM_TUTOR_WORKER_URL;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 16000);
        try {
            const recentMessages = historyMessages.slice(-4).map(m => ({ role: m.role, text: m.text }));
            const res = await fetch(workerUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    systemInstruction,
                    messages: recentMessages,
                    maxOutputTokens: maxTokens
                }),
                signal: controller.signal
            });
            if (!res.ok) {
                throw new Error('NETWORK_OR_SERVER_ERROR');
            }
            const data = await res.json();
            if (data && typeof data.reply === 'string' && data.reply.trim().length > 0) {
                return data.reply.trim();
            }
            throw new Error('EMPTY_REPLY');
        } finally {
            clearTimeout(timeoutId);
        }
    }

    async function requestTeacherReply(info, isInitialGreeting = false) {
        if (isTutorBusy) return;
        const lessonInfo = info || extractCurrentLessonDetails();
        const activeKey = lessonInfo.contextKey;
        const conv = loadLessonMemory(activeKey);

        isTutorBusy = true;
        clearPendingThinkingBubble();
        const plan = getEscalationPlan(conv);
        activePendingMsg = appendMessageBubble('teacher', 'يُجِيبُكَ المُعَلِّمُ الآنَ...', true);

        try {
            const sysPrompt = buildLessonSystemInstruction(lessonInfo, plan);
            const rawReply = await callTutorBackend(sysPrompt, conv, plan.maxTokens);
            const reply = enforceLineLimit(rawReply, plan.maxLines);

            conv.push({ role: 'teacher', text: reply });
            saveLessonMemory(activeKey, conv);

            if (activePendingMsg && activePendingMsg.bubble) {
                activePendingMsg.bubble.innerText = reply;
            }
            activePendingMsg = null;
            const area = document.getElementById('tutor-messages-area');
            if (area) area.scrollTop = area.scrollHeight;
            speakReplySafely(reply);
        } catch (_) {
            clearPendingThinkingBubble();
            if (conv.length > 0 && conv[conv.length - 1].role === 'student') {
                conv.pop();
                saveLessonMemory(activeKey, conv);
            }
            if (isInitialGreeting && conv.length === 0) {
                sessionMemoryMap.delete(activeKey);
            }
        } finally {
            isTutorBusy = false;
        }
    }

    window.openAiTutorModal = function() {
        const info = extractCurrentLessonDetails();
        currentLessonContextKey = info.contextKey;
        const conv = loadLessonMemory(currentLessonContextKey);

        const modal = document.getElementById('ai-tutor-modal');
        const lbl = document.getElementById('tutor-lesson-label');
        if (lbl) lbl.innerText = info.lessonTitle;
        if (modal) modal.classList.add('open');

        if (conv.length === 0) {
            const area = document.getElementById('tutor-messages-area');
            if (area) area.innerHTML = '';
            conv.push({
                role: 'student',
                text: `اشرح لي فكرة درس «${info.lessonTitle}» في سطرين ثم اسألني سؤالاً.`,
                hiddenPrompt: true
            });
            saveLessonMemory(currentLessonContextKey, conv);
            requestTeacherReply(info, true);
        } else {
            // استعادة المحادثة الكاملة لنفس الدرس/الحرف دون حذف أي سؤال أو جواب
            renderSavedConversationToDom(conv);
        }
    };

    // عند إغلاق النافذة لرؤية السلايدات، لا نمسح الذاكرة ولا نوقف القارئ الآلي حتى يستمر في القراءة أثناء معاينة الدرس
    window.closeAiTutorModal = function() {
        const modal = document.getElementById('ai-tutor-modal');
        if (modal) modal.classList.remove('open');
    };

    window.sendStudentMessageToTutor = function() {
        const inputEl = document.getElementById('tutor-user-input');
        if (!inputEl) return;
        const txt = inputEl.value.trim();
        if (!txt) return;
        if (isTutorBusy) return;

        const info = extractCurrentLessonDetails();
        currentLessonContextKey = info.contextKey;
        const conv = loadLessonMemory(currentLessonContextKey);

        inputEl.value = '';
        inputEl.style.height = 'auto';
        appendMessageBubble('student', txt, false);
        conv.push({ role: 'student', text: txt, hiddenPrompt: false });
        saveLessonMemory(currentLessonContextKey, conv);
        requestTeacherReply(info, false);
    };

    const inputField = document.getElementById('tutor-user-input');
    const sendBtn = document.getElementById('tutor-send-btn');
    if (inputField) {
        inputField.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                window.sendStudentMessageToTutor();
            }
        });
    }
    if (sendBtn) {
        sendBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            window.sendStudentMessageToTutor();
        });
    }

    let recognition = null;
    window.toggleTutorVoiceInput = function() {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        const micBtn = document.getElementById('tutor-mic-btn');
        if (!SpeechRec) return;

        if (recognition) {
            recognition.stop();
            recognition = null;
            if (micBtn) micBtn.classList.remove('recording');
            return;
        }
        recognition = new SpeechRec();
        recognition.lang = 'ar-SA';
        recognition.interimResults = false;
        if (micBtn) micBtn.classList.add('recording');

        recognition.onresult = function(event) {
            const transcript = event.results?.[0]?.[0]?.transcript || '';
            const inp = document.getElementById('tutor-user-input');
            if (inp && transcript) {
                inp.value = (inp.value ? inp.value + ' ' : '') + transcript;
            }
        };
        recognition.onend = function() {
            recognition = null;
            if (micBtn) micBtn.classList.remove('recording');
        };
        recognition.onerror = function() {
            recognition = null;
            if (micBtn) micBtn.classList.remove('recording');
        };
        recognition.start();
    };
})();
</script>

<script>
(function initAl3lmStagePortalBridge() {
    const params = new URLSearchParams(window.location.search);
    const isTeacher = (params.get('from') === 'teachers') || (localStorage.getItem('al3lm_active_role') === 'teacher');
    const stageKey = document.title.includes('صَاحِب') || window.location.pathname.includes('stage3') ? 'stage3'
                   : (document.title.includes('عبد') || window.location.pathname.includes('stage2') ? 'stage2' : 'stage1');

    // 1. Default TTS OFF in stage2 and stage3 unless explicitly turned on ('true')
    if (stageKey === 'stage2' || stageKey === 'stage3') {
        if (localStorage.getItem('tts_enabled_state') === null) {
            localStorage.setItem('tts_enabled_state', 'false');
        }
        if (localStorage.getItem('tts_enabled_state') !== 'true') {
            window.isTTSActive = false;
            if (typeof updateTTSButtonUI === 'function') {
                try { updateTTSButtonUI(); } catch (_) {}
            }
        }
    }

    // 2. Stop All Audio helper + dedicated Stop button (⏹)
    window.stopAllAl3lmAudio = function() {
        try { if (typeof window._stopActiveSlideAutoAndLine === 'function') window._stopActiveSlideAutoAndLine(); } catch (_) {}
        try { if (typeof stopAllSpeech === 'function') stopAllSpeech(); } catch (_) {}
        try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (_) {}
        try {
            const ca = document.getElementById('custom-audio');
            if (ca) { ca.pause(); ca.currentTime = 0; }
        } catch (_) {}
        window._isSpeakingMainQuestion = false;
        window._questionReadCompleted = true;
    };

    function ensureStopButtonBeside(replayEl) {
        if (!replayEl || !replayEl.parentElement) return;
        const next = replayEl.nextElementSibling;
        if (next && next.classList && next.classList.contains('al3lm-tts-stop-btn')) return;
        const stopBtn = document.createElement('button');
        stopBtn.type = 'button';
        stopBtn.className = 'al3lm-tts-stop-btn';
        stopBtn.title = 'إيقاف القارئ الآلي';
        stopBtn.setAttribute('aria-label', 'إيقاف القارئ الآلي');
        stopBtn.innerHTML = '⏹';
        stopBtn.onclick = function(e) {
            e.preventDefault();
            e.stopPropagation();
            window.stopAllAl3lmAudio();
        };
        replayEl.insertAdjacentElement('afterend', stopBtn);
    }

    function scanAndInjectStopButtons() {
        document.querySelectorAll('.glass-audio-btn, .tutor-speak-mini').forEach(ensureStopButtonBeside);
        const tutorBox = document.getElementById('embedded-tutor-box');
        if (tutorBox && !tutorBox.querySelector('.al3lm-tutor-top-stop')) {
            const hdr = tutorBox.querySelector('.embedded-tutor-hdr');
            if (hdr) {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'al3lm-tts-stop-btn al3lm-tutor-top-stop';
                b.title = 'إيقاف القارئ الآلي';
                b.innerHTML = '⏹';
                b.onclick = function(e) { e.preventDefault(); e.stopPropagation(); window.stopAllAl3lmAudio(); };
                hdr.appendChild(b);
            }
        }
    }

    // 3. Sync active student's progress snapshot into al3lm_student_accounts_v1
    window.syncAl3lmStudentProgressSnapshot = function(unitDoneMeta) {
        if (isTeacher) return;
        try {
            const activeUser = localStorage.getItem('al3lm_active_student_user');
            if (!activeUser) return;
            const accounts = JSON.parse(localStorage.getItem('al3lm_student_accounts_v1') || '{}');
            if (!accounts[activeUser]) return;
            const stu = accounts[activeUser];
            const snap = stu.progress || {};
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (!k) continue;
                if (k.startsWith('student_week_') || k.startsWith('student_subj_') || k.startsWith('subj_star_') || k.startsWith('subj_score_') || k.startsWith('subj_coins_') || k.startsWith('seal_done_') || k.startsWith('gift_diamond_') || k.startsWith('s3_')) {
                    snap[k] = localStorage.getItem(k);
                }
            }
            stu.progress = snap;
            if (unitDoneMeta) {
                stu.lastScore = unitDoneMeta.score || stu.lastScore || '';
                stu.lastVisitStatus = 'wrapup';
                if (!Array.isArray(stu.lessonHistory)) stu.lessonHistory = [];
                const nowStr = new Date().toLocaleDateString('ar-EG') + ' ' + new Date().toTimeString().slice(0, 5);
                stu.lessonHistory.push({
                    date: nowStr,
                    year: unitDoneMeta.year || stu.assignedYear || 1,
                    week: unitDoneMeta.week || 1,
                    letter: unitDoneMeta.letter || '',
                    title: unitDoneMeta.title || '',
                    score: unitDoneMeta.score || ''
                });
            }
            accounts[activeUser] = stu;
            localStorage.setItem('al3lm_student_accounts_v1', JSON.stringify(accounts));
            if (navigator.onLine && stu.username && stu.pwHash) {
                const syncUrl = localStorage.getItem('al3lm_sync_api_url') || localStorage.getItem('al3lm_tutor_worker_url') || 'https://al-3lm-tutor.noorsaade-1841989.workers.dev';
                fetch(syncUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'sync_student', username: stu.username, pwHash: stu.pwHash, profile: stu }),
                    keepalive: true
                }).catch(() => {});
            }
        } catch (_) {}
    };

    window.addEventListener('beforeunload', () => {
        window.syncAl3lmStudentProgressSnapshot();
    });

    // 4. End-of-lesson transition back to student.html?wrapup=1 (or teacher continuation)
    window.recordUnitCompletionAndExitToStudentPortal = function(hostEl, meta) {
        window.stopAllAl3lmAudio();
        window.syncAl3lmStudentProgressSnapshot(meta);

        if (isTeacher) {
            if (!hostEl) return;
            hostEl.innerHTML = `
                <div class="al3lm-exit-portal-card">
                    <div style="font-size:2.6rem;">🏆🌟</div>
                    <h2 style="color:#064e3b;font-weight:900;">اكتملت معاينة هذه الوحدة (${meta.score || ''})</h2>
                    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
                        <a href="teachers.html" class="al3lm-exit-btn">🏫 العودة إلى بوابة المعلمين</a>
                        <button type="button" class="al3lm-exit-btn" style="background:#0f172a;" onclick="location.reload()">⬅ متابعة المعاينة</button>
                    </div>
                </div>
            `;
            return;
        }

        if (hostEl) {
            hostEl.innerHTML = `
                <div class="al3lm-exit-portal-card">
                    <div style="font-size:3rem;line-height:1;">🌟🏆</div>
                    <h2 style="color:#064e3b;font-size:1.45rem;font-weight:900;">مُبَارَكٌ! أَتْمَمْتَ دَرْسَ اليَوْمِ بِنَجَاحٍ!</h2>
                    <div style="background:#fef9c3;border:2px solid #eab308;color:#713f12;padding:6px 18px;border-radius:999px;font-weight:900;font-size:1.1rem;">
                        عَلَامَتُكَ: ${meta.score || 'مكتمل ⭐'}
                    </div>
                    <p style="font-weight:800;color:#334155;font-size:0.95rem;">جاري تسجيل علامتك والانتقال إلى بوابتك الشخصية لضبط منبّه الدرس القادم...</p>
                    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
                        ${meta.extraExamBtn ? `<button type="button" class="al3lm-exit-btn" id="al3lm-cyc-exam-trigger" style="background:#b45309;">${meta.extraExamBtn.label}</button>` : ''}
                        <a href="student.html?wrapup=1" class="al3lm-exit-btn">🏠 الانتقال إلى بوابتي وسجل علاماتي ⬅</a>
                    </div>
                </div>
            `;
            if (meta.extraExamBtn) {
                const exB = hostEl.querySelector('#al3lm-cyc-exam-trigger');
                if (exB) exB.onclick = () => { clearTimeout(window._al3lmAutoRedirectTmr); meta.extraExamBtn.onClick(); };
            }
        }

        if (!meta.extraExamBtn) {
            window._al3lmAutoRedirectTmr = setTimeout(() => {
                window.location.href = 'student.html?wrapup=1';
            }, 2200);
        }
    };

    // 5. Wire top identity capsule link & auto-start when arriving from student.html or teachers.html
    document.addEventListener('DOMContentLoaded', () => {
        const mo = new MutationObserver(scanAndInjectStopButtons);
        mo.observe(document.body, { childList: true, subtree: true });
        scanAndInjectStopButtons();

        const homeLink = document.getElementById('header-year-badge') || document.getElementById('home-identity-capsule');
        if (homeLink) {
            homeLink.href = isTeacher ? 'teachers.html' : 'student.html';
            homeLink.title = isTeacher ? 'العودة إلى بوابة المعلمين' : 'العودة إلى بوابة التلميذ وسجل العلامات';
            homeLink.addEventListener('click', () => {
                window.stopAllAl3lmAudio();
                window.syncAl3lmStudentProgressSnapshot();
            });
        }

        // Auto-bypass internal #welcome-screen when launched from student.html (?autostart=1) or teachers.html
        const shouldAutoStart = (params.get('autostart') === '1') || isTeacher || Boolean(localStorage.getItem('al3lm_active_student_user'));
        const ws = document.getElementById('welcome-screen');
        if (ws && shouldAutoStart) {
            ws.style.display = 'none';
            if (typeof startLesson === 'function') {
                try { startLesson(); } catch (_) {}
            }
        }
    });
})();
</script>
