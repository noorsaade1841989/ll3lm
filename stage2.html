        // ====================================================================
        // المحرك التفاعلي المدمج للرياضيات (subj 4) والعلوم (subj 6) والرياضة (subj 5)
        // ====================================================================
        window.InteractiveLabEngine = (function() {
            let activeAnimId = null;
            let activeInterval = null;

            function stopActiveTimers() {
                if (activeAnimId) { cancelAnimationFrame(activeAnimId); activeAnimId = null; }
                if (activeInterval) { clearInterval(activeInterval); activeInterval = null; }
            }

            function render(stageContainer, labData, subjId) {
                stopActiveTimers();
                stageContainer.innerHTML = '';
                const type = labData?.type || (subjId === 4 ? 'pythagoras' : (subjId === 6 ? 'optics_lens' : 'avatar_trainer'));

                const headerPill = document.createElement('div');
                headerPill.className = 'lab-header-pill';
                const canvasWrap = document.createElement('div');
                canvasWrap.className = 'lab-canvas-wrap';
                const controlsBar = document.createElement('div');
                controlsBar.className = 'lab-controls-bar';

                stageContainer.appendChild(headerPill);
                stageContainer.appendChild(canvasWrap);
                stageContainer.appendChild(controlsBar);

                // ١. مختبر الكسور والنسب المئوية التفاعلي (رياضيات)
                if (type === 'fractions') {
                    headerPill.innerHTML = '<span>📐 مُخْتَبَرُ الكُسُورِ وَالنِّسَبِ المِئَوِيَّةِ البَصَرِيّ</span>';
                    let num = labData.num || 3, den = labData.den || 8;
                    const canvas = document.createElement('canvas');
                    canvas.width = 520; canvas.height = 250;
                    canvasWrap.appendChild(canvas);
                    const ctx = canvas.getContext('2d');

                    function drawFrac() {
                        if (num > den) num = den;
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        const cx = 155, cy = 125, r = 92;
                        for (let i = 0; i < den; i++) {
                            const a1 = (i / den) * Math.PI * 2 - Math.PI / 2;
                            const a2 = ((i + 1) / den) * Math.PI * 2 - Math.PI / 2;
                            ctx.beginPath();
                            ctx.moveTo(cx, cy);
                            ctx.arc(cx, cy, r, a1, a2);
                            ctx.closePath();
                            ctx.fillStyle = (i < num) ? '#10b981' : 'rgba(255,255,255,0.1)';
                            ctx.fill();
                            ctx.strokeStyle = '#fde047';
                            ctx.lineWidth = 2;
                            ctx.stroke();
                        }
                        const pct = ((num / den) * 100).toFixed(1).replace(/\.0$/, '');
                        ctx.fillStyle = '#fef08a';
                        ctx.font = 'bold 34px Cairo';
                        ctx.textAlign = 'center';
                        ctx.fillText(`${num} / ${den}`, 380, 95);
                        ctx.fillStyle = '#6ee7b7';
                        ctx.font = 'bold 22px Cairo';
                        ctx.fillText(`= ${(num / den).toFixed(2)}  (${pct}%)`, 380, 145);
                    }

                    controlsBar.innerHTML = `
                        <label class="lab-ctrl-group">البَسْطُ: <input type="range" id="f-num" min="0" max="12" value="${num}"><span class="lab-val-badge" id="f-num-v">${num}</span></label>
                        <label class="lab-ctrl-group">المَقَامُ: <input type="range" id="f-den" min="1" max="12" value="${den}"><span class="lab-val-badge" id="f-den-v">${den}</span></label>
                    `;
                    const numIn = controlsBar.querySelector('#f-num');
                    const denIn = controlsBar.querySelector('#f-den');
                    numIn.oninput = () => { num = parseInt(numIn.value, 10); if (num > den) { den = num; denIn.value = den; } controlsBar.querySelector('#f-num-v').innerText = num; controlsBar.querySelector('#f-den-v').innerText = den; drawFrac(); };
                    denIn.oninput = () => { den = parseInt(denIn.value, 10); if (num > den) { num = den; numIn.value = num; } controlsBar.querySelector('#f-den-v').innerText = den; controlsBar.querySelector('#f-num-v').innerText = num; drawFrac(); };
                    drawFrac();
                }

                // ٢. مختبر مبرهنة فيثاغورس والهندسة الحرة (a² + b² = c²)
                else if (type === 'pythagoras') {
                    headerPill.innerHTML = '<span>📐 مُخْتَبَرُ مَبْرْهَنَةِ فِيثَاغُورْسَ البَصَرِيّ (a² + b² = c²)</span>';
                    let a = labData.a || 3, b = labData.b || 4;
                    const canvas = document.createElement('canvas');
                    canvas.width = 560; canvas.height = 260;
                    canvasWrap.appendChild(canvas);
                    const ctx = canvas.getContext('2d');

                    function drawPyth() {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        const scale = 18;
                        const ox = 190, oy = 185;
                        const pxA = a * scale, pxB = b * scale;
                        const c = Math.sqrt(a * a + b * b);

                        // مربع الضلع a
                        ctx.fillStyle = 'rgba(16, 185, 129, 0.28)';
                        ctx.strokeStyle = '#10b981';
                        ctx.lineWidth = 2;
                        ctx.fillRect(ox - pxA, oy - pxA, pxA, pxA);
                        ctx.strokeRect(ox - pxA, oy - pxA, pxA, pxA);

                        // مربع الضلع b
                        ctx.fillStyle = 'rgba(56, 189, 248, 0.28)';
                        ctx.strokeStyle = '#38bdf8';
                        ctx.fillRect(ox, oy, pxB, pxB * 0.85);
                        ctx.strokeRect(ox, oy, pxB, pxB * 0.85);

                        // المثلث القائم
                        ctx.beginPath();
                        ctx.moveTo(ox, oy);
                        ctx.lineTo(ox, oy - pxA);
                        ctx.lineTo(ox + pxB, oy);
                        ctx.closePath();
                        ctx.fillStyle = 'rgba(250, 204, 21, 0.35)';
                        ctx.fill();
                        ctx.strokeStyle = '#fde047';
                        ctx.lineWidth = 3;
                        ctx.stroke();

                        // زاوية قائمة
                        ctx.strokeRect(ox, oy - 12, 12, 12);

                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 18px Cairo';
                        ctx.textAlign = 'right';
                        ctx.fillText(`a = ${a}  ⟹  a² = ${a * a}`, 535, 75);
                        ctx.fillText(`b = ${b}  ⟹  b² = ${b * b}`, 535, 115);
                        ctx.fillStyle = '#fde047';
                        ctx.font = 'bold 20px Cairo';
                        ctx.fillText(`c = √(${a * a} + ${b * b}) = ${c.toFixed(2).replace(/\.00$/, '')}`, 535, 165);
                    }

                    controlsBar.innerHTML = `
                        <label class="lab-ctrl-group">الضِّلْعُ القَائِمُ (a): <input type="range" id="p-a" min="2" max="8" value="${a}"><span class="lab-val-badge" id="p-a-v">${a}</span></label>
                        <label class="lab-ctrl-group">الضِّلْعُ القَائِمُ (b): <input type="range" id="p-b" min="2" max="9" value="${b}"><span class="lab-val-badge" id="p-b-v">${b}</span></label>
                    `;
                    controlsBar.querySelector('#p-a').oninput = (e) => { a = +e.target.value; controlsBar.querySelector('#p-a-v').innerText = a; drawPyth(); };
                    controlsBar.querySelector('#p-b').oninput = (e) => { b = +e.target.value; controlsBar.querySelector('#p-b-v').innerText = b; drawPyth(); };
                    drawPyth();
                }

                // ٣. مختبر الميزان الجبري وحل المعادلات (ax + b = c)
                else if (type === 'balance_eq') {
                    headerPill.innerHTML = '<span>⚖️ مِيزَانُ المُعَادَلَاتِ الجَبْرِيَّةِ الحَيّ (2x + 3 = 11)</span>';
                    let xVal = 2;
                    const targetX = 4; // 2(4) + 3 = 11
                    const canvas = document.createElement('canvas');
                    canvas.width = 540; canvas.height = 250;
                    canvasWrap.appendChild(canvas);
                    const ctx = canvas.getContext('2d');

                    function drawScale() {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        const leftW = 2 * xVal + 3;
                        const rightW = 11;
                        const tilt = Math.max(-0.26, Math.min(0.26, (rightW - leftW) * 0.035));

                        // قاعدة الميزان
                        ctx.fillStyle = '#94a3b8';
                        ctx.beginPath(); ctx.moveTo(270, 120); ctx.lineTo(245, 225); ctx.lineTo(295, 225); ctx.closePath(); ctx.fill();

                        ctx.save();
                        ctx.translate(270, 120);
                        ctx.rotate(tilt);

                        // ذراع الميزان
                        ctx.strokeStyle = (leftW === rightW) ? '#10b981' : '#fde047';
                        ctx.lineWidth = 6;
                        ctx.beginPath(); ctx.moveTo(-165, 0); ctx.lineTo(165, 0); ctx.stroke();

                        // الكفتان
                        ctx.fillStyle = 'rgba(16, 185, 129, 0.32)';
                        ctx.fillRect(-215, -38, 105, 36);
                        ctx.fillStyle = 'rgba(56, 189, 248, 0.32)';
                        ctx.fillRect(110, -38, 105, 36);

                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 17px Cairo';
                        ctx.textAlign = 'center';
                        ctx.fillText(`2(${xVal}) + 3 = ${leftW}`, -162, -14);
                        ctx.fillText(`11`, 162, -14);
                        ctx.restore();

                        ctx.fillStyle = (leftW === rightW) ? '#4ade80' : '#fef08a';
                        ctx.font = 'bold 19px Cairo';
                        ctx.textAlign = 'center';
                        ctx.fillText(leftW === rightW ? `✅ تَعَادَلَتِ الكِفَّتَانِ! حَلُّ المُعَادَلَةِ x = ${xVal}` : `حرِّكْ قِيمَةَ المَجْهُولِ (x) حَتَّى يَتَّزِنَ المِيزَانُ`, 270, 34);
                    }

                    controlsBar.innerHTML = `
                        <label class="lab-ctrl-group">قِيمَةُ المَجْهُولِ (x): <input type="range" id="eq-x" min="0" max="8" value="${xVal}"><span class="lab-val-badge" id="eq-x-v">${xVal}</span></label>
                    `;
                    controlsBar.querySelector('#eq-x').oninput = (e) => { xVal = +e.target.value; controlsBar.querySelector('#eq-x-v').innerText = xVal; drawScale(); if (xVal === targetX) playCorrectChime(); };
                    drawScale();
                }

                // ٤. مختبر الدائرة المثلثية والأعداد العقدية (sin, cos, e^iθ)
                else if (type === 'trig_circle') {
                    headerPill.innerHTML = '<span>🧭 الدَّائِرَةُ المُثَلَّثِيَّةُ وَالأَعْدَادُ العُقَدِيَّةُ (cos θ + i sin θ)</span>';
                    let deg = labData.deg || 45;
                    const canvas = document.createElement('canvas');
                    canvas.width = 540; canvas.height = 250;
                    canvasWrap.appendChild(canvas);
                    const ctx = canvas.getContext('2d');

                    function drawTrig() {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        const cx = 145, cy = 125, r = 92;
                        const rad = (deg * Math.PI) / 180;
                        const px = cx + r * Math.cos(rad);
                        const py = cy - r * Math.sin(rad);

                        ctx.strokeStyle = 'rgba(255,255,255,0.22)';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath(); ctx.moveTo(cx - 110, cy); ctx.lineTo(cx + 110, cy); ctx.moveTo(cx, cy - 110); ctx.lineTo(cx, cy + 110); ctx.stroke();

                        ctx.strokeStyle = '#6ee7b7';
                        ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();

                        // جيب التمام cos (أفقي) والجيب sin (عمودي)
                        ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3.5;
                        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px, cy); ctx.stroke();
                        ctx.strokeStyle = '#f43f5e';
                        ctx.beginPath(); ctx.moveTo(px, cy); ctx.lineTo(px, py); ctx.stroke();

                        // الشعاع الدوراني
                        ctx.strokeStyle = '#fde047';
                        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px, py); ctx.stroke();
                        ctx.fillStyle = '#fde047';
                        ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill();

                        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 17px Cairo'; ctx.textAlign = 'right';
                        ctx.fillText(`الزَّاوِيَةُ θ = ${deg}°`, 520, 65);
                        ctx.fillStyle = '#38bdf8'; ctx.fillText(`cos(${deg}°) = ${Math.cos(rad).toFixed(3)}`, 520, 108);
                        ctx.fillStyle = '#fb7185'; ctx.fillText(`sin(${deg}°) = ${Math.sin(rad).toFixed(3)}`, 520, 148);
                        ctx.fillStyle = '#fde047'; ctx.fillText(`z = e^(iθ)  |z| = 1`, 520, 192);
                    }

                    controlsBar.innerHTML = `
                        <label class="lab-ctrl-group">الزَّاوِيَةُ المَوَجَّهَةُ (θ°): <input type="range" id="tr-deg" min="0" max="360" value="${deg}"><span class="lab-val-badge" id="tr-deg-v">${deg}°</span></label>
                    `;
                    controlsBar.querySelector('#tr-deg').oninput = (e) => { deg = +e.target.value; controlsBar.querySelector('#tr-deg-v').innerText = deg + '°'; drawTrig(); };
                    drawTrig();
                }

                // ٥. راسم الدوال والمماس (الاشتقاق) والمساحة (التكامل للتيرمينال)
                else if (type === 'function_deriv') {
                    headerPill.innerHTML = '<span>📈 رَاسِمُ الدَّوَالِّ وَالمُشْتَقِّ (المَمَاسّ) وَالتَّكَامُلِ</span>';
                    let x0 = 1.0;
                    const canvas = document.createElement('canvas');
                    canvas.width = 550; canvas.height = 250;
                    canvasWrap.appendChild(canvas);
                    const ctx = canvas.getContext('2d');

                    // الدالة المرجعية f(x) = 0.25 x² - 1
                    const f = (x) => 0.35 * x * x - 1.2;
                    const df = (x) => 0.7 * x;

                    function drawFunc() {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        const ox = 185, oy = 165, sc = 34;

                        // تظليل المساحة التكاملية من 0 إلى x0
                        ctx.fillStyle = 'rgba(16, 185, 129, 0.25)';
                        ctx.beginPath();
                        ctx.moveTo(ox, oy);
                        const step = x0 >= 0 ? 0.05 : -0.05;
                        for (let x = 0; (x0 >= 0 ? x <= x0 : x >= x0); x += step) {
                            ctx.lineTo(ox + x * sc, oy - f(x) * sc);
                        }
                        ctx.lineTo(ox + x0 * sc, oy);
                        ctx.closePath();
                        ctx.fill();

                        // المحاور
                        ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 1.5;
                        ctx.beginPath(); ctx.moveTo(20, oy); ctx.lineTo(350, oy); ctx.moveTo(ox, 15); ctx.lineTo(ox, 235); ctx.stroke();

                        // منحنى الدالة
                        ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3;
                        ctx.beginPath();
                        for (let x = -3.8; x <= 3.8; x += 0.08) {
                            const sx = ox + x * sc, sy = oy - f(x) * sc;
                            if (x === -3.8) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
                        }
                        ctx.stroke();

                        // المماس عند x0 (المشتق)
                        const y0 = f(x0), slope = df(x0);
                        ctx.strokeStyle = '#fde047'; ctx.lineWidth = 2.2;
                        ctx.beginPath();
                        const dx = 1.6;
                        ctx.moveTo(ox + (x0 - dx) * sc, oy - (y0 - slope * dx) * sc);
                        ctx.lineTo(ox + (x0 + dx) * sc, oy - (y0 + slope * dx) * sc);
                        ctx.stroke();

                        ctx.fillStyle = '#f43f5e';
                        ctx.beginPath(); ctx.arc(ox + x0 * sc, oy - y0 * sc, 5.5, 0, Math.PI * 2); ctx.fill();

                        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 16px Cairo'; ctx.textAlign = 'right';
                        ctx.fillText(`النُّقْطَةُ x₀ = ${x0.toFixed(1)}`, 535, 75);
                        ctx.fillStyle = '#fde047';
                        ctx.fillText(`المُشْتَقُّ (مَيْلُ المَمَاسّ) f'(${x0.toFixed(1)}) = ${slope.toFixed(2)}`, 535, 120);
                        ctx.fillStyle = '#6ee7b7';
                        const integralVal = (0.35 * Math.pow(x0, 3) / 3) - 1.2 * x0;
                        ctx.fillText(`التَّكَامُلُ ∫₀ˣ f(t)dt = ${integralVal.toFixed(2)}`, 535, 165);
                    }

                    controlsBar.innerHTML = `
                        <label class="lab-ctrl-group">مَوْضِعُ النُّقْطَةِ (x₀): <input type="range" id="fn-x" min="-3" max="3" step="0.2" value="${x0}"><span class="lab-val-badge" id="fn-x-v">${x0}</span></label>
                    `;
                    controlsBar.querySelector('#fn-x').oninput = (e) => { x0 = parseFloat(e.target.value); controlsBar.querySelector('#fn-x-v').innerText = x0.toFixed(1); drawFunc(); };
                    drawFunc();
                }

                // ٦. مختبر العدسات الضوئية وقانون الانكسار (علوم وفيزياء)
                else if (type === 'optics_lens' || type === 'projectile_sim' || type === 'circuit_ohm') {
                    if (type === 'projectile_sim') {
                        headerPill.innerHTML = '<span>🚀 مُخْتَبَرُ حَرَكَةِ القَذَائِفِ فِي حَقْلِ الجَاذِبِيَّةِ</span>';
                        let angle = 45, v0 = 22;
                        const canvas = document.createElement('canvas');
                        canvas.width = 550; canvas.height = 245;
                        canvasWrap.appendChild(canvas);
                        const ctx = canvas.getContext('2d');

                        function drawProj() {
                            ctx.clearRect(0, 0, canvas.width, canvas.height);
                            const g = 9.8, rad = (angle * Math.PI) / 180;
                            const ox = 45, oy = 215, sc = 7.2;
                            ctx.strokeStyle = '#6ee7b7'; ctx.lineWidth = 2;
                            ctx.beginPath(); ctx.moveTo(20, oy); ctx.lineTo(530, oy); ctx.stroke();

                            ctx.strokeStyle = '#fde047'; ctx.lineWidth = 3; ctx.setLineDash([5, 4]);
                            ctx.beginPath(); ctx.moveTo(ox, oy);
                            const tMax = (2 * v0 * Math.sin(rad)) / g;
                            for (let t = 0; t <= tMax; t += 0.05) {
                                const x = v0 * Math.cos(rad) * t;
                                const y = v0 * Math.sin(rad) * t - 0.5 * g * t * t;
                                ctx.lineTo(ox + x * sc, oy - y * sc);
                            }
                            ctx.stroke(); ctx.setLineDash([]);

                            const range = ((v0 * v0 * Math.sin(2 * rad)) / g).toFixed(1);
                            const hMax = ((Math.pow(v0 * Math.sin(rad), 2)) / (2 * g)).toFixed(1);
                            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 16px Cairo'; ctx.textAlign = 'right';
                            ctx.fillText(`المَدَى الأُفُقِيُّ = ${range} m  |  الذُّرْوَةُ = ${hMax} m`, 525, 36);
                        }
                        controlsBar.innerHTML = `
                            <label class="lab-ctrl-group">زَاوِيَةُ القَذْفِ: <input type="range" id="pr-a" min="15" max="80" value="${angle}"><span class="lab-val-badge" id="pr-a-v">${angle}°</span></label>
                            <label class="lab-ctrl-group">السُّرْعَةُ (v₀): <input type="range" id="pr-v" min="10" max="26" value="${v0}"><span class="lab-val-badge" id="pr-v-v">${v0}</span></label>
                        `;
                        controlsBar.querySelector('#pr-a').oninput = (e) => { angle = +e.target.value; controlsBar.querySelector('#pr-a-v').innerText = angle + '°'; drawProj(); };
                        controlsBar.querySelector('#pr-v').oninput = (e) => { v0 = +e.target.value; controlsBar.querySelector('#pr-v-v').innerText = v0; drawProj(); };
                        drawProj();
                    } else if (type === 'circuit_ohm') {
                        headerPill.innerHTML = '<span>⚡ مُخْتَبَرُ قَانُونِ أُوم وَالدَّارَةِ الكَهْرَبَائِيَّةِ (I = U ÷ R)</span>';
                        let u = 12, r = 4;
                        const canvas = document.createElement('canvas');
                        canvas.width = 540; canvas.height = 240;
                        canvasWrap.appendChild(canvas);
                        const ctx = canvas.getContext('2d');

                        function drawOhm() {
                            ctx.clearRect(0, 0, canvas.width, canvas.height);
                            const cur = u / r;
                            const glow = Math.min(1, cur / 6);
                            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 4;
                            ctx.strokeRect(110, 55, 320, 135);

                            // المصباح المتوهج حسب شدة التيار
                            ctx.save();
                            ctx.beginPath(); ctx.arc(270, 55, 24, 0, Math.PI * 2);
                            ctx.fillStyle = `rgba(253, 224, 71, ${0.15 + glow * 0.85})`;
                            ctx.shadowColor = '#fde047'; ctx.shadowBlur = glow * 35;
                            ctx.fill(); ctx.strokeStyle = '#fde047'; ctx.stroke();
                            ctx.restore();

                            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 18px Cairo'; ctx.textAlign = 'center';
                            ctx.fillText(`شِدَّةُ التَّيَّارِ I = ${u}V ÷ ${r}Ω = ${cur.toFixed(2)} A`, 270, 135);
                        }
                        controlsBar.innerHTML = `
                            <label class="lab-ctrl-group">التَّوَتُّرُ (U): <input type="range" id="oh-u" min="2" max="24" value="${u}"><span class="lab-val-badge" id="oh-u-v">${u}V</span></label>
                            <label class="lab-ctrl-group">المُقَاوَمَةُ (R): <input type="range" id="oh-r" min="2" max="12" value="${r}"><span class="lab-val-badge" id="oh-r-v">${r}Ω</span></label>
                        `;
                        controlsBar.querySelector('#oh-u').oninput = (e) => { u = +e.target.value; controlsBar.querySelector('#oh-u-v').innerText = u + 'V'; drawOhm(); };
                        controlsBar.querySelector('#oh-r').oninput = (e) => { r = +e.target.value; controlsBar.querySelector('#oh-r-v').innerText = r + 'Ω'; drawOhm(); };
                        drawOhm();
                    } else {
                        headerPill.innerHTML = '<span>🔬 مُخْتَبَرُ العَدَسَةِ المُقَارِبَةِ وَتَشَكُّلِ الخَيَالِ</span>';
                        let dObj = 140;
                        const fLen = 70;
                        const canvas = document.createElement('canvas');
                        canvas.width = 560; canvas.height = 245;
                        canvasWrap.appendChild(canvas);
                        const ctx = canvas.getContext('2d');

                        function drawLens() {
                            ctx.clearRect(0, 0, canvas.width, canvas.height);
                            const cx = 280, cy = 122, hObj = 50;
                            ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1.5;
                            ctx.beginPath(); ctx.moveTo(20, cy); ctx.lineTo(540, cy); ctx.stroke();

                            // العدسة المحدبة
                            ctx.fillStyle = 'rgba(56, 189, 248, 0.28)'; ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2.5;
                            ctx.beginPath(); ctx.ellipse(cx, cy, 11, 88, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

                            // المحرقان F و F'
                            ctx.fillStyle = '#fde047';
                            ctx.beginPath(); ctx.arc(cx - fLen, cy, 4, 0, Math.PI * 2); ctx.arc(cx + fLen, cy, 4, 0, Math.PI * 2); ctx.fill();

                            // الجسم المضيء
                            const ox = cx - dObj;
                            ctx.strokeStyle = '#10b981'; ctx.lineWidth = 4;
                            ctx.beginPath(); ctx.moveTo(ox, cy); ctx.lineTo(ox, cy - hObj); ctx.stroke();

                            // حساب موضع الخيال 1/d' = 1/f - 1/d
                            if (Math.abs(dObj - fLen) > 4) {
                                const dImg = 1 / ((1 / fLen) - (1 / dObj));
                                const hImg = -hObj * (dImg / dObj);
                                const ix = cx + dImg;

                                // الأشعة الضوئية
                                ctx.strokeStyle = '#fde047'; ctx.lineWidth = 1.6;
                                ctx.beginPath(); ctx.moveTo(ox, cy - hObj); ctx.lineTo(cx, cy - hObj); ctx.lineTo(ix, cy - hImg); ctx.stroke();
                                ctx.beginPath(); ctx.moveTo(ox, cy - hObj); ctx.lineTo(ix, cy - hImg); ctx.stroke();

                                // الخيال المتشكل
                                ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 4;

        // ================= بناء الأطوار (المدار، الاتزان، التألق، الإشعاع) =================
        function ensureOptionsForQuestion(rawOpts, isTrueFalseQuestion = false) {
            let letterChar = getAbjadChar(playWeek - 1);
            let abjadVal = getAbjadNum(playWeek - 1);
            if (isTrueFalseQuestion || (rawOpts.length === 2 && (String(rawOpts[0]?.text).includes('صَح') || String(rawOpts[0]?.text).includes('✔️')))) {
                return rawOpts.slice(0, 2).map((o, idx) => ({ mainText: o.text, subText: '', correct: Boolean(o.correct || o.isCorrect), origIdx: idx }));
            }
            let cleaned = [];
            let seenTexts = new Set();
            rawOpts.forEach((o, idx) => {
                let mainPart = String(o.text || '').trim();
                if (mainPart && !seenTexts.has(mainPart)) {
                    seenTexts.add(mainPart);
                    cleaned.push({ mainText: mainPart, subText: o.showSubDetail ? (o.subText || '') : '', correct: Boolean(o.correct || o.isCorrect), origIdx: idx });
                }
            });
            let fallbackPool = [`${abjadVal + 2}`, `${abjadVal * 2}`, `${playWeek + 5}`, `١٨٠°`, letterChar];
            let pIdx = 0;
            while (cleaned.length < 4 && pIdx < fallbackPool.length) {
                let cand = String(fallbackPool[pIdx++]).trim();
                if (!seenTexts.has(cand)) { seenTexts.add(cand); cleaned.push({ mainText: cand, subText: '', correct: false, origIdx: cleaned.length }); }
            }
            return cleaned.slice(0, 4);
        }

        function buildUniqueHajjQuestions(defData, targetCount) {
            let sourcePool = [];
            if (defData?.play) {
                if (Array.isArray(defData.play.questions) && defData.play.questions.length > 0) sourcePool = defData.play.questions;
                else if (Array.isArray(defData.play.hajjQuestions) && defData.play.hajjQuestions.length > 0) sourcePool = defData.play.hajjQuestions;
            }
            let uniqueQuestions = [];
            let seenQ = new Set();
            sourcePool.forEach(qItem => {
                let key = `${qItem?.q || ''}_${qItem?.focusWord || ''}`;
                if (qItem && (qItem.q || qItem.focusWord) && !seenQ.has(key)) { seenQ.add(key); uniqueQuestions.push(qItem); }
            });
            if (uniqueQuestions.length === 0) {
                let ltr = getAbjadChar(playWeek - 1);
                let cyc = getCycleFromGlobalWeek(playWeek);
                uniqueQuestions.push({
                    q: `فِي الدَّوْرَةِ (${cyc}) — الوَحْدَةِ (${playWeek}): مَا الحَرْفُ المِحْوَرِيُّ لِهٰذَا المَدَارْ؟`,
                    focusWord: ltr,
                    options: [{ text: ltr, correct: true }, { text: 'م', correct: false }, { text: 'س', correct: false }, { text: 'ب', correct: false }]
                });
            }
            return uniqueQuestions.slice(0, targetCount);
        }

        function extractQuestionStemAndFocus(qObj) {
            let rawQ = String(qObj.q || '').trim();
            if (qObj.focusWord) return { stem: rawQ.replace(`«${qObj.focusWord}»`, '').trim(), focus: qObj.focusWord };
            let guillemetMatch = rawQ.match(/«([^»]+)»/);
            if (guillemetMatch) return { stem: rawQ.replace(guillemetMatch[0], '').trim(), focus: guillemetMatch[1] };
            return { stem: rawQ, focus: '' };
        }

        function renderQuizStation(contentDiv, defData) {
            if (currentQuestionIdx === 0 || sessionHajjQuestions.length === 0) {
                sessionHajjQuestions = buildUniqueHajjQuestions(defData, MAX_COINS_FOR_YEAR);
            }
            currentStationTotalQuestions = sessionHajjQuestions.length;
            if (currentQuestionIdx >= currentStationTotalQuestions) currentQuestionIdx = 0;

            let qObj = sessionHajjQuestions[currentQuestionIdx];
            if (isSecretEditMode) {
                let qNavExtra = `<div style="display:flex; gap:6px; align-items:center;">
                     <button class="skip-gift-btn" onclick="if(currentQuestionIdx>0){currentQuestionIdx--;renderCurrentStep();}">سؤال ❮</button>
                     <span>(${currentQuestionIdx + 1}/${currentStationTotalQuestions})</span>
                     <button class="skip-gift-btn" onclick="if(currentQuestionIdx+1<currentStationTotalQuestions){currentQuestionIdx++;renderCurrentStep();}">❯ سؤال</button>
                   </div>`;
                createRoomHeader(contentDiv, SUBJ_TITLES[activeViewSubj], qNavExtra);
            }

            let card = document.createElement('div');
            card.className = 'fancy-card quiz-card';
            let { stem, focus } = extractQuestionStemAndFocus(qObj);
            let qBox = document.createElement('div');
            qBox.className = 'quiz-question-box';
            qBox.innerHTML = `
                <div style="font-size:0.82rem; font-weight:900; color:#047857; margin-bottom:4px;">🪐 طَوْرُ المَدَارِ وَالبُرْهَان — السُّؤَالُ (${currentQuestionIdx + 1} مِنْ ${currentStationTotalQuestions})</div>
                <p class="quiz-question-stem" data-edit-field="q_stem">${colorizeHarakaAndMadd(stem)}</p>
                ${focus ? `<div class="quiz-focus-target" data-edit-field="q_focus">${colorizeHarakaAndMadd(focus)}</div>` : ''}
            `;
            card.appendChild(qBox);

            let isTrueFalse = Boolean(qObj.isTrueFalse) || (qObj.options && qObj.options.length === 2);
            let processedOpts = ensureOptionsForQuestion(qObj.options || [], isTrueFalse);
            let shuffledOpts = (isTrueFalse || isSecretEditMode) ? processedOpts : [...processedOpts].sort(() => Math.random() - 0.5);

            let maxOptLen = Math.max(...shuffledOpts.map(o => o.mainText.replace(/[\u064B-\u0652]/g, '').length));
            let gridClass = isTrueFalse ? 'grid-2x1' : (maxOptLen > 24 ? 'grid-stack' : 'grid-2x2');
            let btnSizeClass = isTrueFalse ? 'opt-word' : (maxOptLen <= 4 ? 'opt-huge-glyph' : (maxOptLen > 24 ? 'opt-sentence' : 'opt-word'));

            let optsGrid = document.createElement('div');
            optsGrid.className = `quiz-options-grid ${gridClass}`;

            let isAnswered = false;
            const advanceToNextQuestionOrFinish = () => {
                if (currentQuestionIdx + 1 < currentStationTotalQuestions) {
                    currentQuestionIdx++;
                    renderCurrentStep();
                } else {
                    updateNavButtons(true);
                    showCenterAction(() => handleNextClick(), false, null);
                }
            };

            shuffledOpts.forEach((opt) => {
                let btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `quiz-opt-btn ${btnSizeClass}`;
                btn.dataset.correct = opt.correct ? '1' : '0';
                if (isSecretEditMode && opt.correct) btn.style.borderColor = '#10b981';

                btn.innerHTML = `<span class="opt-main-text" data-edit-field="q_opt_${opt.origIdx}" style="${isSecretEditMode ? '' : 'pointer-events:none;'}">${colorizeHarakaAndMadd(opt.mainText)}</span>`;

                btn.onclick = (ev) => {
                    if (isSecretEditMode || isAnswered) return;
                    isAnswered = true;
                    const targetBtn = ev.currentTarget.closest('.quiz-opt-btn') || btn;
                    if (opt.correct) {
                        targetBtn.classList.add('correct');
                        playCorrectChime();
                        awardCoin('hajj', currentQuestionIdx);
                        setTimeout(advanceToNextQuestionOrFinish, 820);
                    } else {
                        targetBtn.classList.add('wrong');
                        hajjErrorsCount++;
                        playWrongTone();
                        setTimeout(() => {
                            optsGrid.querySelectorAll('.quiz-opt-btn').forEach(b => { if (b.dataset.correct === '1') b.classList.add('correct'); });
                        }, 240);
                        setTimeout(advanceToNextQuestionOrFinish, 1050);
                    }
                };
                optsGrid.appendChild(btn);
            });

            card.appendChild(optsGrid);
            contentDiv.appendChild(card);

            let spokenQ = (focus && focus !== stem) ? `${stem} ، ${focus}` : stem;
            speakText(spokenQ, () => { if (isFreeExplore || isSecretEditMode) updateNavButtons(true); });
            if (isSecretEditMode) attachEditHooksToCurrentStation(defData);
        }

        function buildSadaqahPairs(defData, neededCount) {
            let pool = Array.isArray(defData?.play?.sadaqahPairs) ? [...defData.play.sadaqahPairs] : [];
            let uniquePairs = [];
            let seenR = new Set(), seenL = new Set();
            pool.forEach(p => {
                if (p.right && p.left && !seenR.has(p.right) && !seenL.has(p.left)) {
                    seenR.add(p.right); seenL.add(p.left); uniquePairs.push(p);
                }
            });
            let letterChar = getAbjadChar(playWeek - 1);
            let abj = getAbjadNum(playWeek - 1);
            let fallbackPairs = [
                { right: `الوَحْدَةُ (${playWeek}) × ٢`, left: `${playWeek * 2}` },
                { right: `قِيمَةُ حَرْفِ (${letterChar})`, left: `${abj}` },
                { right: `الدَّوْرَةُ الحَالِيَّةُ`, left: `${getCycleFromGlobalWeek(playWeek)}` }
            ];
            let fIdx = 0;
            while (uniquePairs.length < neededCount && fIdx < fallbackPairs.length) {
                let fp = fallbackPairs[fIdx++];
                if (!seenR.has(fp.right) && !seenL.has(fp.left)) { seenR.add(fp.right); seenL.add(fp.left); uniquePairs.push(fp); }
            }
            let selectedPairs = uniquePairs.slice(0, neededCount);
            let decoyLeft = defData?.play?.sadaqahDecoy || `${abj + 77}`;
            if (seenL.has(decoyLeft)) decoyLeft = `٠`;
            return { pairs: selectedPairs, decoy: decoyLeft };
        }

        function renderSadaqahMatchingStation(contentDiv, defData) {
            let needed = Math.min(3, Math.max(1, getSadaqahCount()));
            let { pairs, decoy } = buildSadaqahPairs(defData, needed);

            let card = document.createElement('div');
            card.className = 'fancy-card sadaqah-matching-card';
            let promptBar = document.createElement('div');
            promptBar.className = 'sadaqah-prompt-bar';
            let promptTxt = '⚖️ طَوْرُ الاتِّزَانِ المِيزَانِيّ: صِلْ كُلَّ مِقْدَارٍ فِي اليَمِينِ بِمُكَافِئِهِ الصَّحِيحِ فِي اليَسَارِ (الخِيَارُ الخَاطِئُ يُقْفَلُ فَوْرًا):';
            promptBar.innerText = promptTxt;
            card.appendChild(promptBar);

            let board = document.createElement('div');
            board.className = 'matching-board';
            let svgLayer = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svgLayer.setAttribute('id', 'match-svg-layer');
            board.appendChild(svgLayer);

            let rightCol = document.createElement('div'); rightCol.className = 'match-col match-col-right';
            let leftCol = document.createElement('div'); leftCol.className = 'match-col match-col-left';

            let leftOptions = pairs.map((p, idx) => ({ text: p.left, pairId: idx }));
            leftOptions.push({ text: decoy, pairId: -1 });
            if (!isSecretEditMode) leftOptions.sort(() => Math.random() - 0.5);

            let activeRightBtn = null, activeLeftBtn = null, resolvedCount = 0;

            function drawLineBetween(rBtn, lBtn) {
                const boardRect = board.getBoundingClientRect();
                const rDot = rBtn.querySelector('.match-anchor-dot').getBoundingClientRect();
                const lDot = lBtn.querySelector('.match-anchor-dot').getBoundingClientRect();
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', (rDot.left + rDot.width / 2) - boardRect.left);
                line.setAttribute('y1', (rDot.top + rDot.height / 2) - boardRect.top);
                line.setAttribute('x2', (lDot.left + lDot.width / 2) - boardRect.left);
                line.setAttribute('y2', (lDot.top + lDot.height / 2) - boardRect.top);
                line.setAttribute('stroke', '#059669');
                line.setAttribute('stroke-width', '4.5');
                svgLayer.appendChild(line);
            }

            function checkPairMatch(rBtn, lBtn) {
                let rId = parseInt(rBtn.dataset.pairId, 10), lId = parseInt(lBtn.dataset.pairId, 10);
                rBtn.classList.remove('selected'); lBtn.classList.remove('selected');
                activeRightBtn = null; activeLeftBtn = null;

                if (rId === lId) {
                    rBtn.classList.add('matched'); lBtn.classList.add('matched');
                    drawLineBetween(rBtn, lBtn); playCorrectChime();
                    awardCoin('sadaqah', resolvedCount);
                } else {
                    playWrongTone();
                    rBtn.classList.add('locked-wrong'); rBtn.disabled = true;
                    lBtn.classList.add('locked-wrong'); lBtn.disabled = true;
                }
                resolvedCount++;
                if (resolvedCount >= pairs.length) {
                    updateNavButtons(true);
                    setTimeout(() => showCenterAction(() => handleNextClick(), false, null), 520);
                }
            }

            pairs.forEach((p, idx) => {
                let rBtn = document.createElement('button');
                rBtn.type = 'button'; rBtn.className = 'match-item-btn'; rBtn.dataset.pairId = idx;
                rBtn.innerHTML = `<span data-edit-field="sad_r_${idx}">${colorizeHarakaAndMadd(p.right)}</span><span class="match-anchor-dot"></span>`;
                rBtn.onclick = () => {
                    if (isSecretEditMode || rBtn.classList.contains('matched') || rBtn.classList.contains('locked-wrong')) return;
                    rightCol.querySelectorAll('.match-item-btn').forEach(b => b.classList.remove('selected'));
                    rBtn.classList.add('selected'); activeRightBtn = rBtn;
                    if (activeLeftBtn) checkPairMatch(activeRightBtn, activeLeftBtn);
                };
                rightCol.appendChild(rBtn);
            });

            leftOptions.forEach(opt => {
                let lBtn = document.createElement('button');
                lBtn.type = 'button'; lBtn.className = 'match-item-btn'; lBtn.dataset.pairId = opt.pairId;
                let editKey = opt.pairId === -1 ? 'sad_decoy' : `sad_l_${opt.pairId}`;
                lBtn.innerHTML = `<span class="match-anchor-dot"></span><span data-edit-field="${editKey}">${colorizeHarakaAndMadd(opt.text)}</span>`;
                lBtn.onclick = () => {
                    if (isSecretEditMode || lBtn.classList.contains('matched') || lBtn.classList.contains('locked-wrong')) return;
                    leftCol.querySelectorAll('.match-item-btn').forEach(b => b.classList.remove('selected'));
                    lBtn.classList.add('selected'); activeLeftBtn = lBtn;
                    if (activeRightBtn) checkPairMatch(activeRightBtn, activeLeftBtn);
                };
                leftCol.appendChild(lBtn);
            });

            board.appendChild(rightCol); board.appendChild(leftCol);
            card.appendChild(board); contentDiv.appendChild(card);
            speakText(promptTxt, () => { if (isFreeExplore || isSecretEditMode) updateNavButtons(true); });
            if (isSecretEditMode) attachEditHooksToCurrentStation(defData);
        }

            let collectedCount = 0, wrongClicks = 0, isCompleted = false;
            let allGoodCount = (cfg.items || []).filter(x => x.good || x.isCorrect).length;
            let neededTotal = Math.min(allGoodCount || 3, cfg.targetCount || 3);

            basketZone.innerHTML = `<span class="basket-icon-txt" id="gift-box-icon">🌟</span><span class="basket-counter-badge" id="basket-counter-badge">0 / ${neededTotal}</span>`;

            let indexedItems = (cfg.items || []).map((it, idx) => ({ ...it, origIdx: idx }));
            let displayItems = isSecretEditMode ? indexedItems : [...indexedItems].sort(() => Math.random() - 0.5);

            displayItems.forEach((item) => {
                let tokenBtn = document.createElement('button');
                tokenBtn.type = 'button'; tokenBtn.className = 'collectible-token';
                let isGoodItem = Boolean(item.good || item.isCorrect);
                tokenBtn.innerHTML = `<span class="token-emoji" data-edit-field="gift_emoji_${item.origIdx}">${item.emoji || '✨'}</span><span class="token-label" data-edit-field="gift_label_${item.origIdx}">${colorizeHarakaAndMadd(item.label || '')}</span>`;

                tokenBtn.onclick = () => {
                    if (isSecretEditMode || isCompleted || tokenBtn.classList.contains('collected') || tokenBtn.classList.contains('wrong-token')) return;
                    if (isGoodItem) {
                        tokenBtn.classList.add('collected'); collectedCount++; playCorrectChime();
                        document.getElementById('basket-counter-badge').innerText = `${collectedCount} / ${neededTotal}`;
                        if (collectedCount >= neededTotal) {
                            isCompleted = true;
                            document.getElementById('gift-box-icon').innerText = '💎';
                            lightUpGiftDiamond(); updateNavButtons(true);
                            setTimeout(() => showCenterAction(() => handleNextClick(), false, null), 500);
                        }
                    } else {
                        tokenBtn.classList.add('wrong-token'); tokenBtn.disabled = true; wrongClicks++; playWrongTone();
                        if (wrongClicks >= 2) { isCompleted = true; updateNavButtons(true); setTimeout(() => showCenterAction(() => handleNextClick(), false, null), 600); }
                    }
                };
                itemsZone.appendChild(tokenBtn);
            });

            card.appendChild(itemsZone); card.appendChild(basketZone); contentDiv.appendChild(card);
            speakText(cfg.prompt, () => updateNavButtons(true));
            if (isSecretEditMode) attachEditHooksToCurrentStation(defData);
        }

        function formatApplySteps(defData) {
            if (Array.isArray(defData?.apply?.steps)) {
                return defData.apply.steps.map(stepStr => colorizeHarakaAndMadd(String(stepStr)).replace(/\(([^\)]+)\)/g, '<span class="apply-hl-target">$1</span>'));
            }
            let rawText = defData?.apply?.text || "أُطَبِّقُ مَا تَعَلَّمْتُهُ اليَوْمَ (بِدِقَّةٍ وَإِتْقَانْ).";
            return rawText.split(/[،.؛]/).map(s => s.trim()).filter(Boolean).map(stepStr => colorizeHarakaAndMadd(stepStr).replace(/\(([^\)]+)\)/g, '<span class="apply-hl-target">$1</span>'));
        }

        function renderApplyStation(contentDiv, defData) {
            let card = document.createElement('div');
            card.className = 'fancy-card apply-structured-card';
            if (defData?.apply?.img) {
                let imgWrap = document.createElement('div');
                imgWrap.style.cssText = 'position:relative; display:flex; justify-content:center;';
                let imgEl = document.createElement('img');
                imgEl.className = 'apply-img-preview'; imgEl.src = defData.apply.img; imgEl.dataset.editAssetKey = 'apply_img';
                imgEl.onerror = function() { if (!this.dataset.extTried) this.style.display = 'none'; };
                imgWrap.appendChild(imgEl); card.appendChild(imgWrap);
            }
            let stepsArr = formatApplySteps(defData);
            let stepsContainer = document.createElement('div'); stepsContainer.className = 'apply-steps-list';
            stepsArr.forEach((stHtml, idx) => {
                let row = document.createElement('div'); row.className = 'apply-step-row';
                row.innerHTML = `<span class="apply-step-num">${idx + 1}</span><div class="apply-step-text" data-edit-field="apply_step_${idx}">${stHtml}</div>`;
                stepsContainer.appendChild(row);
            });
            card.appendChild(stepsContainer); contentDiv.appendChild(card);

            let rawSteps = Array.isArray(defData?.apply?.steps) ? defData.apply.steps.join(' ، ') : stepsArr.join(' ، ');
            speakText(rawSteps, () => {
                updateNavButtons(true);
                showCenterAction(() => completeLesson(activeViewSubj), true);
            });
            if (isSecretEditMode) attachEditHooksToCurrentStation(defData);
        }

        // ================= المحرك الرئيسي لعرض الأطوار الستة + الطبقات الثلاث الذكية في الطور 1 =================
        function getIntroBannerInfo(defData) {
            let letterChar = getAbjadChar(playWeek - 1);
            let cyc = getCycleFromGlobalWeek(playWeek);
            if (defData?.learn?.introTitle && defData?.learn?.introGoal) {
                return { cycleTag: `الدَّوْرَةُ ${ARABIC_CYCLE_NAMES[cyc]} • الوَحْدَةُ (${playWeek})`, title: defData.learn.introTitle, goal: defData.learn.introGoal };
            }
            return {
                cycleTag: `الدَّوْرَةُ ${ARABIC_CYCLE_NAMES[cyc]} • الوَحْدَةُ (${playWeek})`,
                title: `مَدَارُ حَرْفِ (${letterChar}) — ${SUBJ_TITLES[activeViewSubj]}`,
                goal: `لِنَبْنِيَ العَقْلَ وَنُتْقِنَ العَمَلَ وِفْقَ السُّنَنِ الدَّقِيقَةْ!`
            };
        }

        function renderCurrentStep() {
            let defData = getActiveCurriculumObj();
            if (globalStep !== 1) {
                window._activeSlideIdx = 0;
                window._lastSlideLessonKey = null;
                if (window.InteractiveLabEngine) window.InteractiveLabEngine.stopActiveTimers();
            }

            if (!isSecretEditMode) {
                if (globalStep === 1 && defData?.learn?.skipSom) { globalStep = 2; renderCurrentStep(); return; }
                if (globalStep === 4 && defData?.play?.skipGift) { globalStep = 5; renderCurrentStep(); return; }
            }

            updateNavButtons(false);
            let contentDiv = document.getElementById('main-content');
            contentDiv.innerHTML = '';

            const defaultImg = STAGE_PRIMARY_IMG[STAGE_GROUP] || STAGE_PRIMARY_IMG[2];
            const yFolder = `assets/y${RAW_YEAR}`;
            const cycLocalWeek = getCycleIndexFromGlobalWeek(playWeek) + 1;
            const activeDefaultImg = `${yFolder}/art/art${cycLocalWeek}.jpg`;

            // ---------------- 0. طور المحور والسديم الأول (التعريف بالدرس) ----------------
            if (globalStep === 0) {
                let bannerInfo = getIntroBannerInfo(defData);
                let card = document.createElement('div');
                card.className = 'fancy-card'; card.style.padding = '0';
                let slideImgSrc = defData.learn?.coverImg || activeDefaultImg;
                let percentRevealed = (activeViewSubj / 7) * 100;

                card.innerHTML = `
                <div class="intro-reveal-stage">
                    <div class="intro-Formatted-backdrop"></div>
                    <img src="${slideImgSrc}" class="intro-img-gray">
                    <img src="${slideImgSrc}" class="intro-img-color" data-edit-asset-key="cover_img" style="clip-path: inset(0 0 0 calc(100% - ${percentRevealed}%));">
                    <div class="intro-info-banner">
                        <span class="intro-cycle-tag">${bannerInfo.cycleTag}</span>
                        <h2 class="intro-info-title" data-edit-field="intro_title">${colorizeHarakaAndMadd(bannerInfo.title)}</h2>
                        <p class="intro-info-desc" data-edit-field="intro_goal">${colorizeHarakaAndMadd(bannerInfo.goal)}</p>
                    </div>
                </div>`;

                contentDiv.appendChild(card);
                speakText(`${bannerInfo.title} ، ${bannerInfo.goal}`, () => {
                    showCenterAction(() => handleNextClick(), false, SUBJ_SVG_ICONS[activeViewSubj]);
                    updateNavButtons(true);
                }, defData.learn?.audio);
                if (isSecretEditMode) attachEditHooksToCurrentStation(defData);
            }

            // ---------------- 1. طور التكثف النجمي (الطبقات الثلاث الذكية: 🎬 الفيديو | 📐 المختبر التفاعلي | 📖 الشرائح) ----------------
            else if (globalStep === 1) {
                const currentLessonSlideKey = `${playWeek}_${activeViewSubj}`;
                if (window._lastSlideLessonKey !== currentLessonSlideKey) {
                    window._activeSlideIdx = 0;
                    window._activeSomLayer = null;
                    window._lastSlideLessonKey = currentLessonSlideKey;
                }

                let slides = (defData.learn?.slides && defData.learn.slides.length > 0) ? defData.learn.slides : [
                    { img: defaultImg, text: `الوَحْدَةُ (${playWeek}) — حَرْفُ (${getAbjadChar(playWeek - 1)})` }
                ];

                const hasLabInLesson = slides.some(s => Boolean(s.labData)) || Boolean(defData.learn?.labData) || [4, 5, 6].includes(activeViewSubj);
                const hasCustomVideo = Boolean(defData.learn?.video && String(defData.learn.video).trim().length > 0);
                const hasSlidesInLesson = slides.length > 0;

                if (isSecretEditMode) {
                    let editControlsHTML = `
                        <div style="display:flex; gap:6px; flex-wrap:wrap;">
                            <button class="skip-gift-btn" style="border-color:#10b981;" onclick="window.addSomSlide()">➕ شريحة جديدة</button>
                            <button class="skip-gift-btn" style="border-color:#ef4444; color:#b91c1c;" onclick="window.removeSomSlide()">🗑️ حذف الشريحة</button>
                        </div>`;
                    createRoomHeader(contentDiv, 'إعداد طور العرض والطبقات الثلاث', editControlsHTML);
                }

                window.addSomSlide = () => {
                    if (!defData.learn) defData.learn = {};
                    if (!Array.isArray(defData.learn.slides)) defData.learn.slides = [];
                    window._touchedLessons[`${playWeek}_${activeViewSubj}`] = true;
                    defData.learn.slides.push({ img: defaultImg, text: 'نَصُّ الشَّرِيحَةِ الجَدِيدَةِ...' });
                    window._activeSlideIdx = defData.learn.slides.length - 1;
                    window._activeSomLayer = 'slides';
                    renderCurrentStep();
                };

                window.removeSomSlide = () => {
                    if (Array.isArray(defData.learn?.slides) && defData.learn.slides.length > 1) {
                        window._touchedLessons[`${playWeek}_${activeViewSubj}`] = true;
                        let sIdx = window._activeSlideIdx || 0;
                        defData.learn.slides.splice(sIdx, 1);
                        window._activeSlideIdx = Math.max(0, sIdx - 1);
                        renderCurrentStep();
                    }
                };

                let card = document.createElement('div');
                card.className = 'fancy-card';

                // شريط الأزرار العلوية الثلاثة التي تضيء وتنطفئ حسب المحتوى المتوفر
                const layersBar = document.createElement('div');
                layersBar.className = 'som-layers-switcher';

                const btnVideo = document.createElement('button');
                btnVideo.type = 'button';
                btnVideo.innerHTML = `<span class="layer-status-dot"></span><span>🎬 الفِيدْيُو</span>`;

                const btnLab = document.createElement('button');
                btnLab.type = 'button';
                btnLab.innerHTML = `<span class="layer-status-dot"></span><span>📐 المُخْتَبَرُ التَّفَاعُلِيّ</span>`;

                const btnSlides = document.createElement('button');
                btnSlides.type = 'button';
                btnSlides.innerHTML = `<span class="layer-status-dot"></span><span>📖 الشَّرَائِحُ وَالشَّرْح</span>`;

                layersBar.appendChild(btnVideo);
                layersBar.appendChild(btnLab);
                layersBar.appendChild(btnSlides);
                card.appendChild(layersBar);

                const bodyStageWrap = document.createElement('div');
                bodyStageWrap.style.cssText = 'width:100%; flex:1 1 auto; min-height:0; display:flex; flex-direction:column;';
                card.appendChild(bodyStageWrap);
                contentDiv.appendChild(card);

                let videoVerifiedAvailable = hasCustomVideo;

                // التبديل بين الطبقات الثلاث بتسلسل ذكي: (فيديو -> مختبر تفاعلي -> شرائح)
                function activateLayer(layerName) {
                    if (window.InteractiveLabEngine) window.InteractiveLabEngine.stopActiveTimers();
                    window._activeSomLayer = layerName;

                    btnVideo.className = 'layer-tab-btn ' + (videoVerifiedAvailable ? 'available' : 'unavailable') + (layerName === 'video' ? ' active-layer' : '');
                    btnLab.className = 'layer-tab-btn ' + (hasLabInLesson ? 'available' : 'unavailable') + (layerName === 'lab' ? ' active-layer' : '');
                    btnSlides.className = 'layer-tab-btn ' + (hasSlidesInLesson ? 'available' : 'unavailable') + (layerName === 'slides' ? ' active-layer' : '');

                    bodyStageWrap.innerHTML = '';

                    if (layerName === 'video') {
                        const vidBox = document.createElement('div');
                        vidBox.className = 'video-wrapper-box';
                        const vidEl = document.createElement('video');
                        vidEl.className = 'media-box-vid';
                        vidEl.controls = true; vidEl.playsInline = true;
                        vidEl.dataset.editAssetKey = 'lesson_video';
                        vidEl.src = defData.learn?.video || `${yFolder}/videos/v${playWeek}_s${activeViewSubj}.mp4`;
                        vidBox.appendChild(vidEl);
                        bodyStageWrap.appendChild(vidBox);

                        vidEl.onloadeddata = () => {
                            videoVerifiedAvailable = true;
                            btnVideo.classList.remove('unavailable'); btnVideo.classList.add('available', 'active-layer');
                            updateNavButtons(true);
                            if (!isSecretEditMode) vidEl.play().catch(() => {});
                        };
                        vidEl.onerror = () => {
                            // إن لم يوجد ملف الفيديو فعلياً ينطفئ زر الفيديو وينتقل فوراً للمختبر التفاعلي أو الشرائح!
                            videoVerifiedAvailable = false;
                            if (!isSecretEditMode) {
                                activateLayer(hasLabInLesson ? 'lab' : 'slides');
                            } else {
                                updateNavButtons(true);
                                attachEditHooksToCurrentStation(defData);
                            }
                        };
                        vidEl.onended = () => updateNavButtons(true);
                        if (isSecretEditMode) attachEditHooksToCurrentStation(defData);
                        return;
                    }

                    // بناء حاوية السلايدر المشتركة لطبقتي المختبر التفاعلي والشرائح
                    let currentSlide = Math.min(window._activeSlideIdx || 0, slides.length - 1);
                    let sliderContainer = document.createElement('div'); sliderContainer.className = 'slider-container';
                    let imgBox = document.createElement('div'); imgBox.className = 'slider-image-box';
                    let imgEl = document.createElement('img'); imgEl.className = 'pan-zoom-img'; imgEl.dataset.editAssetKey = 'slide_img';
                    let cardStageEl = document.createElement('div'); cardStageEl.className = 'auto-flashcard-stage'; cardStageEl.style.display = 'none';
                    let labStageEl = document.createElement('div'); labStageEl.className = 'interactive-lab-stage';

                    // طبقة النقر الصوتي تتوقف تماماً فوق المختبر التفاعلي حتى لا تعيق اللمس والسحب!
                    let clickOverlay = document.createElement('div');
                    clickOverlay.style.cssText = "position:absolute; inset:0; z-index:5; cursor:pointer;";

                    let nextBtn = document.createElement('button'); nextBtn.className = 'slider-nav-btn next'; nextBtn.innerHTML = '❮';
                    let prevBtn = document.createElement('button'); prevBtn.className = 'slider-nav-btn prev'; prevBtn.innerHTML = '❯';

                    let textBox = document.createElement('div'); textBox.className = 'slider-text-box';
                    let textContent = document.createElement('div'); textContent.className = 'slider-text-content'; textContent.dataset.editField = 'slide_text';
                    let soundIcon = document.createElement('div'); soundIcon.innerHTML = '🔊'; soundIcon.className = 'glass-audio-btn';
                    textBox.appendChild(textContent); textBox.appendChild(soundIcon);

                    const playCurrentSlideAudio = (onDone) => {
                        let s = slides[currentSlide];
                        if (activeViewSubj === 3 && s.cardData) playEarTone(s.cardData.feature || s.text);
                        speakText(s.tts || s.text, onDone);
                    };

                    const updateView = () => {
                        let s = slides[currentSlide];
                        window._activeSlideIdx = currentSlide;

                        if (layerName === 'lab') {
                            imgEl.style.display = 'none';
                            cardStageEl.style.display = 'none';
                            clickOverlay.style.display = 'none'; // حرية لمس وسحب كاملة!
                            labStageEl.style.display = 'flex';
                            const activeLabCfg = s.labData || defData.learn?.labData || {
                                type: activeViewSubj === 4 ? (RAW_YEAR >= 14 ? 'function_deriv' : 'pythagoras') : (activeViewSubj === 6 ? 'optics_lens' : 'avatar_trainer'),
                                seed: playWeek
                            };
                            window.InteractiveLabEngine.render(labStageEl, activeLabCfg, activeViewSubj);
                        } else {
                            labStageEl.style.display = 'none';
                            clickOverlay.style.display = isSecretEditMode ? 'none' : 'block';
                            if (s.cardData) {
                                imgEl.style.display = 'none';
                                cardStageEl.style.display = 'flex';
                                let letterChar = getAbjadChar(playWeek - 1);
                                let coloredWord = s.cardData.noHighlight ? colorizeHarakaAndMadd(s.cardData.word) : highlightTargetChar(s.cardData.word, letterChar);
                                let tokensHTML = s.cardData.visualTokens ? `<div class="fc-visual-tokens" data-edit-field="card_tokens">${s.cardData.visualTokens}</div>` : '';
                                cardStageEl.innerHTML = `
                                    <div class="auto-flashcard-box">
                                        <div class="fc-top-row">
                                            <span class="fc-tag">${s.cardData.tag || SUBJ_TITLES[activeViewSubj]} (${currentSlide + 1}/${slides.length})</span>
                                            <span class="fc-glyph" data-edit-field="card_glyph">${colorizeHarakaAndMadd(s.cardData.glyph || letterChar)}</span>
                                        </div>
                                        <h1 class="fc-word-main" data-edit-field="card_word">${coloredWord}</h1>
                                        ${tokensHTML}
                                        <div class="fc-bottom-pill" data-edit-field="card_feature">${colorizeHarakaAndMadd(s.cardData.feature || '')}</div>
                                    </div>`;
                            } else {
                                cardStageEl.style.display = 'none';
                                imgEl.style.display = 'block';
                                imgEl.src = s.img || defaultImg;
                            }
                        }

                        textContent.innerHTML = colorizeHarakaAndMadd(s.text || '');
                        prevBtn.style.display = currentSlide === 0 ? 'none' : 'flex';
                        nextBtn.style.display = currentSlide === slides.length - 1 ? 'none' : 'flex';
                        if (isSecretEditMode) attachEditHooksToCurrentStation(defData);
                    };

                    nextBtn.onclick = (e) => { e.stopPropagation(); if (currentSlide < slides.length - 1) { currentSlide++; updateView(); playCurrentSlideAudio(); } };
                    prevBtn.onclick = (e) => { e.stopPropagation(); if (currentSlide > 0) { currentSlide--; updateView(); playCurrentSlideAudio(); } };
                    clickOverlay.onclick = (e) => { e.stopPropagation(); playCurrentSlideAudio(); };
                    soundIcon.onclick = (e) => { e.stopPropagation(); playCurrentSlideAudio(); };

                    imgBox.appendChild(imgEl);
                    imgBox.appendChild(cardStageEl);
                    imgBox.appendChild(labStageEl);
                    imgBox.appendChild(clickOverlay);
                    if (slides.length > 1) { imgBox.appendChild(prevBtn); imgBox.appendChild(nextBtn); }
                    sliderContainer.appendChild(imgBox);
                    sliderContainer.appendChild(textBox);
                    bodyStageWrap.appendChild(sliderContainer);

                    updateView();
                    playCurrentSlideAudio(() => updateNavButtons(true));
                }

                btnVideo.onclick = () => { if (videoVerifiedAvailable || isSecretEditMode) activateLayer('video'); };
                btnLab.onclick = () => { if (hasLabInLesson) activateLayer('lab'); };
                btnSlides.onclick = () => { if (hasSlidesInLesson) activateLayer('slides'); };

                // الاختيار الذكي التلقائي للطبقة الأولى: فيديو (إن وجد) -> وإلا المختبر التفاعلي -> وإلا الشرائح
                const initialLayer = window._activeSomLayer || (hasCustomVideo ? 'video' : (hasLabInLesson ? 'lab' : 'slides'));
                activateLayer(initialLayer);
            }

            else if (globalStep === 2) {
                if (currentQuestionIdx === 0 && !isSecretEditMode) {
                    subjCoinsList = new Array(MAX_COINS_FOR_YEAR).fill('empty');
                    hajjErrorsCount = 0;
                    saveSubjCoins(playWeek, activeViewSubj, subjCoinsList);
                    updateHeaderScoreUI();
                }
                renderQuizStation(contentDiv, defData);
            }
            else if (globalStep === 3) {
                if (!isSadaqahRequired() && !isSecretEditMode) { handleNextClick(); return; }
                renderSadaqahMatchingStation(contentDiv, defData);
            }
            else if (globalStep === 4) {
                renderGiftBasketStation(contentDiv, defData);
            }
            else if (globalStep === 5) {
                renderApplyStation(contentDiv, defData);
            }
        }

        function completeLesson(subjId) {
            playCorrectChime();
            let contentDiv = document.getElementById('main-content');
            document.getElementById('next-btn').disabled = true;
            document.getElementById('prev-btn').disabled = true;

            if (isFreeExplore || isReviewMode || isSecretEditMode) {
                contentDiv.innerHTML = `<div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100%;"><div style="font-size:clamp(5rem,18vmin,9rem);">🔓</div><h1 style="color:#fef08a;">تَمَّ اسْتِكْشَافُ المَدَارْ</h1></div>`;
                setTimeout(() => { activeViewSubj = (subjId < 7) ? (subjId + 1) : 1; initApp(); }, 1000);
                return;
            }

            if (subjId < 7) {
                contentDiv.innerHTML = `<div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100%;"><div style="font-size:clamp(6rem,22vmin,11rem);">🌟</div><h1 style="color:#fef08a;">أَحْسَنْت! أَتْمَمْتَ هٰذَا الخَتْمَ الهَنْدَسِيّ</h1></div>`;
                speakText('أَحْسَنْت! أَتْمَمْتَ الدَّرْسْ', () => {
                    if (playWeek === actualWeek && subjId === actualSubj) {
                        actualSubj++;
                        localStorage.setItem(`student_subj_${SAVE_KEY}`, actualSubj);
                    }
                    if (subjId === playMaxSubj) playMaxSubj++;
                    activeViewSubj = subjId + 1;
                    initApp();
                });
            } else {
                const finishedCycle = (playWeek % WEEKS_PER_CYCLE === 0);
                const finishedCycleNum = getCycleFromGlobalWeek(playWeek);
                if (playWeek === actualWeek && subjId === actualSubj) {
                    actualSubj = 1;
                    if (actualWeek < TOTAL_WEEKS) actualWeek++;
                    localStorage.setItem(`student_week_${SAVE_KEY}`, actualWeek);
                    localStorage.setItem(`student_subj_${SAVE_KEY}`, actualSubj);
                }

                if (finishedCycle) {
                    contentDiv.innerHTML = `
                        <div class="fancy-card" style="justify-content:center; gap:14px;">
                            <div style="font-size:clamp(4.5rem,16vmin,8rem);">🏆🌌</div>
                            <h1 style="color:#065f46; font-size:clamp(1.5rem,4vmin,2.4rem);">مُبَارَكٌ! أَتْمَمْتَ جَمِيعَ مَدَارَاتِ الدَّوْرَةِ ${ARABIC_CYCLE_NAMES[finishedCycleNum]}!</h1>
                            <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
                                <button class="cycle-exam-banner-btn" style="max-width:320px;" onclick="selectedMapCycle=${finishedCycleNum}; openCycleComprehensiveExam();">🏆 خَوْضُ الاِمْتِحَانِ الشَّامِلِ لِلدَّوْرَةِ الآنَ</button>
                                <button class="skip-gift-btn" style="padding:8px 18px;" onclick="location.reload()">الاِنْتِقَالُ لِلدَّوْرَةِ التَّالِيَةِ ◄</button>
                            </div>
                        </div>`;

        (function enableSmartMultiExtensionImages() {
            const EXT_LIST = ['.jpg', '.png', '.webp', '.jpeg', '.gif'];
            const resolvedCache = {};
            window.addEventListener('error', function(e) {
                const el = e.target;
                if (!el || el.tagName !== 'IMG') return;
                const currentSrc = el.getAttribute('src') || '';
                if (currentSrc.startsWith('data:') || currentSrc.startsWith('blob:')) return;
                const baseMatch = currentSrc.match(/^(.*)\.(jpg|png|webp|jpeg|gif)$/i);
                if (!baseMatch) return;
                const basePath = baseMatch[1];
                if (resolvedCache[basePath] && resolvedCache[basePath] !== currentSrc) { el.src = resolvedCache[basePath]; return; }
                let tryIdx = parseInt(el.dataset.extTryIdx || '0', 10) + 1;
                if (tryIdx < EXT_LIST.length) {
                    el.dataset.extTryIdx = tryIdx; el.dataset.extTried = 'true';
                    const nextCandidate = basePath + EXT_LIST[tryIdx];
                    el.onload = function() { resolvedCache[basePath] = nextCandidate; };
                    el.src = nextCandidate;
                } else if (currentSrc.includes(`/y${RAW_YEAR}/`)) {
                    el.dataset.extTryIdx = '0';
                    el.src = basePath.replace(`/y${RAW_YEAR}/`, '/y7/') + '.jpg';
                } else {
                    el.src = STAGE_FALLBACK_IMG[STAGE_GROUP] || STAGE_FALLBACK_IMG[2];
                }
            }, true);
        })();

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                if (file && file.type?.startsWith('image/') && file.type !== 'image/gif' && file.type !== 'image/svg+xml') {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const MAX_DIM = 900;
                            let w = img.width, h = img.height;
                            if (w > MAX_DIM || h > MAX_DIM) {
                                if (w > h) { h = Math.round((h * MAX_DIM) / w); w = MAX_DIM; }
                                else { w = Math.round((w * MAX_DIM) / h); h = MAX_DIM; }
                            }
                            const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
                            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                            let out = canvas.toDataURL('image/webp', 0.78);
                            if (!out.startsWith('data:image/webp')) out = canvas.toDataURL('image/jpeg', 0.78);
                            resolve(out);
                        };
                        img.onerror = () => resolve(e.target.result);
                        img.src = e.target.result;
                    };
                    reader.onerror = reject; reader.readAsDataURL(file); return;
                }
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = reject; reader.readAsDataURL(file);
            });
        }

            const existingDelta = JSON.parse(localStorage.getItem(storageKey) || '{}');
            Object.keys(window._touchedLessons).forEach(k => {

                const blocked = JSON.parse(localStorage.getItem('blocked_schools_list') || '[]');

                if (branchSelect) {
                    const schools = JSON.parse(localStorage.getItem('private_schools_directory') || '[]')

                            const opt = document.createElement('option');
                            opt.value = sc.id; opt.innerText = `🌟 ${sc.name} (المعلم: ${sc.owner})`;

                    if (branchSelect.querySelector(`option[value="${ACTIVE_SCHOOL_BRANCH}"]`)) branchSelect.value = ACTIVE_SCHOOL_BRANCH;
                }

                if (ACTIVE_SCHOOL_BRANCH === 'main' || blocked.includes(ACTIVE_SCHOOL_BRANCH)) {
                    const mainSaved = localStorage.getItem(`custom_curriculum_edits_y${RAW_YEAR}`);
                    if (mainSaved) Object.assign(window.curriculumData[RAW_YEAR], JSON.parse(mainSaved));
                    return;
                }

                const privLocal = localStorage.getItem(`custom_curriculum_edits_${ACTIVE_SCHOOL_BRANCH}_y${RAW_YEAR}`);
                if (privLocal) {
                    const deltaObj = JSON.parse(privLocal);

                    });
                }
            } catch (e) {}
        }

                'btn-subj-5': { title: 'خُمَاسِيُّ الاتِّزَانِ الحَرَكِيّ (الرِّجْلَان)', desc: 'ضَبْطُ المَفَاصِلِ وَمَرْكَزِ الثِّقَلِ وَالتَّنَفُّسْ.' },
                'btn-subj-6': { title: 'بَذْرَةُ الحَيَاةِ وَالعُلُومْ (البَطْن)', desc: 'مُخْتَبَرُ الخَلِيَّةِ وَالأَرْضِ وَالفَلَكِ وَالكِيمْيَاءِ وَالفِيزْيَاءْ.' },
                'btn-subj-7': { title: 'مُثَمَّنُ الصَّفَاءِ وَالأَدَبْ (الحُقُوق)', desc: 'تَزْكِيَةُ النَّفْسِ وَحِفْظُ الحُقُوقِ وَالأَخْلَاقْ.' }
            };

            const tooltipEl = document.getElementById('smart-tooltip');
            const titleEl = document.getElementById('smart-tip-title');
            const descEl = document.getElementById('smart-tip-desc');

            function getTipInfo(target) {
                let el = target;
                while (el && el !== document.body) {
                    if (el.id && SHORT_TIPS[el.id]) return SHORT_TIPS[el.id];
                    el = el.parentElement;
                }
                return null;
            }

            function positionTooltip(clientX, clientY) {
                const pad = 10, rect = tooltipEl.getBoundingClientRect();
                let x = Math.max(pad, Math.min(window.innerWidth - rect.width - pad, clientX - rect.width / 2));
                let y = (clientY + 18 + rect.height > window.innerHeight - pad) ? (clientY - rect.height - 12) : (clientY + 18);
                tooltipEl.style.left = `${x}px`; tooltipEl.style.top = `${y}px`;
            }

            document.addEventListener('mouseover', (e) => {
                const info = getTipInfo(e.target);
                if (info) {
                    titleEl.innerText = info.title; descEl.innerText = info.desc;
                    tooltipEl.classList.add('visible'); positionTooltip(e.clientX, e.clientY);
                } else tooltipEl.classList.remove('visible');
            });
            document.addEventListener('mousemove', (e) => { if (tooltipEl.classList.contains('visible')) positionTooltip(e.clientX, e.clientY); });
            document.addEventListener('mousedown', () => tooltipEl.classList.remove('visible'));
        })();

        // حارس منع مقاطعة قراءة السؤال الأساسي بالماوس
        (function setupTTSQuestionFirstGuard() {
            if (!('speechSynthesis' in window)) return;
            let _inHoverDispatch = false, _inHoverTimer = false, _questionEndGraceTimer = null;
            const markHoverStart = () => { _inHoverDispatch = true; Promise.resolve().then(() => { _inHoverDispatch = false; }); };
            window.addEventListener('mouseover', markHoverStart, true);
            window.addEventListener('pointerover', markHoverStart, true);
            window.addEventListener('mousedown', () => { _inHoverDispatch = false; _inHoverTimer = false; }, true);

            const _nativeSetTimeout = window.setTimeout;
            window.setTimeout = function(fn, delay, ...args) {
                if (_inHoverDispatch && typeof fn === 'function') {
                    return _nativeSetTimeout.call(window, function(...fArgs) {
                        _inHoverTimer = true;
                        try { return fn.apply(this, fArgs); } finally { _inHoverTimer = false; }
                    }, delay, ...args);
                }
                return _nativeSetTimeout.call(window, fn, delay, ...args);
            };

            const _nativeSpeak = window.speechSynthesis.speak.bind(window.speechSynthesis);
            const _nativeCancel = window.speechSynthesis.cancel.bind(window.speechSynthesis);

            window.speechSynthesis.cancel = function() {
                if ((_inHoverDispatch || _inHoverTimer) && (!window._questionReadCompleted || window._isSpeakingMainQuestion)) return;
                return _nativeCancel();
            };

            window.speechSynthesis.speak = function(utterance) {
                if (!utterance) return;
                if (_inHoverDispatch || _inHoverTimer) {
                    if (!window._questionReadCompleted || window._isSpeakingMainQuestion || window.speechSynthesis.speaking) return;
                    return _nativeSpeak(utterance);
                }
                clearTimeout(_questionEndGraceTimer);
                window._questionReadCompleted = false;
                window._isSpeakingMainQuestion = true;
                const onDone = () => {
                    clearTimeout(_questionEndGraceTimer);
                    _questionEndGraceTimer = _nativeSetTimeout.call(window, () => {
                        if (!window.speechSynthesis.speaking && !window.speechSynthesis.pending) {
                            window._isSpeakingMainQuestion = false;
                            window._questionReadCompleted = true;
                        }
                    }, 220);
                };
                utterance.addEventListener('end', onDone);
                utterance.addEventListener('error', onDone);
                return _nativeSpeak(utterance);
            };
        })();

        loadCustomCurriculumEdits();
        subjCoinsList = loadSubjCoins(playWeek, activeViewSubj);
        updateTTSButtonUI();
        updateHeaderScoreUI();
        updateGiftDiamondUI();
        updateNavButtons(false);
    </script>
