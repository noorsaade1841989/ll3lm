<!-- ==================== [ بداية القسم 1 من 6 : الرأس والتصميم الزمردي الذهبي الأصلي لمرحلة عبد stage2.html ] ==================== -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>العلم | مرحلة عبد — الهندسة والمدارات التفاعلية</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="cc.ico" type="image/x-icon">
    <meta name="theme-color" content="#064e3b">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@600;700&family=Tajawal:wght@500;700;800&family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --stage-bg-image: url('assets/stage2-bg.jpg'), url('assets/34275.jpg'), url('stage2-bg.jpg'), url('34275.jpg');
            --tree-focus-y: 50%;
            --theme-primary: #10b981;
            --theme-secondary: #eab308;
            --theme-dark: #06281e;
            --theme-glow: rgba(16, 185, 129, 0.45);
            --theme-gold-glow: rgba(250, 204, 21, 0.55);
            --theme-accent: #fef08a;
            --glass-shine: inset 0 2px 3px rgba(255, 255, 255, 0.55);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Noto Naskh Arabic', 'Tajawal', 'Cairo', 'Segoe UI', Tahoma, sans-serif;
            letter-spacing: 0;
            background-color: #06281e;
            background-image: linear-gradient(135deg, rgba(6, 40, 30, 0.84) 0%, rgba(15, 23, 42, 0.86) 100%), var(--stage-bg-image);
            background-size: cover;
            background-position: center var(--tree-focus-y);
            color: #0f172a;
            display: flex;
            flex-direction: column;
            transition: background-position 0.8s ease;
        }

        button, input, select, textarea {
            font-family: 'Noto Naskh Arabic', 'Tajawal', 'Cairo', 'Segoe UI', Tahoma, sans-serif;
            letter-spacing: 0;
        }

        .hl-char { color: #be123c; font-weight: 900; }
        .focus-green { color: #047857; font-weight: 900; }

        /* ================= شاشة الترحيب الأصلية لمرحلة عبد ================= */
        #welcome-screen {
            position: fixed;
            inset: 0;
            z-index: 8000;
            background-image: var(--stage-bg-image);
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.45s ease;
        }

        #welcome-screen::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(6, 40, 30, 0.62) 0%, rgba(9, 14, 24, 0.88) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .welcome-box {
            position: relative;
            z-index: 2;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.94) 0%, rgba(236, 253, 245, 0.90) 100%);
            border: 3.5px solid #eab308;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 28px rgba(234, 179, 8, 0.35), var(--glass-shine);
            border-radius: 34px;
            padding: clamp(22px, 4.5vmin, 38px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            max-width: 440px;
            width: 92%;
            text-align: center;
        }

        .welcome-stage-title {
            font-size: clamp(2.5rem, 8.2vmin, 3.9rem);
            font-weight: 800;
            line-height: 1.25;
        }

        .neon-silver-blue { color: #0284c7; text-shadow: 0 2px 12px rgba(56, 189, 248, 0.6); }
        .neon-gold-green { color: #065f46; text-shadow: 0 2px 14px rgba(234, 179, 8, 0.65); }
        .neon-bronze-red { color: #be123c; text-shadow: 0 2px 12px rgba(244, 63, 94, 0.6); }

        .welcome-year-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .welcome-year-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10b981, #047857);
            border: 3px solid #fde047;
            box-shadow: 0 6px 16px rgba(4, 120, 87, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            font-weight: 900;
            color: #ffffff;
        }

        .welcome-year-word {
            font-size: 1.45rem;
            font-weight: 900;
            color: #0f172a;
        }

        .welcome-cycles-Sub {
            font-size: 0.92rem;
            font-weight: 800;
            color: #065f46;
            background: rgba(254, 240, 138, 0.65);
            border: 1.5px solid #eab308;
            padding: 4px 14px;
            border-radius: 999px;
        }

        .start-btn {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            border: 3.5px solid #fde047;
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 28px rgba(5, 150, 105, 0.55);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: pulseStart 2.2s infinite;
        }

        .start-btn:hover { transform: scale(1.1); }
        .start-btn svg { width: 38px; height: 38px; fill: currentColor; margin-left: 4px; }
        @keyframes pulseStart {
            0%, 100% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.65); }
            50% { box-shadow: 0 0 0 18px rgba(234, 179, 8, 0); }
        }

        /* ================= الشريط العلوي الموحد بكبسولتين بالتصميم الزمردي الذهبي ================= */
        header {
            position: relative;
            z-index: 600;
            flex: 0 0 auto;
            height: clamp(50px, 7.6dvh, 62px);
            width: 100%;
            background: linear-gradient(135deg, rgba(6, 34, 26, 0.94) 0%, rgba(15, 23, 42, 0.90) 100%);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 2px solid rgba(250, 204, 21, 0.48);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 clamp(6px, 1.4vw, 16px);
            gap: 8px;
            overflow: hidden;
        }

        /* الكبسولة اليمنى: الهوية + المرحلة + العمر -> تنقل مباشرة إلى index.html */
        .unified-identity-capsule {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            height: clamp(36px, 5.6dvh, 44px);
            padding: 4px 12px;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(6, 78, 59, 0.55) 100%);
            border: 1.5px solid rgba(253, 224, 71, 0.72);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.32), var(--glass-shine);
            text-decoration: none;
            color: #ffffff;
            white-space: nowrap;
            max-width: 44%;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .unified-identity-capsule:hover { transform: translateY(-1px); border-color: #fde047; }

        .brand-logo-icon {
            width: clamp(22px, 3.2vmin, 28px);
            height: clamp(22px, 3.2vmin, 28px);
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #fde047;
            background: #06281e;
            flex-shrink: 0;
        }

        .id-school-part {
            font-size: clamp(0.74rem, 1.65vmin, 0.92rem);
            font-weight: 800;
            color: #fde047;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .id-divider {
            width: 1.5px;
            height: 16px;
            background: rgba(255, 255, 255, 0.32);
            flex-shrink: 0;
        }

        .id-stage-part {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 800;
            font-size: clamp(0.74rem, 1.65vmin, 0.9rem);
            color: #d1fae5;
            flex-shrink: 0;
        }

        .year-pill-circle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 22px;
            height: 22px;
            padding: 0 5px;
            border-radius: 999px;
            background: linear-gradient(135deg, #eab308, #ca8a04);
            border: 1.5px solid #ffffff;
            color: #0f172a;
            font-size: clamp(0.72rem, 1.5vmin, 0.86rem);
            font-weight: 900;
        }

        /* الكبسولة اليسرى الموحدة: حرف واسم الدرس + الخط الأفقي للنجمات المتصاعدة + رصيد النجوم */
        .unified-eval-capsule {
            display: inline-flex;
            align-items: center;
            gap: clamp(4px, 0.7vw, 8px);
            height: clamp(36px, 5.6dvh, 44px);
            padding: 3px 10px;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(6, 30, 23, 0.92) 0%, rgba(15, 23, 42, 0.88) 100%);
            border: 1.5px solid rgba(110, 231, 183, 0.55);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.38), var(--glass-shine);
            white-space: nowrap;
            max-width: 55%;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
        }
        .unified-eval-capsule::-webkit-scrollbar { display: none; }

        .week-map-trigger {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 9px;
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.25);
            border: 1px solid #6ee7b7;
            color: #ffffff;
            font-size: clamp(0.72rem, 1.6vmin, 0.88rem);
            font-weight: 800;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .week-map-trigger:hover { border-color: #fde047; background: rgba(16, 185, 129, 0.42); }

        .hdr-lesson-title-short {
            max-width: clamp(65px, 14vw, 165px);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #ecfdf5;
            font-weight: 800;
        }

        .nav-arrow-btn {
            width: clamp(22px, 3vmin, 28px);
            height: clamp(22px, 3vmin, 28px);
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .nav-arrow-btn:hover:not(:disabled) {
            background: #10b981;
            border-color: #fde047;
            transform: scale(1.08);
        }
        .nav-arrow-btn:disabled { opacity: 0.28; cursor: not-allowed; }
        .nav-arrow-btn svg { width: 14px; height: 14px; }

        /* الخط الأفقي لتصاعد النجمات عبر أطوار الدرس الأربعة */
        .progress-stations {
            display: inline-flex;
            align-items: center;
            gap: clamp(3px, 0.45vw, 5px);
            position: relative;
        }

        .station-icon {
            width: clamp(23px, 3.2vmin, 28px);
            height: clamp(23px, 3.2vmin, 28px);
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.72);
            border: 1.5px solid rgba(255, 255, 255, 0.24);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            padding: 3px;
            opacity: 0.45;
            transition: all 0.25s ease;
            flex-shrink: 0;
        }
        .station-icon svg { width: 100%; height: 100%; }
        .station-icon.hidden-station { display: none !important; }
        .station-icon.clickable { cursor: pointer; }

        .station-icon.active {
            opacity: 1;
            color: #fef08a;
            transform: scale(1.14);
            background: radial-gradient(circle, rgba(16, 185, 129, 0.58) 0%, rgba(6, 78, 59, 0.92) 100%);
            border-color: #fde047;
            box-shadow: 0 0 12px rgba(250, 204, 21, 0.85);
        }
        .station-icon.done {
            opacity: 0.95;
            color: #6ee7b7;
            background: rgba(16, 185, 129, 0.28);
            border-color: #34d399;
        }

        .lesson-stars-pill {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 2px 8px;
            border-radius: 999px;
            background: rgba(250, 204, 21, 0.16);
            border: 1px solid rgba(253, 224, 71, 0.55);
            color: #fef08a;
            font-size: clamp(0.7rem, 1.5vmin, 0.84rem);
            font-weight: 900;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* ================= الشريط الجانبي الرشيق للهواتف + البطارية الثلاثية والنجمة ================= */
        .layout-wrapper {
            flex: 1 1 0%;
            min-height: 0;
            display: flex;
            width: 100%;
            overflow: hidden;
        }

        .sidebar-nav {
            width: clamp(50px, 7vmin, 66px);
            flex: 0 0 auto;
            background: linear-gradient(180deg, rgba(6, 40, 30, 0.88) 0%, rgba(15, 23, 42, 0.92) 100%);
            backdrop-filter: blur(16px);
            border-left: 2px solid rgba(250, 204, 21, 0.38);
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            padding: 6px 3px;
            gap: 4px;
            z-index: 20;
        }

        .subject-btn {
            position: relative;
            width: clamp(40px, 5.6vmin, 52px);
            height: clamp(40px, 5.8vmin, 54px);
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.84);
            border: 1.8px solid rgba(110, 231, 183, 0.45);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            color: #a7f3d0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 4px 3px 3px 3px;
            cursor: pointer;
            transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .subject-btn .subj-svg-box {
            width: clamp(19px, 2.9vmin, 25px);
            height: clamp(19px, 2.9vmin, 25px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .subject-btn .subj-svg-box svg { width: 100%; height: 100%; transition: transform 0.3s ease; }
        .subject-btn:hover:not(.locked) .subj-svg-box svg { transform: rotate(12deg) scale(1.06); }

        /* البطارية الثلاثية الدقيقة أسفل كل ختم */
        .subj-battery {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 1.5px 4px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.16);
        }
        .subj-bat-dot {
            width: clamp(5px, 0.8vmin, 7px);
            height: 3.5px;
            border-radius: 2px;
            background: rgba(148, 163, 184, 0.45);
            transition: background 0.25s ease, transform 0.25s ease;
        }
        .subj-bat-dot.done { background: #34d399; }
        .subj-bat-dot.current { background: #fde047; transform: scaleY(1.3); }

        .subject-btn.locked { opacity: 0.28; filter: grayscale(100%); cursor: not-allowed; }
        .subject-btn.active {
            background: radial-gradient(circle at 30% 30%, #065f46 0%, #022c22 100%);
            border: 2px solid #fde047;
            color: #fef08a;
            box-shadow: 0 0 14px rgba(250, 204, 21, 0.5), inset 0 0 8px rgba(16, 185, 129, 0.38);
            transform: scale(1.06);
        }
        .subject-btn.completed {
            border-color: #34d399;
        }

        .subj-star {
            position: absolute;
            top: -5px;
            left: -4px;
            font-size: 0.68rem;
            display: none;
            filter: drop-shadow(0 0 4px #eab308);
            z-index: 3;
        }
        .subject-btn.completed .subj-star { display: block; }

        /* ================= مساحة العمل والبطاقة الزجاجية الأصلية ================= */
        .workspace {
            flex: 1 1 0%;
            min-width: 0;
            min-height: 0;
            padding: clamp(6px, 1.4vmin, 14px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .content-area {
            width: 100%;
            height: 100%;
            max-width: 1120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .room-header-box { display: none !important; }
        body.edit-mode-active .room-header-box.edit-only-bar {
            display: flex !important;
            width: 100%;
            max-width: 1020px;
            background: rgba(15, 23, 42, 0.92);
            color: #fde047;
            padding: 6px 16px;
            border-radius: 14px;
            border: 1px solid rgba(250, 204, 21, 0.4);
            margin-bottom: 6px;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 800;
            z-index: 30;
        }

        .fancy-card {
            width: 100%;
            height: 100%;
            min-height: 0;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.92) 0%, rgba(240, 253, 244, 0.88) 100%);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 2.5px solid rgba(250, 204, 21, 0.65);
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.32), var(--glass-shine);
            border-radius: 26px;
            padding: clamp(10px, 2vmin, 20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        /* ================= الطور 0 (المحور) والطور 1 (الشرائح والمختبر والفيديو) ================= */
        .intro-reveal-stage {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            overflow: hidden;
            background: #06281e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: clamp(14px, 3vh, 28px);
        }
        .intro-Formatted-backdrop {
            position: absolute;
            inset: -20px;
            background-image: var(--stage-bg-image);
            background-size: cover;
            filter: blur(16px) brightness(0.5);
            z-index: 1;
        }
        .intro-img-gray {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0.25;
            filter: grayscale(100%);
            z-index: 2;
        }
        .intro-img-color {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 3;
            transition: clip-path 1s ease;
        }
        .intro-info-banner {
            position: relative;
            z-index: 10;
            background: linear-gradient(135deg, rgba(6, 40, 30, 0.92), rgba(15, 23, 42, 0.90));
            backdrop-filter: blur(14px);
            border: 2.5px solid #eab308;
            border-radius: 22px;
            padding: clamp(10px, 2vh, 18px) clamp(18px, 3.5vw, 32px);
            max-width: 92%;
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.55);
        }
        .intro-cycle-tag {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 800;
            color: #064e3b;
            background: #fde047;
            padding: 2px 12px;
            border-radius: 999px;
            margin-bottom: 4px;
        }
        .intro-info-title {
            font-size: clamp(1.25rem, 3.2vmin, 2rem);
            font-weight: 800;
            color: #fef08a;
            margin-bottom: 4px;
            line-height: 1.5;
        }
        .intro-info-desc {
            font-size: clamp(0.95rem, 2.1vmin, 1.28rem);
            color: #ecfdf5;
            font-weight: 700;
            line-height: 1.65;
        }

        .som-layers-switcher {
            width: 100%;
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap;
            z-index: 30;
        }
        .layer-tab-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 13px;
            border-radius: 999px;
            font-size: clamp(0.74rem, 1.65vmin, 0.9rem);
            font-weight: 800;
            border: 2px solid #cbd5e1;
            background: rgba(241, 245, 249, 0.85);
            color: #64748b;
            cursor: pointer;
            transition: all 0.22s ease;
        }
        .layer-tab-btn.available {
            border-color: #10b981;
            background: #ecfdf5;
            color: #065f46;
            box-shadow: 0 3px 10px rgba(16, 185, 129, 0.18);
        }
        .layer-tab-btn.active-layer {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            border-color: #fde047;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.45);
        }
        .layer-tab-btn.unavailable {
            opacity: 0.35;
            filter: grayscale(100%);
            cursor: not-allowed;
        }
        .layer-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #94a3b8;
        }
        .layer-tab-btn.available .layer-status-dot { background: #10b981; box-shadow: 0 0 6px #10b981; }
        .layer-tab-btn.active-layer .layer-status-dot { background: #fde047; box-shadow: 0 0 8px #fde047; }

        .slide-counter-chip {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 999px;

<!-- ==================== [ بداية القسم 3 من 6 : إعدادات الدورات والصوت والقارئ الآلي السليم بلا حذف حركات ] ==================== -->
    <script>
        const toArDigits = (s) => String(s).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
        const urlParams = new URLSearchParams(window.location.search);
        const paramYear = parseInt(urlParams.get('year'), 10);
        const savedYear = parseInt(localStorage.getItem('selected_school_year'), 10);
        const RAW_YEAR = (!isNaN(paramYear) && paramYear >= 8 && paramYear <= 14)
            ? paramYear
            : ((!isNaN(savedYear) && savedYear >= 8 && savedYear <= 14) ? savedYear : 8);
        localStorage.setItem('selected_school_year', RAW_YEAR);

        const STAGE_GROUP = Math.ceil(RAW_YEAR / 7);
        const YEAR_CYCLES_MAP = { 8: 1, 9: 1, 10: 1, 11: 1, 12: 2, 13: 2, 14: 2 };
        const TOTAL_CYCLES_FOR_YEAR = YEAR_CYCLES_MAP[RAW_YEAR] || 1;
        const WEEKS_PER_CYCLE = 28;
        const TOTAL_WEEKS = TOTAL_CYCLES_FOR_YEAR * WEEKS_PER_CYCLE;

        const STAGE_SHORT = { 1: 'سيد', 2: 'عبد', 3: 'صاحب' };
        const STAGE_NEON_CLASS = { 1: 'neon-silver-blue', 2: 'neon-gold-green', 3: 'neon-bronze-red' };
        const STAGE_BG_CSS = {
            1: "url('assets/stage1-bg.jpg'), url('assets/34273.jpg')",
            2: "url('assets/stage2-bg.jpg'), url('assets/34275.jpg'), url('stage2-bg.jpg'), url('34275.jpg')",
            3: "url('assets/stage3-bg.jpg'), url('assets/34276.jpg'), url('stage3-bg.jpg'), url('34276.jpg')"
        };
        const STAGE_PRIMARY_IMG = { 1: 'assets/stage1-bg.jpg', 2: 'assets/stage2-bg.jpg', 3: 'assets/stage3-bg.jpg' };
        const STAGE_FALLBACK_IMG = { 1: 'assets/34273.jpg', 2: 'assets/34275.jpg', 3: 'assets/34276.jpg' };

        document.documentElement.style.setProperty('--stage-bg-image', STAGE_BG_CSS[STAGE_GROUP] || STAGE_BG_CSS[2]);

        const welcomeTitleEl = document.getElementById('welcome-stage-title');
        if (welcomeTitleEl) {
            welcomeTitleEl.innerText = STAGE_SHORT[STAGE_GROUP] || 'عبد';
            welcomeTitleEl.className = `welcome-stage-title ${STAGE_NEON_CLASS[STAGE_GROUP] || 'neon-gold-green'}`;
        }
        document.getElementById('welcome-year-num').innerText = toArDigits(RAW_YEAR);
        document.getElementById('welcome-year-word').innerText = (RAW_YEAR >= 3 && RAW_YEAR <= 10) ? 'سنوات' : 'سنة';
        document.getElementById('welcome-cycles-info').innerText =
            (TOTAL_CYCLES_FOR_YEAR === 1)
                ? `دورة تأسيسية واحدة — إجمالي الوحدات: (${toArDigits(TOTAL_WEEKS)})`
                : `دورتان تأسيسيتان (٢) — إجمالي الوحدات: (${toArDigits(TOTAL_WEEKS)})`;

        document.getElementById('hdr-stage-txt').innerText = STAGE_SHORT[STAGE_GROUP] || 'عبد';
        document.getElementById('hdr-year-num').innerText = toArDigits(RAW_YEAR);
        document.getElementById('hdr-year-word').innerText = (RAW_YEAR >= 3 && RAW_YEAR <= 10) ? 'سنوات' : 'سنة';
    </script>
<script>
        window.curriculumData = window.curriculumData || {};
        window.STAGE2_CURRICULA = window.STAGE2_CURRICULA || {};
        window._loadedStage2Cycles = window._loadedStage2Cycles || {};

        // محول ذكي يقرأ ملفات window.STAGE2_CURRICULA['Y8_C1'] و ['Y12_C2'] ويحولها فوراً لبنية العرض التفاعلية
        function syncStage2CurriculaIntoApp(year, cycleNum) {
            window.curriculumData[year] = window.curriculumData[year] || {};
            const stageKey = `Y${year}_C${cycleNum}`;
            const rawPack = window.STAGE2_CURRICULA && window.STAGE2_CURRICULA[stageKey];
            if (!rawPack || !Array.isArray(rawPack.units)) return;

            const cycleOffset = (Math.max(1, cycleNum) - 1) * WEEKS_PER_CYCLE;
            const yFolder = `assets/y${year}`;

            // جمع إجابات كل ختم في هذه الدورة لاستخدامها كمشتتات ذكية واقعية في الأسئلة الاختيارية
            const answersPoolBySubj = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 7: [] };
            rawPack.units.forEach(u => {
                if (!u || !u.seals) return;
                for (let s = 1; s <= 7; s++) {
                    const seal = u.seals[s] || u.seals[String(s)];
                    if (seal && Array.isArray(seal.questions)) {
                        seal.questions.forEach(qItem => {
                            const ans = String(qItem.answer || '').trim();
                            if (ans && !answersPoolBySubj[s].includes(ans)) {
                                answersPoolBySubj[s].push(ans);
                            }
                        });
                    }
                }
            });

            const GENERIC_DISTRACTORS = [
                'التَّسَرُّعُ بِلَا تَثَبُّتٍ وَلَا مِيزَانٍ عِلْمِيٍّ.',
                'إِهْمَالُ القَاعِدَةِ وَتَرْكُ التَّطْبِيقِ المُتَّزِنِ.',
                'الِاعْتِمَادُ عَلَى الظَّنِّ دُونَ فَحْصٍ أَوْ دَلِيلٍ.'
            ];

            rawPack.units.forEach((u, idx) => {
                const localUnit = parseInt(u.unit, 10) || (idx + 1);
                const globalWeek = cycleOffset + localUnit; // 1..28 للدورة الأولى، و 29..56 للدورة الثانية
                window.curriculumData[year][globalWeek] = window.curriculumData[year][globalWeek] || {};

                const unitArtImg = `${yFolder}/art/art${localUnit}.jpg`;
                if (!u.seals) return;

                for (let s = 1; s <= 7; s++) {
                    // عدم الكتابة فوق الدرس إن كان محولاً مسبقاً أو معدلاً
                    if (window.curriculumData[year][globalWeek][s]?.learn?._fromStage2Pack) continue;

                    const seal = u.seals[s] || u.seals[String(s)];
                    if (!seal) continue;

                    const title = String(seal.title || '').trim();
                    const rawContent = String(seal.content || '').trim();
                    const paragraphs = rawContent.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);

                    const slides = [];
                    const applySteps = [];

                    // ١. إذا كان الختم قرآنياً (يحتوي بسملة أو آيات) نضع شريحة التلاوة أولاً
                    if (seal.verses) {
                        const fullQuranSlide = seal.basmala
                            ? `${seal.basmala}\n${seal.verses}`
                            : String(seal.verses);
                        slides.push({ img: unitArtImg, text: fullQuranSlide });
                    }

                    // ٢. توزيع الفقرات بين شرائح الشرح وخطوات التطبيق العملي
                    paragraphs.forEach(p => {
                        const isApplyParagraph = /^▪\s*(التَّطْبِيقُ|التَّدْرِيبُ|اكْتُبْ|مُخْتَبَرُ)/.test(p);
                        if (isApplyParagraph) {
                            applySteps.push(p.replace(/^▪\s*/, '').trim());
                        } else {
                            slides.push({ img: unitArtImg, text: p.replace(/^▪\s*/, '').trim() });
                        }
                    });

                    if (slides.length === 0 && rawContent) {
                        slides.push({ img: unitArtImg, text: rawContent });
                    }
                    if (applySteps.length === 0) {
                        if (seal.verses) {
                            applySteps.push(`اتْلُ ${title} تِلَاوَةً خَاشِعَةً مُتَقَنَةً مَعَ تَدَبُّرِ مَعَانِيهَا.`);
                        } else if (paragraphs.length > 0) {
                            applySteps.push(paragraphs[paragraphs.length - 1].replace(/^▪\s*/, '').trim());
                        }
                    }

                    // ٣. بناء هدف تمهيدي مكثف للافتة الطور 0
                    let introGoal = '';
                    if (seal.verses && rawContent) {
                        introGoal = rawContent;
                    } else if (paragraphs.length > 0) {
                        const firstClean = paragraphs[0].replace(/^▪\s*/, '').trim();
                        introGoal = firstClean.length > 185 ? (firstClean.slice(0, 182) + '...') : firstClean;
                    }

                    // ٤. بناء الأسئلة التفاعلية لهذا الختم
                    const playQuestions = [];
                    if (Array.isArray(seal.questions)) {
                        seal.questions.forEach(qItem => {
                            const qStem = String(qItem.question || '').trim();
                            if (!qStem) return;
                            const ans = String(qItem.answer || '').trim();

                            if (ans) {
                                // سؤال له إجابة محددة: نضع الإجابة الصحيحة + ٣ خيارات مشتتة من نفس المادة
                                const pool = answersPoolBySubj[s].filter(a => a !== ans);
                                const shuffledPool = [...pool].sort(() => Math.random() - 0.5);
                                const distractors = shuffledPool.slice(0, 3);
                                let gIdx = 0;
                                while (distractors.length < 3) {
                                    const cand = GENERIC_DISTRACTORS[gIdx++ % GENERIC_DISTRACTORS.length];
                                    if (cand !== ans && !distractors.includes(cand)) distractors.push(cand);
                                }
                                playQuestions.push({
                                    q: qStem,
                                    focusWord: '',
                                    options: [
                                        { text: ans, correct: true },
                                        ...distractors.slice(0, 3).map(d => ({ text: d, correct: false }))
                                    ]
                                });
                            } else {
                                // سؤال تأملي مفتوح (answer: ""): نحوله لسؤال تفكير قيمي هادف
                                playQuestions.push({
                                    q: qStem,
                                    focusWord: '',
                                    options: [
                                        { text: `أُعْمِلُ عَقْلِي وَأَخْتَارُ مَا يُوَافِقُ الحَقَّ وَالحِكْمَةَ فِي «${title}».`, correct: true },
                                        { text: 'أَتَسَرَّعُ بِلَا تَفْكِيرٍ وَلَا أَنْظُرُ فِي عَاقِبَةِ الفِعْلِ.', correct: false },
                                        { text: 'أُقَلِّدُ الخَطَأَ وَلَا أَسْتَعْمِلُ مِيزَانَ العَقْلِ.', correct: false },
                                        { text: 'أَتْرُكُ السُّؤَالَ وَأُهْمِلُ العَمَلَ بِمَا تَعَلَّمْتُهُ.', correct: false }
                                    ]
                                });
                            }
                        });
                    }

                    // إذا كانت مصفوفة الأسئلة فارغة (مثل السور والقصص)، نولد سؤال فهم مباشر من الدرس
                    if (playQuestions.length === 0) {
                        if (seal.verses && rawContent) {
                            const otherSuraGoals = rawPack.units
                                .map(un => un?.seals?.[1]?.content || un?.seals?.['1']?.content)
                                .filter(c => c && c !== rawContent);
                            const dists = [...otherSuraGoals].sort(() => Math.random() - 0.5).slice(0, 3);
                            while (dists.length < 3) dists.push(GENERIC_DISTRACTORS[dists.length]);
                            playQuestions.push({
                                q: `مَا الهَدْيُ العَمَلِيُّ الَّذِي تُرَسِّخُهُ «${title}»؟`,
                                focusWord: '',
                                options: [
                                    { text: rawContent, correct: true },
                                    ...dists.slice(0, 3).map(d => ({ text: d, correct: false }))
                                ]
                            });
                        } else if (paragraphs[0] && paragraphs[0].includes('خُلَاصَةُ الحِكْمَةِ:')) {
                            const wisdom = paragraphs[0].replace(/^▪\s*خُلَاصَةُ الحِكْمَةِ:\s*/, '').trim();
                            const otherWisdoms = rawPack.units
                                .map(un => (un?.seals?.[7]?.content || un?.seals?.['7']?.content || '').split(/\n\s*\n/)[0])
                                .filter(w => w.includes('خُلَاصَةُ الحِكْمَةِ:'))
                                .map(w => w.replace(/^▪\s*خُلَاصَةُ الحِكْمَةِ:\s*/, '').trim())
                                .filter(w => w && w !== wisdom);
                            const dists = [...otherWisdoms].sort(() => Math.random() - 0.5).slice(0, 3);
                            while (dists.length < 3) dists.push(GENERIC_DISTRACTORS[dists.length]);
                            playQuestions.push({
                                q: `مَا خُلَاصَةُ الحِكْمَةِ فِي قِصَّةِ «${title}»؟`,
                                focusWord: '',
                                options: [
                                    { text: wisdom, correct: true },
                                    ...dists.slice(0, 3).map(d => ({ text: d, correct: false }))
                                ]
                            });
                        }
                    }

                    window.curriculumData[year][globalWeek][s] = {
                        learn: {
                            _fromStage2Pack: true,
                            introTitle: title,
                            introGoal: introGoal,
                            coverImg: unitArtImg,
                            slides: slides
                        },
                        play: {
                            questions: playQuestions
                        },
                        apply: {
                            steps: applySteps
                        }
                    };
                }
            });
        }

        function loadCycleScriptIfNeeded(year, cycleNum, onComplete) {
            window.curriculumData[year] = window.curriculumData[year] || {};
            const safeCycle = Math.max(1, parseInt(cycleNum, 10) || 1);
            const cacheKey = `${year}_c${safeCycle}`;

            syncStage2CurriculaIntoApp(year, safeCycle);

            const hasCycleLoaded = () => {
                const startW = (safeCycle - 1) * WEEKS_PER_CYCLE + 1;
                return Boolean(window.curriculumData?.[year]?.[startW] && Object.keys(window.curriculumData[year][startW]).length > 0);
            };

            if (window._loadedStage2Cycles[cacheKey] && hasCycleLoaded()) {
                if (typeof onComplete === 'function') onComplete();
                return;
            }

            const candidates = [
                `curriculums/curriculum-y${year}-c${safeCycle}.js`,
                `curriculums/curriculum_y${year}_c${safeCycle}.js`,
                `curriculum-y${year}-c${safeCycle}.js`,
                `curriculums/curriculum-y${year}.js`,
                `curriculum-y${year}.js`
            ];
            const jsonCandidates = [
                `curriculums/curriculum-y${year}-c${safeCycle}.json`,
                `curriculums/curriculum-y${year}.json`
            ];

            async function tryFetchStage2Fallback(list, idx) {
                if (idx >= list.length) {
                    window._loadedStage2Cycles[cacheKey] = true;
                    if (typeof onComplete === 'function') onComplete();
                    return;
                }
                try {
                    const r = await fetch(list[idx], { cache: 'no-cache' });
                    if (!r.ok) throw new Error('HTTP');
                    const txt = (await r.text()).trim();
                    if (!txt || txt.startsWith('<!DOCTYPE') || txt.startsWith('<html')) throw new Error('HTML');
                    if (txt.startsWith('{')) {
                        const j = JSON.parse(txt);
                        window.STAGE2_CURRICULA = window.STAGE2_CURRICULA || {};
                        if (Array.isArray(j.units)) {
                            window.STAGE2_CURRICULA[`Y${year}_C${safeCycle}`] = j;
                        } else if (j[`Y${year}_C${safeCycle}`]) {
                            Object.assign(window.STAGE2_CURRICULA, j);
                        } else {
                            window.curriculumData[year] = Object.assign(window.curriculumData[year] || {}, j[year] || j);
                        }
                    } else {
                        const fn = new Function(
                            txt +
                            '\n;if(typeof STAGE2_CURRICULA!=="undefined"){window.STAGE2_CURRICULA=Object.assign(window.STAGE2_CURRICULA||{},STAGE2_CURRICULA);}' +
                            '\n;if(typeof curriculumData!=="undefined"){window.curriculumData=Object.assign(window.curriculumData||{},curriculumData);}'
                        );
                        fn();
                    }
                    syncStage2CurriculaIntoApp(year, safeCycle);
                    if (hasCycleLoaded()) {
                        window._loadedStage2Cycles[cacheKey] = true;
                        if (typeof onComplete === 'function') onComplete();
                        return;
                    }
                } catch (_) {}
                tryFetchStage2Fallback(list, idx + 1);
            }

            function tryLoadCandidate(idx) {
                if (hasCycleLoaded()) {
                    window._loadedStage2Cycles[cacheKey] = true;
                    if (typeof onComplete === 'function') onComplete();
                    return;
                }
                if (idx >= candidates.length) {
                    tryFetchStage2Fallback([...candidates, ...jsonCandidates], 0);
                    return;
                }
                const s = document.createElement('script');
                s.src = candidates[idx];
                s.async = false;
                s.dataset.cycleKey = cacheKey;
                s.onload = () => {
                    try {
                        if (typeof STAGE2_CURRICULA !== 'undefined') Object.assign(window.STAGE2_CURRICULA, STAGE2_CURRICULA);
                        if (typeof curriculumData !== 'undefined') Object.assign(window.curriculumData, curriculumData);
                    } catch (_) {}
                    syncStage2CurriculaIntoApp(year, safeCycle);
                    if (hasCycleLoaded()) {
                        window._loadedStage2Cycles[cacheKey] = true;
                        if (typeof onComplete === 'function') onComplete();
                    } else {
                        tryLoadCandidate(idx + 1);
                    }
                };
                s.onerror = () => {
                    tryLoadCandidate(idx + 1);
                };
                document.head.appendChild(s);
            }

            tryLoadCandidate(0);
        }

        (function initStage2InitialCurriculumLoader() {
            let blocked = [];
            try { blocked = JSON.parse(localStorage.getItem('blocked_schools_list') || '[]'); } catch (e) {}
            const rawBranch = urlParams.get('school') || localStorage.getItem('selected_school_branch') || 'main';
            const activeBranch = blocked.includes(rawBranch) ? 'main' : rawBranch;

            loadCycleScriptIfNeeded(RAW_YEAR, 1, function() {

                if (document.getElementById('welcome-screen') && document.getElementById('welcome-screen').style.display === 'none') {
                    if (typeof initApp === 'function') initApp();
                }
            });
        })();

        function getSharedAudioCtx() {
            if (!window._sharedAudioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) window._sharedAudioCtx = new AudioContextClass();
            }
            if (window._sharedAudioCtx && window._sharedAudioCtx.state === 'suspended') {
                window._sharedAudioCtx.resume().catch(() => {});
            }
            return window._sharedAudioCtx;
        }

        function playCorrectChime() {
            try {
                const ctx = getSharedAudioCtx();
                if (!ctx) return;
                const now = ctx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.065);
                    gain.gain.setValueAtTime(0.001, now + idx * 0.065);
                    gain.gain.exponentialRampToValueAtTime(0.22, now + idx * 0.065 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.065 + 0.48);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + idx * 0.065);
                    osc.stop(now + idx * 0.065 + 0.5);
                });
            } catch (e) {}
        }

        function playWrongTone() {
            try {
                const ctx = getSharedAudioCtx();
                if (!ctx) return;
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.linearRampToValueAtTime(175, now + 0.26);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.32);
            } catch (e) {}
        }

        function playNextChime() {
            try {
                const ctx = getSharedAudioCtx();
                if (!ctx) return;
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(659.25, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            } catch (e) {}
        }

        function playEarTone(soundDesc) {
            if (!soundDesc) return;
            try {
                const ctx = getSharedAudioCtx();
                if (!ctx) return;
                let freq = 293.66, dur = 0.35;
                if (soundDesc.includes('قرار') || soundDesc.includes('ساكن')) { freq = 220.00; dur = 0.3; }
                else if (soundDesc.includes('جواب') || soundDesc.includes('ممدود')) { freq = 440.00; dur = 0.65; }
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                g.gain.setValueAtTime(0.06, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
                osc.connect(g);
                g.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + dur);
            } catch (e) {}
        }

        // معالجة نظيفة تحافظ على التشكيل الأصلي وتضيف وقفات تنفس طبيعية تمنع حدة النطق
        function preprocessTTS(text) {
            if (!text) return '';
            let clean = String(text).replace(/<[^>]*>/g, ' ');
            clean = clean.replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu, ' ');
            clean = clean.replace(/([\u064B-\u0650])\u0651/g, '\u0651$1');
            clean = clean.replace(/۝[٠-٩\d]+/g, ' ، ');
            clean = clean.replace(/[—–•|]+/g, ' ، ');
            clean = clean.replace(/[﴿﴾«»"']/g, ' ');
            clean = clean.replace(/\(\s*ع[\u064B-\u0652]*\s*\)/g, ' عَلَيْهِ السَّلَامُ ');
            clean = clean.replace(/\+/g, ' زَائِد ').replace(/×/g, ' ضَرْب ').replace(/÷/g, ' قِسْمَة ').replace(/=/g, ' يُسَاوِي ').replace(/←|⟵/g, ' يُعْطِي ');

                            q: prepTitle,
                            focusWord: '',
                            options: [
                                { text: prepTitle, correct: true },
                                { text: 'بِانْتِظَارِ التَّحْضِيرِ', correct: false }
                            ]
                        }
                    ]
                },
                apply: {
                    steps: [prepTitle]
                }
            };

        function jumpToStep(targetStep) {
            let defData = getActiveCurriculumObj();
            let stepExists = true;
            if (targetStep === 1 && defData?.learn?.skipSom) stepExists = false;

            if (!stepExists && !isFreeExplore && !isSecretEditMode) return;
            if (!isFreeExplore && !isSecretEditMode && targetStep > globalStep) return;

            stopAllSpeech();
            if (window.InteractiveLabEngine) window.InteractiveLabEngine.stopActiveTimers();
            if (targetStep === 2) currentRandomQuestion = null; // سحب سؤال عشوائي متجدد عند فتح محطة السؤال
            globalStep = targetStep;
            renderCurrentStep();
        }

        function updateNavButtons(enableNext = false) {
            let prevBtn = document.getElementById('prev-btn');
            let nextBtn = document.getElementById('next-btn');
            if (prevBtn) prevBtn.disabled = (globalStep === 0);
            if (nextBtn) {
                nextBtn.style.display = 'inline-flex';
                nextBtn.disabled = false;
            }

            let defData = getActiveCurriculumObj();
            for (let i = 0; i < 4; i++) {
                let dot = document.getElementById('dot-' + i);
                if (!dot) continue;
                dot.className = 'station-icon';

                if (i === 1 && defData?.learn?.skipSom && !isSecretEditMode) {
                    dot.classList.add('hidden-station');
                    continue;
                }
                if (isFreeExplore || isSecretEditMode || i <= globalStep) dot.classList.add('clickable');
                if (i < globalStep) dot.classList.add('done');
                else if (i === globalStep) dot.classList.add('active');

            updateButtonsUI();

        function handleNextClick() {
            playNextChime();
            stopAllSpeech();
            if (window.InteractiveLabEngine) window.InteractiveLabEngine.stopActiveTimers();

            if (isCycleExamActive) {
                isCycleExamActive = false;
                initApp();
                return;
            }

            let defData = getActiveCurriculumObj();
            if (globalStep === 0 && defData?.learn?.skipSom && !isSecretEditMode) globalStep = 2;
            else if (globalStep < 3) {
                globalStep++;
                if (globalStep === 2) currentRandomQuestion = null;
            } else if (globalStep === 3) {
                completeLesson(activeViewSubj);
                return;
            }
            renderCurrentStep();
        }

        function handlePrevClick() {
            stopAllSpeech();
            if (window.InteractiveLabEngine) window.InteractiveLabEngine.stopActiveTimers();

            let defData = getActiveCurriculumObj();
            if (globalStep === 2 && defData?.learn?.skipSom && !isSecretEditMode) globalStep = 0;
            else if (globalStep > 0) globalStep--;
            renderCurrentStep();
        }

        function buildCyclesTabsBar() {
            const bar = document.getElementById('cycles-tabs-bar');
            if (!bar) return;
            bar.innerHTML = '';

            let maxUnlockedCycle = getCycleFromGlobalWeek(actualWeek);
            for (let c = 1; c <= TOTAL_CYCLES_FOR_YEAR; c++) {
                const btn = document.createElement('button');
                btn.type = 'button';
                const isLocked = (!isFreeExplore && !isSecretEditMode && c > maxUnlockedCycle);
                btn.className = 'cycle-tab-pill' + (c === selectedMapCycle ? ' active-cycle' : '') + (isLocked ? ' locked-cycle' : '');
                const startLesson = ((c - 1) * 28) + 1;
                const endLesson = c * 28;
                btn.innerText = `الدورة ${toArDigits(c)} (${toArDigits(startLesson)}-${toArDigits(endLesson)})`;
                if (!isLocked) {
                    btn.onclick = () => {
                        selectedMapCycle = c;
                        loadCycleScriptIfNeeded(RAW_YEAR, c, () => {
                            buildCyclesTabsBar();
                            buildWeekGrid();
                        });
                    };
                }
                bar.appendChild(btn);
            }
        }

        function buildWeekGrid() {
            buildCyclesTabsBar();
            let grid = document.getElementById('week-grid-modal');
            if (!grid) return;
            grid.innerHTML = '';

            const cycleOffset = (selectedMapCycle - 1) * WEEKS_PER_CYCLE;

            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 7; c++) {
                    let localIdx = (c * 4) + r + 1;
                    let globalWeekIdx = cycleOffset + localIdx;
                    let elementBg = ROW_ELEMENT_BG[r];
                    let spectrumBorder = COL_SPECTRUM_BORDERS[c];
                    let letterChar = STRICT_ABJAD_LETTERS[localIdx - 1];
                    let weekStars = getWeekStarsCount(globalWeekIdx);

                    let wrap = document.createElement('div');
                    wrap.className = 'week-wrapper';

                    let btn = document.createElement('button');
                    btn.innerHTML = `
                        <span class="week-btn-letter">${letterChar}</span>
                        <span class="week-btn-eval">⭐${toArDigits(weekStars)}/٧</span>
                    `;
                    btn.style.setProperty('--element-bg', elementBg);
                    btn.style.setProperty('--spectrum-border', spectrumBorder);
                    if (r === 2) btn.style.setProperty('--letter-color', '#0f172a');

                    if (globalWeekIdx < actualWeek) {
                        btn.className = 'week-btn-item completed';
                        btn.onclick = () => { playWeek = globalWeekIdx; playMaxSubj = 7; activeViewSubj = 1; isReviewMode = true; initApp(); closeWeekModal(); };
                    } else if (globalWeekIdx === actualWeek) {
                        btn.className = 'week-btn-item current';
                        btn.onclick = () => { playWeek = globalWeekIdx; playMaxSubj = (isFreeExplore || isSecretEditMode) ? 7 : actualSubj; activeViewSubj = actualSubj; isReviewMode = false; initApp(); closeWeekModal(); };
                    } else if (isFreeExplore || isSecretEditMode) {
                        btn.className = 'week-btn-item free-unlocked';
                        btn.onclick = () => { playWeek = globalWeekIdx; playMaxSubj = 7; activeViewSubj = 1; isReviewMode = true; initApp(); closeWeekModal(); };

                        btn.className = 'week-btn-item locked';

                    lbl.className = 'week-name';
                    lbl.innerHTML = `<span style="color:${spectrumBorder}">${letterChar}</span> : <span>${toArDigits(globalWeekIdx)}</span>`;

                    wrap.appendChild(btn);
                    wrap.appendChild(lbl);
                    grid.appendChild(wrap);

            }

            const examBtn = document.getElementById('cycle-exam-btn');
            const examLbl = document.getElementById('cycle-exam-btn-label');
