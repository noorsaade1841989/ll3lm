    function renderActiveView() {
        loadStage2CurriculumFiles(activeYear, getCycleOfWeek(playWeek), () => {
            if (activeStation === 0) renderLessonStation();
            else if (activeStation === 1) renderQuestionStation(true);
            else renderApplyStation();
        });
    }

    function handleCornerButtonAction() {
        stopAllTTS();
        if (activeStation === 0) { activeStation = 1; renderActiveView(); return; }
        if (activeStation === 1) {
            if (!currentQuestionResolved && !isFreeExplore) return;
            activeStation = 2; renderActiveView(); return;
        }

        if (isFreeExplore) {
            showToast('وَضْعُ الاسْتِكْشَافِ مُفَعَّلٌ — لَا تُحْتَسَبُ النُّجُومُ حَتَّى العَوْدَةِ لِلتَّسَلْسُلِ');
            if (activeSeal < 7) { activeSeal++; activeStation = 0; currentSlideIdx = 0; isVideoMode = false; isLabMode = false; renderActiveView(); }
            else if (playWeek < getTotalWeeks()) { playWeek++; activeSeal = 1; activeStation = 0; currentSlideIdx = 0; isVideoMode = false; isLabMode = false; renderActiveView(); }
            return;
        }

        setSealStar(activeYear, playWeek, activeSeal);
        playChime(true);
        updateChromeUI();

        if (activeSeal < 7) {
            activeSeal++; activeStation = 0; currentSlideIdx = 0; isVideoMode = false; isLabMode = false;
            renderActiveView();
        } else {
            const wStars = countLessonStars(activeYear, playWeek);
            const yStars = countYearStars(activeYear);
            const totStars = getTotalWeeks() * 7;
            const meta = getLessonMeta(activeYear, playWeek);
            document.getElementById('complete-modal-title').textContent = `أَتْمَمْتَ دَرْسَ (${meta.rawLtr}) بِنَجَاحٍ!`;
            document.getElementById('complete-stars-row').textContent = '⭐'.repeat(wStars);
            document.getElementById('complete-modal-summary').textContent =
                `نُجُومُ هٰذَا الدَّرْسِ: ${toAr(wStars)} / ٧ — مَجْمُوعُ نُجُومِ السَّنَةِ: ${toAr(yStars)} / ${toAr(totStars)}`;
            document.getElementById('lesson-complete-modal').classList.add('open');
        }
    }

    function renderMapModal() {
        const totCyc = getTotalCycles();
        const totStars = getTotalWeeks() * 7;
        document.getElementById('modal-week-stars').textContent = `${toAr(countLessonStars(activeYear, playWeek))} / ٧`;
        document.getElementById('modal-year-stars').textContent = `${toAr(countYearStars(activeYear))} / ${toAr(totStars)}`;

        const tabsBar = document.getElementById('cycles-tabs-bar');
        tabsBar.innerHTML = '';
        if (totCyc > 1) {
            for (let c = 1; c <= totCyc; c++) {
                const maxC = getCycleOfWeek(getMaxUnlockedWeek(activeYear));
                const locked = !isFreeExplore && c > maxC;
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'cycle-tab-pill' + (c === selectedMapCycle ? ' active-cycle' : '') + (locked ? ' locked-cycle' : '');
                b.textContent = `الدَّوْرَةُ ${CYCLE_AR_NAMES[c]} (${toAr((c-1)*28+1)}–${toAr(c*28)})`;
                b.onclick = () => {
                    if (locked) return;
                    selectedMapCycle = c;
                    loadStage2CurriculumFiles(activeYear, c, renderMapModal);
                };
                tabsBar.appendChild(b);
            }
        }

        const modeBtn = document.getElementById('toggle-mode-btn');
        modeBtn.className = 'setting-pill-btn ' + (isFreeExplore ? 'mode-exp' : 'mode-seq');
        modeBtn.textContent = isFreeExplore
            ? '🔓 وَضْعُ الاسْتِكْشَافِ (النُّجُومُ مُعَطَّلَةٌ — اضْغَطْ لِلتَّسَلْسُلِ)'
            : '🔒 وَضْعُ التَّسَلْسُلِ (تَحْتَسِبُ النُّجُومُ — اضْغَطْ لِلِاسْتِكْشَافِ)';

        document.getElementById('toggle-global-tts-btn').textContent =
            isTTSActive ? '🔊 القَارِئُ الآلِيُّ: مُفَعَّلٌ' : '🔇 القَارِئُ الآلِيُّ: مُتَوَقِّفٌ';

        const grid = document.getElementById('abjad-map-grid');
        grid.innerHTML = '';
        const offset = (selectedMapCycle - 1) * 28;
        for (let i = 1; i <= 28; i++) {
            const gw = offset + i;
            const unlocked = isWeekUnlocked(gw);
            const stars = countLessonStars(activeYear, gw);
            const cell = document.createElement('button');
            cell.type = 'button';
            cell.className = 'map-letter-cell'
                + (gw === playWeek ? ' current-week' : '')
                + (stars === 7 ? ' completed-week' : '')
                + (!unlocked ? ' locked-week' : '');
            cell.innerHTML = `
                <span class="cell-ltr">${ABJAD[i - 1]}</span>
                <span class="cell-stars">${unlocked ? ('⭐ ' + toAr(stars) + '/٧') : '🔒'}</span>
            `;
            cell.onclick = () => {
                if (!unlocked) { showToast('أَتْمِمْ دُرُوسَكَ السَّابِقَةَ أَوَّلًا أَوْ فَعِّلْ وَضْعَ الاسْتِكْشَافِ 🔒'); return; }
                playWeek = gw;
                activeSeal = isFreeExplore ? 1 : Math.min(7, getMaxUnlockedSealInWeek(activeYear, gw));
                activeStation = 0; currentSlideIdx = 0; isVideoMode = false; isLabMode = false;
                document.getElementById('map-modal').classList.remove('open');
                renderActiveView();
            };
            grid.appendChild(cell);
        }

        const endW = selectedMapCycle * 28;
        const examUnlocked = isFreeExplore || countLessonStars(activeYear, endW) === 7;
        const exBtn = document.getElementById('cycle-exam-btn');
        exBtn.classList.toggle('locked', !examUnlocked);
        document.getElementById('cycle-exam-label').textContent =
            `الامْتِحَانُ التَّطْبِيقِيُّ الشَّامِلُ لِلدَّوْرَةِ ${CYCLE_AR_NAMES[selectedMapCycle] || 'الأُولَى'}`;
    }

    function runComprehensiveCycleExam() {
        const endW = selectedMapCycle * 28;
        if (!isFreeExplore && countLessonStars(activeYear, endW) < 7) {
            showToast('أَتْمِمْ جَمِيعَ دُرُوسِ الدَّوْرَةِ أَوَّلًا لِفَتْحِ الامْتِحَانِ الشَّامِلِ 🔒');
            return;
        }
        document.getElementById('map-modal').classList.remove('open');
        stopAllTTS();
        const startW = (selectedMapCycle - 1) * 28 + 1;
        const sampleWeeks = [startW, startW + 6, startW + 13, startW + 20, endW];
        const examQuestions = sampleWeeks.map((w, idx) =>
            window.Stage2QuestionEngine.generateDynamicQuestion(window.curriculumData, activeYear, w, [2, 3, 5, 6, 2][idx])
        );
        let qIdx = 0, score = 0;
        const host = document.getElementById('station-body-host');

        const renderStep = () => {
            if (qIdx >= examQuestions.length) {
                playChime(true);
                host.innerHTML = `
                    <div id="lesson-scroll-box">
                        <div class="apply-card-box">
                            <div style="font-size:3.5rem;">🏆🌟</div>
                            <h2 style="color:#065f46; font-weight:900;">نَتِيجَةُ الامْتِحَانِ الشَّامِلِ لِلدَّوْرَةِ ${CYCLE_AR_NAMES[selectedMapCycle]}</h2>
                            <p style="font-size:1.5rem; font-weight:900; color:#b45309;">${toAr(score)} / ${toAr(examQuestions.length)}</p>
                            <button type="button" class="setting-pill-btn mode-seq" id="back-to-lessons-btn">العَوْدَةُ إِلَى الدُّرُوسِ</button>
                        </div>
                    </div>`;
                document.getElementById('back-to-lessons-btn').onclick = () => renderActiveView();
                return;
            }
            const q = examQuestions[qIdx];
            host.innerHTML = `
                <div class="quiz-scroll-area">
                    <div class="quiz-card-shell">
                        <div class="quiz-prompt-header">
                            <span class="quiz-prompt-text">🏆 الامْتِحَانُ الشَّامِلُ (${toAr(qIdx + 1)} / ${toAr(examQuestions.length)}): ${safeRenderText(q.prompt || '')}</span>
                        </div>
                        <div id="exam-q-body"></div>
                    </div>
                </div>`;
            const bEl = document.getElementById('exam-q-body');
            if (q.type === 'true_false') {
                bEl.innerHTML = `<div class="quiz-stem-box">${safeRenderText(q.statement)}</div>
                    <div class="tf-buttons-row" style="margin-top:14px;">
                        <button type="button" class="tf-choice-btn tf-true" id="ex-t">✅ صَحٌّ</button>
                        <button type="button" class="tf-choice-btn tf-false" id="ex-f">❌ خَطَأٌ</button>
                    </div>`;
                document.getElementById('ex-t').onclick = () => { if (q.correctBool) { score++; playChime(true); } else playChime(false); qIdx++; setTimeout(renderStep, 600); };
                document.getElementById('ex-f').onclick = () => { if (!q.correctBool) { score++; playChime(true); } else playChime(false); qIdx++; setTimeout(renderStep, 600); };
            } else if (q.type === 'science_cloze') {
                bEl.innerHTML = `<div class="cloze-top-choices" id="ex-clz"></div>
                    <div class="quiz-stem-box" style="margin-top:12px;">${safeRenderText(q.beforeText)} <span class="cloze-blank-slot">........</span> ${safeRenderText(q.afterText)}</div>`;
                q.choices.forEach(ch => {
                    const b = document.createElement('button'); b.type = 'button'; b.className = 'cloze-word-pill'; b.textContent = ch.word;
                    b.onclick = () => { if (ch.correct) { score++; playChime(true); } else playChime(false); qIdx++; setTimeout(renderStep, 600); };
                    document.getElementById('ex-clz').appendChild(b);
                });
            } else {
                bEl.innerHTML = `${q.stem ? `<div class="quiz-stem-box">${safeRenderText(q.stem)}</div>` : ''}<div class="mcq-options-grid" id="ex-mcq" style="margin-top:12px;"></div>`;
                (q.options || []).forEach(opt => {
                    const b = document.createElement('button'); b.type = 'button'; b.className = 'quiz-opt-btn'; b.textContent = opt.text;
                    b.onclick = () => { if (opt.correct) { score++; playChime(true); } else playChime(false); qIdx++; setTimeout(renderStep, 600); };
                    document.getElementById('ex-mcq').appendChild(b);
                });
            }
        };
        renderStep();
    }

            const st = parseInt(pill.dataset.st, 10);
            const stProg = getSealStationProgress(activeYear, playWeek, activeSeal);
            if (!isFreeExplore && st > Math.max(stProg, activeStation)) { showToast('أَنْجِزِ المَحَطَّةَ الحَالِيَّةَ أَوَّلًا 🔒'); return; }
            stopAllTTS();
            activeStation = st;
            renderActiveView();
        };
    });

    document.getElementById('slide-prev-btn').onclick = () => { if (currentSlideIdx > 0) { currentSlideIdx--; renderLessonStation(); } };
    document.getElementById('slide-next-btn').onclick = () => {
        const slides = getSealObj(activeYear, playWeek, activeSeal)?.learn?.slides || [];
        if (currentSlideIdx < slides.length - 1) { currentSlideIdx++; renderLessonStation(); }
    };

    document.getElementById('tts-play-btn').onclick = () => {
        isTTSActive = !isTTSActive;
        SafeStore.set('tts_enabled_state', isTTSActive ? 'true' : 'false');
        if (!isTTSActive) stopAllTTS();
        else {
            const slide = getSealObj(activeYear, playWeek, activeSeal)?.learn?.slides?.[currentSlideIdx];
            if (slide) speakSlideTextOnly(slide.text);
        }
        updateChromeUI();
    };

    document.getElementById('auto-flip-btn').onclick = () => {
        isAutoFlip = !isAutoFlip;
        SafeStore.set('stage2_auto_flip', isAutoFlip ? 'true' : 'false');
        updateChromeUI();
        showToast(isAutoFlip ? 'التَّقْلِيبُ الآلِيُّ لِلسَّلَايْدَاتِ: مُفَعَّلٌ 🔄' : 'التَّقْلِيبُ الآلِيُّ: مُتَوَقِّفٌ');
    };

    document.getElementById('lab-mode-btn').onclick = () => {
        isLabMode = !isLabMode;
        if (isLabMode) { isVideoMode = false; stopAllTTS(); }
        renderLessonStation();
    };

    document.getElementById('video-mode-btn').onclick = () => {
        isVideoMode = !isVideoMode;
        if (isVideoMode) { isLabMode = false; stopAllTTS(); }
        renderLessonStation();
    };

    document.getElementById('corner-next-btn').onclick = handleCornerButtonAction;

    // التشغيل الابتدائي
    playWeek = getMaxUnlockedWeek(activeYear);
    selectedMapCycle = getCycleOfWeek(playWeek);
    activeSeal = getMaxUnlockedSealInWeek(activeYear, playWeek);
    renderActiveView();
})();
    </script>
</body>
</html>
