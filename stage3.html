<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>العِلْم | مَرْحَلَةُ عَبْد — القَالَبُ المُوَحَّدُ التَّفَاعُلِيُّ</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="cc.ico" type="image/x-icon">
    <meta name="theme-color" content="#064e3b">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Amiri:wght@700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #059669;
            --primary-dark: #064e3b;
            --primary-light: #ecfdf5;
            --accent-gold: #eab308;
            --accent-gold-light: #fef9c3;
            --accent-green: #10b981;
            --accent-red: #e11d48;
            --surface-glass: rgba(255, 255, 255, 0.94);
            --border-glass: rgba(16, 185, 129, 0.45);
            --shadow-soft: 0 14px 36px rgba(6, 40, 30, 0.24);
            --text-main: #0f172a;
            --text-muted: #475569;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Cairo', system-ui, -apple-system, sans-serif;
            letter-spacing: 0;
            background-color: #06281e;
            background-image: radial-gradient(circle at 18% 15%, rgba(16, 185, 129, 0.28) 0%, rgba(6, 40, 30, 0.94) 55%, rgba(9, 17, 30, 0.97) 100%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
        }

        /* ================= ١. الشريط العلوي الموحد بكبسولتين فقط ================= */
        header.top-bar {
            flex: 0 0 auto;
            width: 100%;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: rgba(6, 34, 26, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 2px solid rgba(250, 204, 21, 0.45);
            z-index: 200;
        }

        .hdr-capsule {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 46px;
            padding: 4px 14px;
            border-radius: 999px;
            background: linear-gradient(145deg, #ffffff, #ecfdf5);
            border: 2px solid #eab308;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
            color: var(--text-main);
            font-family: inherit;
            font-weight: 800;
            font-size: clamp(0.78rem, 2.1vmin, 0.98rem);
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
            max-width: 49%;
            overflow: hidden;
            white-space: nowrap;
        }

        .hdr-capsule:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(234, 179, 8, 0.35);
            border-color: #fde047;
        }

        /* الكبسولة اليمنى: الرمز + المدرسة + المرحلة (عبد) + العمر */
        #home-identity-capsule {
            background: linear-gradient(135deg, #022c22 0%, #065f46 100%);
            color: #ffffff;
            border-color: #fde047;
        }

        .school-emblem {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #eab308, #10b981);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(234, 179, 8, 0.5);
        }

        .school-emblem svg { width: 18px; height: 18px; fill: #ffffff; }

        .capsule-sep {
            width: 1.5px;
            height: 18px;
            background: rgba(255, 255, 255, 0.32);
            flex-shrink: 0;
        }

        .stage-age-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(250, 204, 21, 0.2);
            border: 1px solid rgba(253, 224, 71, 0.45);
            padding: 2px 9px;
            border-radius: 999px;
            color: #fef08a;
            font-weight: 900;
            flex-shrink: 0;
        }

        .school-name-txt {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* الكبسولة اليسرى: الخريطة + الدورة + حرف الدرس + اسم الدرس + النجوم */
        #map-lesson-capsule {
            background: linear-gradient(135deg, #ffffff 0%, #ecfdf5 100%);
            border-color: #10b981;
        }

        .abjad-orb {
            min-width: 32px;
            height: 32px;
            padding: 0 8px;
            border-radius: 999px;
            background: linear-gradient(135deg, #059669, #064e3b);
            border: 1.5px solid #fde047;
            color: #fef08a;
            font-weight: 900;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(5, 150, 105, 0.35);
        }

        .map-lesson-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #064e3b;
            font-weight: 900;
        }

        .map-star-pill {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background: #fef9c3;
            border: 1.5px solid #eab308;
            color: #713f12;
            padding: 1px 8px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 900;
            flex-shrink: 0;
        }

        /* ================= ٢. تخطيط مساحة العمل والشريط العمودي لأختام الهندسة المقدسة ================= */
        .layout-wrapper {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: row;
            gap: 10px;
            padding: 10px 12px;
            position: relative;
        }

        aside.sidebar-nav {
            flex: 0 0 72px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 6px;
            background: linear-gradient(180deg, rgba(6, 40, 30, 0.90) 0%, rgba(15, 23, 42, 0.92) 100%);
            backdrop-filter: blur(14px);
            border: 2px solid rgba(250, 204, 21, 0.42);
            border-radius: 24px;
            padding: 8px 6px;
            box-shadow: var(--shadow-soft);
            z-index: 100;
        }

        .seal-btn {
            position: relative;
            flex: 1 1 0;
            min-height: 0;
            border-radius: 16px;
            border: 2px solid rgba(110, 231, 183, 0.4);
            background: rgba(15, 23, 42, 0.82);
            color: #a7f3d0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.22s ease;
            padding: 4px;
        }

        .seal-svg-wrap {
            width: clamp(22px, 3.4vmin, 28px);
            height: clamp(22px, 3.4vmin, 28px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .seal-svg-wrap svg { width: 100%; height: 100%; }

        /* البطارية الأفقية ثلاثية النقاط (درس • سؤال • تطبيق) */
        .seal-battery {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 2px 5px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.42);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .seal-bat-seg {
            width: 8px;
            height: 5px;
            border-radius: 3px;
            background: #475569;
            transition: background 0.25s ease, transform 0.25s ease;
        }

        .seal-bat-seg.done { background: #34d399; }
        .seal-bat-seg.current { background: #fde047; transform: scaleY(1.3); }

        .seal-star-stamp {
            position: absolute;
            top: -5px;
            left: -5px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fde047, #ca8a04);
            border: 2px solid #ffffff;
            box-shadow: 0 2px 6px rgba(234, 179, 8, 0.65);
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 0.74rem;
            z-index: 3;
        }

        .seal-btn.completed {
            border-color: #34d399;
            background: linear-gradient(145deg, #064e3b, #022c22);
            color: #6ee7b7;
        }
        .seal-btn.completed .seal-star-stamp { display: flex; }

        .seal-btn.active-seal {
            border-color: #fde047;
            background: radial-gradient(circle at 30% 30%, #059669 0%, #064e3b 100%);
            color: #fef08a;
            box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.35), 0 6px 16px rgba(16, 185, 129, 0.35);
            transform: scale(1.05);
        }

        .seal-btn.next-illuminated {
            border-color: #fde047;
            box-shadow: 0 0 12px rgba(250, 204, 21, 0.55);
        }

        .seal-btn.locked-seal {
            opacity: 0.35;
            filter: grayscale(0.75);
            cursor: not-allowed;
        }

        .seal-lock-mini {
            position: absolute;
            bottom: 2px;
            left: 3px;
            font-size: 0.62rem;
            display: none;
        }
        .seal-btn.locked-seal .seal-lock-mini { display: block; }

        /* ================= ٣. مساحة العمل وشريط المحطات الثلاث ================= */
        main.workspace {
            flex: 1 1 auto;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: var(--surface-glass);
            backdrop-filter: blur(16px);
            border: 2.5px solid rgba(250, 204, 21, 0.6);
            border-radius: 26px;
            box-shadow: var(--shadow-soft);
            overflow: hidden;
            position: relative;
        }

        .station-top-strip {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 14px;
            background: linear-gradient(90deg, #ecfdf5 0%, #fefce8 100%);
            border-bottom: 1.5px solid rgba(16, 185, 129, 0.32);
            flex-wrap: wrap;
        }

        .stations-pills {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .st-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 13px;
            border-radius: 999px;
            border: 1.5px solid #cbd5e1;
            background: #ffffff;
            color: #334155;
            font-family: inherit;
            font-size: 0.84rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .st-pill.active {
            background: linear-gradient(135deg, #059669, #064e3b);
            color: #fef08a;
            border-color: #eab308;
            box-shadow: 0 3px 10px rgba(5, 150, 105, 0.32);
        }

        .st-pill.done:not(.active) {
            border-color: #10b981;
            background: #d1fae5;
            color: #065f46;
        }

        .st-pill.locked {
            opacity: 0.42;
            cursor: not-allowed;
        }

        .media-controls-cluster {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .icon-ctrl-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1.5px solid #6ee7b7;
            background: #ffffff;
            color: #064e3b;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .icon-ctrl-btn:hover:not(:disabled) {
            background: #ecfdf5;
            border-color: #059669;
            transform: scale(1.06);
        }

        .icon-ctrl-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .icon-ctrl-btn.active-toggle {
            background: #065f46;
            color: #fef08a;
            border-color: #eab308;
        }

        .slide-counter-badge {
            padding: 3px 10px;
            border-radius: 999px;
            background: #d1fae5;
            border: 1px solid #6ee7b7;
            color: #064e3b;
            font-weight: 900;
            font-size: 0.84rem;
            min-width: 56px;
            text-align: center;
        }

        .explore-banner-chip {
            display: none;
            align-items: center;
            gap: 5px;
            background: #fef3c7;
            border: 1.5px solid #f59e0b;
            color: #92400e;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.76rem;
            font-weight: 800;
        }
        body.explore-mode-active .explore-banner-chip { display: inline-flex; }

        /* ================= ٤. المحطة الأولى (الدرس + المختبر + الفيديو) بسكرول معزول ================= */
        .station-body-host {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        #lesson-scroll-box {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px 18px 94px 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        #lesson-scroll-box::-webkit-scrollbar { width: 9px; }
        #lesson-scroll-box::-webkit-scrollbar-track { background: rgba(209, 250, 229, 0.5); border-radius: 8px; }
        #lesson-scroll-box::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #10b981, #065f46); border-radius: 8px; }

        .slide-image-frame {
            position: relative;
            width: 100%;
            max-width: 840px;
            height: clamp(210px, 38vh, 360px);
            margin: 0 auto;
            border-radius: 22px;
            background: linear-gradient(145deg, #06281e, #0f172a);
            border: 2.5px solid #10b981;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(6, 40, 30, 0.16);
            flex-shrink: 0;
            user-select: none;
        }

        .slide-image-frame.expanded-frame { height: clamp(320px, 62vh, 560px); }
        .slide-image-frame.pan-enabled { cursor: grab; touch-action: none; }
        .slide-image-frame.pan-enabled.dragging { cursor: grabbing; }

        #slide-zoom-target {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            transform-origin: center center;
            transition: transform 0.08s ease-out;
            pointer-events: none;
            display: block;
        }

        .img-zoom-toolbar {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(6, 40, 30, 0.84);
            border: 1px solid rgba(253, 224, 71, 0.45);
            backdrop-filter: blur(8px);
            padding: 5px 7px;
            border-radius: 999px;
            z-index: 15;
        }

        .zoom-icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.15s ease;
        }
        .zoom-icon-btn:hover { background: rgba(16, 185, 129, 0.6); transform: scale(1.08); }
        .zoom-icon-btn.pan-on { background: #eab308; color: #0f172a; }

        .zoom-level-pill {
            color: #fde047;
            font-size: 0.76rem;
            font-weight: 900;
            padding: 0 5px;
            direction: ltr;
        }

        /* لافتة عنوان الختم الزمردية الذهبية */
        .lesson-title-banner {
            width: 100%;
            max-width: 840px;
            margin: 0 auto;
            padding: clamp(18px, 3.2vmin, 28px) 22px;
            border-radius: 22px;
            background: linear-gradient(135deg, #022c22 0%, #065f46 58%, #047857 100%);
            color: #ffffff;
            border: 2.5px solid #eab308;
            box-shadow: 0 10px 26px rgba(6, 78, 59, 0.25);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            flex-shrink: 0;
        }

        .banner-title-main {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .banner-letter-seal {
            width: 54px;
            height: 54px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid #fde047;
            color: #fef08a;
            font-family: 'Aref Ruqaa', serif;
            font-size: 1.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .banner-lesson-heading {
            font-size: clamp(1.08rem, 2.7vmin, 1.52rem);
            font-weight: 900;
            line-height: 1.5;
            color: #fef08a;
        }

        .banner-seal-sub {
            font-size: 0.82rem;
            color: #a7f3d0;
            font-weight: 800;
            margin-bottom: 3px;
        }

        /* نص الشريحة بالتشكيل المتصل غير المقطع */
        .lesson-text-card {
            width: 100%;
            max-width: 840px;
            margin: 0 auto;
            background: #ffffff;
            border: 2px solid #a7f3d0;
            border-radius: 22px;
            padding: clamp(18px, 3.2vmin, 28px);
            font-family: 'Amiri', 'Cairo', serif;
            font-size: clamp(1.3rem, 3vmin, 1.8rem);
            line-height: 2.1;
            color: #0f172a;
            box-shadow: 0 4px 16px rgba(6, 78, 59, 0.06);
            text-align: justify;
        }

        .lesson-text-card.quran-ayah-card {
            background: linear-gradient(145deg, #fffbeb, #fefce8);
            border-color: #eab308;
            text-align: center;
            font-size: clamp(1.42rem, 3.4vmin, 1.98rem);
            color: #064e3b;
        }

        .lesson-text-card.speaking-highlight {
            border-color: #059669;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
        }

        /* حاوية المختبر التفاعلي المدمج لمرحلة عبد */
        .stage2-lab-box {
            width: 100%;
            max-width: 840px;
            margin: 0 auto;
            border-radius: 22px;
            background: radial-gradient(circle at 50% 30%, #0f2922 0%, #09111e 100%);
            border: 2.5px solid #eab308;
            padding: 16px;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            box-shadow: 0 12px 30px rgba(6, 40, 30, 0.35);
        }

        .lab-header-pill {
            padding: 4px 16px;
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.22);
            border: 1.5px solid #34d399;
            color: #fef08a;
            font-weight: 800;
            font-size: 0.92rem;
        }

        .lab-canvas-wrap {
            width: 100%;
            min-height: 230px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lab-canvas-wrap canvas, .lab-canvas-wrap svg { max-width: 100%; max-height: 260px; }

        .lab-controls-bar {
            width: 100%;
            background: rgba(15, 23, 42, 0.86);
            border: 1px solid rgba(250, 204, 21, 0.4);
            border-radius: 16px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .lab-ctrl-group {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.86rem;
            font-weight: 800;
            color: #e2e8f0;
        }
        .lab-ctrl-group input[type="range"] { accent-color: #eab308; cursor: pointer; }
        .lab-val-badge {
            background: #065f46;
            color: #fde047;
            padding: 2px 9px;
            border-radius: 8px;
            font-weight: 900;
        }
        .lab-action-mini-btn {
            background: linear-gradient(135deg, #eab308, #ca8a04);
            color: #0f172a;
            border: none;
            padding: 5px 14px;
            border-radius: 999px;
            font-weight: 900;
            font-size: 0.84rem;
            cursor: pointer;
        }

        /* مشغل الفيديو العالمي */
        .universal-video-shell {
            width: 100%;
            max-width: 840px;
            margin: 0 auto;
            border-radius: 22px;
            overflow: hidden;
            background: #090d16;
            border: 3px solid #10b981;
            box-shadow: 0 14px 34px rgba(6, 40, 30, 0.35);
            display: flex;
            flex-direction: column;
        }

        .video-stage-area {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: radial-gradient(circle, #1e293b 0%, #090d16 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .video-stage-area video { width: 100%; height: 100%; object-fit: contain; display: block; }

        .video-big-play-overlay {
            position: absolute;
            width: 68px;
            height: 68px;
            border-radius: 50%;
            border: 3px solid #fde047;
            background: rgba(5, 150, 105, 0.88);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
        }
        .video-big-play-overlay svg { width: 30px; height: 30px; fill: #ffffff; }

        .video-fallback-notice {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            text-align: center;
            color: #e2e8f0;
            background: rgba(6, 40, 30, 0.94);
            z-index: 6;
        }

        .universal-video-controls {
            direction: ltr;

    <script>
        (function initSafeStorage() {
            const mem = {};
            window.SafeStore = {
                get(k) {
                    try { const v = window.localStorage.getItem(k); return v !== null ? v : (k in mem ? mem[k] : null); }
                    catch (e) { return k in mem ? mem[k] : null; }
                },
                set(k, v) {
                    mem[k] = String(v);
                    try { window.localStorage.setItem(k, String(v)); } catch (e) {}
                },
                remove(k) {
                    delete mem[k];
                    try { window.localStorage.removeItem(k); } catch (e) {}
                }
            };

    <script>
        window.curriculumData = window.curriculumData || {};
        window._loadedStage2Scripts = window._loadedStage2Scripts || {};

        function loadStage2CurriculumFiles(year, cycleNum, callback) {
            window.curriculumData[year] = window.curriculumData[year] || {};
            const filesToTry = [`curriculum-y${year}.js`, `curriculum-y${year}-c${cycleNum}.js`];
            let pending = 0;
            const checkDone = () => {
                if (pending <= 0 && typeof callback === 'function') callback();
            };
            filesToTry.forEach(src => {
                if (window._loadedStage2Scripts[src]) return;
                pending++;
                const s = document.createElement('script');
                s.src = src;
                s.onload = () => { window._loadedStage2Scripts[src] = true; pending--; checkDone(); };
                s.onerror = () => { window._loadedStage2Scripts[src] = true; pending--; checkDone(); };
                document.head.appendChild(s);
            });
            checkDone();
        }
    </script>

    <script>
// ============================================================================
// محرك الأسئلة الديناميكي السباعي المطور لمرحلة عبد (يحافظ على الحركات كاملة)
// ============================================================================
(function(exports) {
  const toAr = (s) => String(s).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
  const toWest = (s) => String(s).replace(/[٠-٩]/g, d => '0123456789'['٠١٢٣٤٥٦٧٨٩'.indexOf(d)]);

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function baseKey(word) {
    return String(word || '').replace(/[\u064B-\u0652\u0670\u0640]/g, '').replace(/[^\u0621-\u064A]/g, '');
  }

  function extractCleanSentences(slides, minWords = 4, maxWords = 32) {
    const out = [];
    (slides || []).forEach(sl => {
      if (!sl || !sl.text || sl.isImagePrompt) return;
      let txt = String(sl.text)
        .replace(/﴿[^﴾]*﴾/g, ' ')
        .replace(/\([^)]*\)/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      const parts = txt.split(/(?<=[.؟!؛])\s+|\n+/g);
      parts.forEach(p => {
        let s = p.replace(/^[–\-•\d().]+\s*/, '').trim();
        if (!s) return;
        const words = s.split(/\s+/).filter(Boolean);
        if (words.length >= minWords && words.length <= maxWords) out.push(s);
      });
    });
    return out;
  }

  function invertArabicSentencePolarity(rawSent) {
    let s = String(rawSent || '').trim();
    s = s.replace(/^(?:ثُمَّ|وَ|فَ)\s+/u, '');
    if (!s.endsWith('.')) s = s.replace(/[.،؛؟!]+$/, '') + '.';

    const words = s.split(/\s+/);
    const firstBase = baseKey(words[0]);

    if (['لا', 'لم', 'لن', 'ليس', 'ليست', 'ما'].includes(firstBase)) {
      let mainPart = s.replace(/\s*،?\s*\bبَلْ[\u064B-\u0652]*\s+.*$/u, '.');
      let mw = mainPart.split(/\s+/);
      mw.shift();
      if (firstBase === 'لم' && mw[0]) mw[0] = mw[0].replace(/[\u0652\u0650]$/, '\u064F');
      if (firstBase === 'لن' && mw[0]) mw[0] = mw[0].replace(/\u064E$/, '\u064F');
      return { text: mw.join(' ') };
    }

    const lastChar = words[0].slice(-1);
    const isDefiniteNoun = firstBase.startsWith('ال') || /^(?:كال|بال|لل|فال|وال)/.test(firstBase) || words[0].includes('ة') || /[\u064B\u064C\u064D]/.test(words[0]);

    if (!isDefiniteNoun && /^[أنيت]/.test(firstBase) && lastChar === '\u064F') {
      return { text: 'لَا ' + s };
    }
    if (!isDefiniteNoun && firstBase.length >= 3 && lastChar !== '\u064F') {
      return { text: 'مَا ' + s };
    }
    if (/\s+هُوَ\s+/u.test(s)) {
      return { text: s.replace(/\s+هُوَ\s+/u, ' لَيْسَ ') };
    }
    if (/\s+هِيَ\s+/u.test(s)) {
      return { text: s.replace(/\s+هِيَ\s+/u, ' لَيْسَتْ ') };
    }
    const fem = words[0].includes('ة');
    return { text: `${fem ? 'لَيْسَتْ' : 'لَيْسَ'} ${s}` };
  }

  function generateDynamicQuestion(curriculumData, year, week, seal) {
    const yearObj = curriculumData[year] || {};
    const sealObj = yearObj?.[week]?.[seal];
    const slides = sealObj?.learn?.slides || [];

    // أولوية الأسئلة المرجعية المحقونة إن اختار المعلم أو توفرت صيغة خاصة، مع التنوع الديناميكي
    // ١. الختم ١ (المنطق والقرآن): ترتيب مقاطع الآية أو فقرة البيان
    if (seal === 1) {
      const poolSlides = slides.filter(sl => sl.text && sl.text.split(/\s+/).length >= 4);
      const chosen = poolSlides[Math.floor(Math.random() * poolSlides.length)] || slides[0] || { text: 'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ' };
      let rawTxt = chosen.text.replace(/[﴿﴾]/g, '').replace(/۝[٠-٩\d]+/g, '|').trim();
      let parts = rawTxt.split(/\||\s*[،؛.]\s*/).map(p => p.trim()).filter(p => p.split(/\s+/).length >= 2);

      if (parts.length >= 3) {
        const picked = parts.slice(0, Math.min(4, parts.length));
        let scrambled = shuffle(picked.map((c, idx) => ({ id: idx, label: c })));
        if (scrambled.every((it, idx) => it.id === idx)) scrambled.reverse();
        return {
          type: 'order',
          modeLabel: 'رَتِّبِ المَقَاطِعَ التَّالِيَةَ حَسَبَ وُرُودِهَا فِي نَصِّ الدَّرْسِ:',
          correctOrder: picked,
          tiles: scrambled
        };
      }

      const wTokens = rawTxt.split(/\s+/).filter(Boolean).slice(0, 7);
      let scrambled = shuffle(wTokens.map((w, idx) => ({ id: idx, label: w })));
      if (scrambled.every((it, idx) => it.id === idx) && scrambled.length > 1) scrambled.reverse();
      return {
        type: 'order',
        modeLabel: 'رَتِّبْ كَلِمَاتِ العِبَارَةِ كَمَا وَرَدَتْ فِي نَصِّ الدَّرْسِ:',
        correctOrder: wTokens,
        tiles: scrambled
      };
    }

    // ٢. الختم ٢ (البصيرة والفن الهندسي): إكمال النصف الثاني من ٤ خيارات متوازنة
    if (seal === 2) {
      const sents = extractCleanSentences(slides, 5, 26);
      const chosen = sents[Math.floor(Math.random() * sents.length)] || (slides[0]?.text || '');
      const words = chosen.trim().split(/\s+/).filter(Boolean);
      const half = Math.ceil(words.length / 2);
      const stem = words.slice(0, half).join(' ') + ' ...';
      const correctHalf = words.slice(half).join(' ');

      const distractors = [];
      const allWeeks = Object.keys(yearObj).map(Number).filter(w => w !== week);
      for (const ow of shuffle(allWeeks)) {
        if (distractors.length >= 3) break;
        const oSlides = yearObj?.[ow]?.[2]?.learn?.slides || [];
        const oSents = extractCleanSentences(oSlides, 5, 26);
        if (!oSents.length) continue;
        const oWords = oSents[0].split(/\s+/).filter(Boolean);
        const oHalf = oWords.slice(Math.ceil(oWords.length / 2)).join(' ');
        if (oHalf && oHalf !== correctHalf && !distractors.includes(oHalf)) distractors.push(oHalf);
      }
      while (distractors.length < 3) {
        distractors.push('يَتَرَاجَعُ عَنِ التَّأَمُّلِ وَيَتْرُكُ مِيزَانَ الحِكْمَةِ.');
        break;
      }

      return {
        type: 'mcq_half',
        prompt: 'أَكْمِلِ النِّصْفَ الثَّانِيَ لِلْعِبَارَةِ مِنْ شَرَائِحِ الدَّرْسِ:',
        stem,
        options: shuffle([
          { text: correctHalf, correct: true },
          ...distractors.slice(0, 3).map(d => ({ text: d, correct: false }))
        ])
      };
    }

    // ٣. الختم ٣ (التجويد والصوت): صح أو خطأ بنظام النفي النحوي السليم
    if (seal === 3) {
      const sents = extractCleanSentences(slides, 5, 28);
      const baseSent = sents[Math.floor(Math.random() * sents.length)] || (slides[0]?.text || '');
      const targetTrue = Math.random() < 0.5;
      if (targetTrue) {
        return {
          type: 'true_false',
          prompt: 'مَيِّزْ بِدِقَّةٍ: هَلْ هٰذِهِ العِبَارَةُ الصَّوْتِيَّةُ صَحِيحَةٌ أَمْ خَاطِئَةٌ حَسَبَ الدَّرْسِ؟',
          statement: baseSent,
          correctBool: true
        };
      } else {
        const inv = invertArabicSentencePolarity(baseSent);
        return {
          type: 'true_false',
          prompt: 'مَيِّزْ بِدِقَّةٍ: هَلْ هٰذِهِ العِبَارَةُ الصَّوْتِيَّةُ صَحِيحَةٌ أَمْ خَاطِئَةٌ حَسَبَ الدَّرْسِ؟',
          statement: inv.text,
          correctBool: false
        };
      }
    }

    // ٤. الختم ٤ (الرياضيات والمقدار لعمر ٨–١٤): سلال العمليات الحسابية (جمع، طرح، ضرب، قسمة، مربعات)
    if (seal === 4) {
      if (sealObj?.mathBaskets && Array.isArray(sealObj.mathBaskets.baskets)) {
        return {
          type: 'math_baskets',
          prompt: 'ضَعْ كُلَّ دَائِرَةٍ رِيَاضِيَّةٍ فِي سَلَّةِ النَّاتِجِ الصَّحِيحِ لَهَا:',
          baskets: sealObj.mathBaskets.baskets,
          circles: shuffle(sealObj.mathBaskets.circles)
        };
      }
      const f1 = ((week - 1) % 8) + 2;
      const f2 = ((week + 2) % 7) + 2;
      const prod = f1 * f2;
      const sqBase = ((week % 6) + 3);
      const sqVal = sqBase * sqBase;
      let sumVal = week * 3 + 14;
      if (sumVal === prod || sumVal === sqVal) sumVal += 5;

      const baskets = [
        { id: 'b0', value: prod, label: toAr(prod) },
        { id: 'b1', value: sqVal, label: toAr(sqVal) },
        { id: 'b2', value: sumVal, label: toAr(sumVal) }
      ];
      const pSumA = Math.floor(sumVal / 2);
      const circles = [
        { id: 'c0_1', expr: `${toAr(f1)} × ${toAr(f2)}`, answer: prod },
        { id: 'c0_2', expr: `${toAr(prod * 2)} ÷ ٢`, answer: prod },
        { id: 'c1_1', expr: `${toAr(sqBase)} × ${toAr(sqBase)}`, answer: sqVal },
        { id: 'c1_2', expr: `${toAr(sqVal + 5)} - ٥`, answer: sqVal },
        { id: 'c2_1', expr: `${toAr(pSumA)} + ${toAr(sumVal - pSumA)}`, answer: sumVal },
        { id: 'c2_2', expr: `${toAr(sumVal + 8)} - ٨`, answer: sumVal }
      ];
      return {
        type: 'math_baskets',
        prompt: 'ضَعْ كُلَّ دَائِرَةٍ رِيَاضِيَّةٍ فِي سَلَّةِ النَّاتِجِ الصَّحِيحِ لَهَا:',
        baskets,
        circles: shuffle(circles)
      };
    }

    // ٥. الختم ٥ (الحركة والاتزان البدني): سؤال مرجعي تفاعلي أو عدد خطوات/ثواني التمرين
    if (seal === 5) {
      if (Array.isArray(sealObj?.play?.questions) && sealObj.play.questions.length > 0 && Math.random() < 0.65) {
        const refQ = sealObj.play.questions[0];
        return {
          type: 'mcq_half',
          prompt: 'اخْتَرِ الإِجَابَةَ العِلْمِيَّةَ الصَّحِيحَةَ لِلتَّمْرِينِ البَدَنِيِّ:',
          stem: refQ.q,
          options: shuffle(refQ.options)
        };
      }
      const applyTxt = sealObj?.apply?.steps?.[0] || slides.map(s => s.text).join(' ');
      const numMatch = applyTxt.match(/([٠-٩\d]+)\s*(ثَانِيَةً|ثَوَانٍ|دَقَائِقَ|تَكْرَارًا|تَكْرَارَاتٍ|مَرَّاتٍ)/u);
      const count = numMatch ? parseInt(toWest(numMatch[1]), 10) : (sealObj?.stepCount || 5);
      const unitWord = numMatch ? numMatch[2] : 'دَقَائِقَ';

      const cands = new Set([count]);
      for (const d of [2, -2, 5, -3, 4, 10]) {
        if (cands.size >= 4) break;
        if (count + d > 0) cands.add(count + d);
      }
      return {
        type: 'sport_steps',
        prompt: 'مَا المِقْدَارُ الزَّمَنِيُّ أَوِ العَدَدِيُّ المَضْبُوطُ فِي تَطْبِيقِ هٰذَا التَّمْرِينِ؟',
        stem: applyTxt.replace(numMatch ? numMatch[0] : '', `(...) ${unitWord}`),
        options: shuffle([...cands].map(n => ({
          text: `${toAr(n)} ${unitWord}`,
          correct: n === count
        })))
      };
    }

    // ٦. الختم ٦ (العلوم وسنن الكون): ملء الفراغ العلمي من ٤ خيارات علوية
    if (seal === 6) {
      const STOP = new Set(['يدرس', 'العلم', 'الذي', 'التي', 'يتكون', 'تتكون', 'كيف', 'بين', 'داخل', 'خارج', 'جميع', 'فوق', 'تحت', 'منها', 'فيها', 'لوحة', 'رسم', 'مشهد', 'مقطع']);
      const mainSlides = slides.filter(sl => sl.text && !sl.isImagePrompt);
      const chosenSlide = mainSlides[0] || slides[0] || { text: '' };
      const tokens = chosenSlide.text.split(/\s+/).filter(Boolean);
      const candidates = [];
      tokens.forEach((tok, idx) => {
        if (idx < 1) return;
        const cleanTok = tok.replace(/^[«"(\[]+|[.،؛:!؟»")\]]+$/g, '');
        const b = baseKey(cleanTok);
        if (b.length >= 4 && !STOP.has(b) && !/\d|[٠-٩]/.test(cleanTok)) {
          candidates.push({ idx, cleanWord: cleanTok, base: b });
        }
      });
      const picked = candidates[Math.floor(Math.random() * candidates.length)] || { idx: Math.max(0, tokens.length - 1), cleanWord: (tokens[tokens.length - 1] || 'الخَلِيَّةُ').replace(/[.،]/g, ''), base: 'الخلية' };
      const beforeText = tokens.slice(0, picked.idx).join(' ');
      const trailingPunct = ((tokens[picked.idx] || '').match(/([.،؛:!؟»")\]]+)$/) || ['', ''])[1];
      const afterText = (trailingPunct ? trailingPunct + ' ' : '') + tokens.slice(picked.idx + 1).join(' ');

      const distractors = [];
      const usedBases = new Set([picked.base]);
      const allWeeks = Object.keys(yearObj).map(Number).filter(w => w !== week);
      for (const ow of shuffle(allWeeks)) {
        if (distractors.length >= 3) break;
        const oText = yearObj?.[ow]?.[6]?.learn?.slides?.[0]?.text || '';
        const oToks = oText.split(/\s+/);
        for (const ot of oToks) {
          const cl = ot.replace(/^[«"(\[]+|[.،؛:!؟»")\]]+$/g, '');
          const b = baseKey(cl);
          if (b.length >= 4 && !STOP.has(b) && !usedBases.has(b)) {
            usedBases.add(b);
            distractors.push(cl);
            break;
          }
        }
      }
      while (distractors.length < 3) {
        distractors.push('المَجَرَّاتِ', 'البِلَّوْرَاتِ', 'الأَنْسِجَةِ');
        break;
      }

      return {
        type: 'science_cloze',
        prompt: 'اخْتَرِ الكَلِمَةَ العِلْمِيَّةَ المُنَاسِبَةَ مِنَ الخِيَارَاتِ العُلْوِيَّةِ لِمَلْءِ الفَرَاغِ:',
        beforeText,
        afterText,
        targetWord: picked.cleanWord,
        choices: shuffle([
          { word: picked.cleanWord, correct: true },
          ...distractors.slice(0, 3).map(d => ({ word: d, correct: false }))
        ])
      };
    }

    // ٧. الختم ٧ (الآداب وتزكية السلوك): اختيار ٣ إلى ٤ عبارات صحيحة من بين ٧ عبارات من القصة
    const correctCount = (Math.random() < 0.5) ? 3 : 4;
    const rawClauses = [];
    slides.forEach(sl => {
      if (!sl || !sl.text) return;
      sl.text.split(/(?<=[.؟!])\s+|\s*؛\s*/g).forEach(part => {
        let c = part.replace(/[«»"']/g, '').trim();
        if (!c || c.includes('﴿') || c.endsWith(':')) return;
        const wLen = c.split(/\s+/).filter(Boolean).length;
        if (wLen >= 4 && wLen <= 24) rawClauses.push(c.endsWith('.') ? c : c + '.');
      });
    });

    const uniqueClauses = [...new Set(rawClauses)];
    const shuffled = shuffle(uniqueClauses);
    const truePicked = shuffled.slice(0, Math.min(correctCount, shuffled.length));
    const rem = shuffled.slice(truePicked.length);
    const targetWrong = Math.max(2, 7 - truePicked.length);

    const falseOptions = [];
    for (const src of rem) {
      if (falseOptions.length >= targetWrong) break;
      const inv = invertArabicSentencePolarity(src).text;
      if (inv && inv !== src && !truePicked.includes(inv) && !falseOptions.includes(inv)) {
        falseOptions.push(inv);
      }
    }
    while (falseOptions.length < targetWrong) {
      falseOptions.push('أَطَاعَ البَطَلُ وَسْوَسَةَ الهَوَى وَتَرَكَ حُكْمَ العَقْلِ.');
      if (falseOptions.length < targetWrong) falseOptions.push('أَخْفَى الخَطَأَ عَنْ أَهْلِهِ وَلَمْ يُبَادِرْ إِلَى إِصْلَاحِهِ.');
      break;
    }

    const allOpts = shuffle([
      ...truePicked.map(t => ({ text: t, correct: true })),
      ...falseOptions.slice(0, targetWrong).map(f => ({ text: f, correct: false }))
    ]);

    return {
      type: 'adab_multiselect',
      prompt: `اخْتَرِ العِبَارَاتِ الصَّحِيحَةَ الوَارِدَةَ فِي القِصَّةِ وَعَدَدُهَا (${toAr(truePicked.length)}):`,
      requiredCorrect: truePicked.length,
      options: allOpts
    };
  }

  exports.generateDynamicQuestion = generateDynamicQuestion;
})(window.Stage2QuestionEngine = {});

// ============================================================================
// المحرك التفاعلي الحي للمختبرات (الرياضيات والعلوم والرياضة لمرحلة عبد)
// ============================================================================
window.Stage2LabEngine = (function() {
    let animId = null;
    function stop() { if (animId) { cancelAnimationFrame(animId); animId = null; } }

    function render(container, seal, week, sealObj) {
        stop();
        container.innerHTML = '';
        const box = document.createElement('div');
        box.className = 'stage2-lab-box';

        const pill = document.createElement('div');
        pill.className = 'lab-header-pill';
        const wrap = document.createElement('div');
        wrap.className = 'lab-canvas-wrap';
        const ctrl = document.createElement('div');
        ctrl.className = 'lab-controls-bar';

        box.appendChild(wrap);

        const toAr = (s) => String(s).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

        if (seal === 4) {
            if (week >= 8 && week <= 10) {
                pill.textContent = 'مُخْتَبَرُ الكُسُورِ وَالأَجْزَاءِ البَصَرِيُّ';
                let num = 2, den = 6;
                const cv = document.createElement('canvas');
                cv.width = 500; cv.height = 230;
                wrap.appendChild(cv);
                const ctx = cv.getContext('2d');
                const draw = () => {
                    if (num > den) num = den;
                    ctx.clearRect(0, 0, cv.width, cv.height);
                    const cx = 145, cy = 115, r = 88;
                    for (let i = 0; i < den; i++) {
                        const a1 = (i / den) * Math.PI * 2 - Math.PI / 2;
                        const a2 = ((i + 1) / den) * Math.PI * 2 - Math.PI / 2;
                        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, a1, a2); ctx.closePath();
                        ctx.fillStyle = (i < num) ? '#10b981' : 'rgba(255,255,255,0.12)';
                        ctx.fill(); ctx.strokeStyle = '#fde047'; ctx.lineWidth = 2; ctx.stroke();
                    }
                    ctx.fillStyle = '#fef08a'; ctx.font = 'bold 30px Cairo, sans-serif'; ctx.textAlign = 'center';

                    ctx.fillText(`النِّسْبَةُ: ${toAr(Math.round((num / den) * 100))}٪`, 365, 145);
                };
                ctrl.innerHTML = `
                    <label class="lab-ctrl-group">البَسْطُ <input type="range" id="lb-n" min="0" max="12" value="${num}"><span class="lab-val-badge" id="lb-nv">${toAr(num)}</span></label>
                    <label class="lab-ctrl-group">المَقَامُ <input type="range" id="lb-d" min="1" max="12" value="${den}"><span class="lab-val-badge" id="lb-dv">${toAr(den)}</span></label>
                `;
                const nIn = ctrl.querySelector('#lb-n'), dIn = ctrl.querySelector('#lb-d');
                nIn.oninput = () => { num = +nIn.value; if (num > den) { den = num; dIn.value = den; } ctrl.querySelector('#lb-nv').textContent = toAr(num); ctrl.querySelector('#lb-dv').textContent = toAr(den); draw(); };
                dIn.oninput = () => { den = +dIn.value; if (num > den) { num = den; nIn.value = num; } ctrl.querySelector('#lb-nv').textContent = toAr(num); ctrl.querySelector('#lb-dv').textContent = toAr(den); draw(); };
                draw();
            } else {
                pill.textContent = 'مُخْتَبَرُ المِسَاحَةِ وَالمَصْفُوفَةِ الهَنْدَسِيَّةِ';
                let rows = 3, cols = 4;
                const cv = document.createElement('canvas');
                cv.width = 500; cv.height = 230;
                wrap.appendChild(cv);
                const ctx = cv.getContext('2d');
                const drawGrid = () => {
                    ctx.clearRect(0, 0, cv.width, cv.height);
                    const cell = 22, ox = 45, oy = 25;
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            ctx.fillStyle = 'rgba(16, 185, 129, 0.38)';
                            ctx.strokeStyle = '#fde047';
                            ctx.lineWidth = 1.8;
                            ctx.fillRect(ox + c * cell, oy + r * cell, cell - 2, cell - 2);
                            ctx.strokeRect(ox + c * cell, oy + r * cell, cell - 2, cell - 2);
                        }
                    }
                    ctx.fillStyle = '#fef08a'; ctx.font = 'bold 24px Cairo, sans-serif'; ctx.textAlign = 'center';
                    ctx.fillText(`المِسَاحَةُ: ${toAr(rows)} × ${toAr(cols)} = ${toAr(rows * cols)}`, 365, 95);
                    ctx.fillStyle = '#6ee7b7'; ctx.font = 'bold 20px Cairo, sans-serif';
                    ctx.fillText(`المُحِيطُ: ${toAr(2 * (rows + cols))}`, 365, 145);
                };
                ctrl.innerHTML = `
                    <label class="lab-ctrl-group">الطُّولُ <input type="range" id="g-r" min="1" max="8" value="${rows}"><span class="lab-val-badge" id="g-rv">${toAr(rows)}</span></label>
                    <label class="lab-ctrl-group">العَرْضُ <input type="range" id="g-c" min="1" max="9" value="${cols}"><span class="lab-val-badge" id="g-cv">${toAr(cols)}</span></label>
                `;
                ctrl.querySelector('#g-r').oninput = (e) => { rows = +e.target.value; ctrl.querySelector('#g-rv').textContent = toAr(rows); drawGrid(); };
                ctrl.querySelector('#g-c').oninput = (e) => { cols = +e.target.value; ctrl.querySelector('#g-cv').textContent = toAr(cols); drawGrid(); };
                drawGrid();
            }
            return;
        }

        // المدرب الحركي والتنفسي لختم الرياضة (٥) أو التجويد والتنفس (٣)
        pill.textContent = (seal === 3) ? 'مُخْتَبَرُ التَّنَفُّسِ الحِجَابِيِّ وَالرَّنِينِ الصَّوْتِيِّ' : 'المُدَرِّبُ الحَرَكِيُّ وَإِيقَاعُ التَّنَفُّسِ';
        let poseIdx = 0;
        const POSES = [
            { name: 'الِاسْتِقَامَةُ وَالشَّهِيقُ الهَادِئُ مِنَ الأَنْفِ', lA: -140, rA: 140, lL: -8, rL: 8 },
            { name: 'التَّوَازُنُ الثَّابِتُ حَوْلَ مَرْكَزِ الثِّقَلِ', lA: -90, rA: 90, lL: 0, rL: 52 },
            { name: 'القُرْفُصَاءُ المُتَّزِنَةُ مَعَ اسْتِقَامَةِ الظَّهْرِ', lA: -75, rA: 75, lL: -32, rL: 32 },
            { name: 'الإِطَالَةُ وَالزَّفِيرُ المُنْتَظِمُ مِنَ الفَمِ', lA: -30, rA: 30, lL: -10, rL: 10 }
        ];
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 420 220');
        svg.style.width = '100%';
        wrap.appendChild(svg);

        let phase = 0;
        const loop = () => {
            const p = POSES[poseIdx % POSES.length];
            phase += 0.04;
            const r = 26 + Math.sin(phase) * 11;
            const bTxt = Math.cos(phase) >= 0 ? 'شَهِيقٌ' : 'زَفِيرٌ';
            svg.innerHTML = `
                <circle cx="330" cy="105" r="${r}" fill="rgba(16,185,129,0.28)" stroke="#fde047" stroke-width="2.5"/>
                <text x="330" y="111" fill="#fef08a" font-size="14" font-weight="900" text-anchor="middle">${bTxt}</text>
                <text x="210" y="24" fill="#a7f3d0" font-size="14" font-weight="900" text-anchor="middle">${p.name}</text>
                <line x1="60" y1="202" x2="240" y2="202" stroke="#34d399" stroke-width="3"/>
                <circle cx="150" cy="62" r="15" fill="#fde047" stroke="#ffffff" stroke-width="2"/>
                <line x1="150" y1="77" x2="150" y2="138" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
                <g transform="translate(150, 88) rotate(${p.lA})"><line x1="0" y1="0" x2="0" y2="44" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/></g>
                <g transform="translate(150, 88) rotate(${p.rA})"><line x1="0" y1="0" x2="0" y2="44" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/></g>
                <g transform="translate(150, 138) rotate(${p.lL})"><line x1="0" y1="0" x2="0" y2="56" stroke="#eab308" stroke-width="7" stroke-linecap="round"/></g>
                <g transform="translate(150, 138) rotate(${p.rL})"><line x1="0" y1="0" x2="0" y2="56" stroke="#eab308" stroke-width="7" stroke-linecap="round"/></g>
            `;
            animId = requestAnimationFrame(loop);
        };
        ctrl.innerHTML = `
            <button type="button" class="lab-action-mini-btn" id="p-prev">الوَضْعِيَّةُ السَّابِقَةُ</button>
            <button type="button" class="lab-action-mini-btn" id="p-next">الوَضْعِيَّةُ التَّالِيَةُ</button>
        `;
        ctrl.querySelector('#p-prev').onclick = () => { poseIdx = (poseIdx + POSES.length - 1) % POSES.length; };
        ctrl.querySelector('#p-next').onclick = () => { poseIdx = (poseIdx + 1) % POSES.length; };
        loop();
    }

    return { render, stop };
})();

// ============================================================================
(function initStage2UnifiedApp() {
    const ABJAD = ['أ','ب','ج','د','هـ','و','ز','ح','ط','ي','ك','ل','م','ن','س','ع','ف','ص','ق','ر','ش','ت','ث','خ','ذ','ض','ظ','غ'];

        1: 'المَنْطِقُ وَالبَيَانُ',

        3: 'الرَّنِينُ وَالتَّجْوِيدُ وَالصَّوْتُ',
        4: 'الرِّيَاضِيَّاتُ وَالمِقْدَارُ',

    };
    const YEAR_CYCLES_MAP = { 8: 1, 9: 1, 10: 1, 11: 1, 12: 1, 13: 2, 14: 2 };
    const CYCLE_AR_NAMES = ['', 'الأُولَى', 'الثَّانِيَةُ'];

        if (!window._s2AudioCtx) window._s2AudioCtx = new Ctx();
        if (window._s2AudioCtx.state === 'suspended') window._s2AudioCtx.resume().catch(() => {});
        return window._s2AudioCtx;
    }

    function playChime(ok = true) {
        try {
            const ctx = getAudioCtx();
            if (!ctx) return;
            const now = ctx.currentTime;
            const freqs = ok ? [523.25, 659.25, 783.99, 1046.5] : [250, 185];
            freqs.forEach((f, idx) => {
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.type = ok ? 'sine' : 'triangle';
                osc.frequency.setValueAtTime(f, now + idx * 0.065);
                g.gain.setValueAtTime(0.001, now + idx * 0.065);
                g.gain.exponentialRampToValueAtTime(0.18, now + idx * 0.065 + 0.02);

            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    // معالجة صوتية نقية تقرأ التشكيل الأصلي كما هو دون تخمين عشوائي يفسد الحركات
    const ARABIC_LETTER_NAMES = {
        'أ': 'الأَلِف', 'ا': 'الأَلِف', 'ب': 'البَاء', 'ت': 'التَّاء', 'ث': 'الثَّاء',
        'ج': 'الجِيم', 'ح': 'الحَاء', 'خ': 'الخَاء', 'د': 'الدَّال', 'ذ': 'الذَّال',
        'ر': 'الرَّاء', 'ز': 'الزَّاي', 'س': 'السِّين', 'ش': 'الشِّين', 'ص': 'الصَّاد',
        'ض': 'الضَّاد', 'ط': 'الطَّاء', 'ظ': 'الظَّاء', 'ع': 'العَيْن', 'غ': 'الغَيْن',
        'ف': 'الفَاء', 'ق': 'القَاف', 'ك': 'الكَاف', 'ل': 'اللَّام', 'م': 'المِيم',
        'ن': 'النُّون', 'ه': 'الهَاء', 'هـ': 'الهَاء', 'و': 'الوَاو', 'ي': 'اليَاء'
    };

    function preprocessTTS(text) {
        if (!text) return '';
        let clean = String(text).replace(/<[^>]*>/g, ' ');
        clean = clean.replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu, ' ');
        clean = clean.replace(/۝[٠-٩\d]+/g, ' ، ');
        clean = clean.replace(/[﴿﴾«»"']/g, ' ');
        clean = clean.replace(/\+/g, ' زَائِد ').replace(/×/g, ' ضَرْب ').replace(/÷/g, ' قِسْمَة ').replace(/=/g, ' يُسَاوِي ').replace(/←|⟵/g, ' يُعْطِي ');
        clean = clean.replace(/²/g, ' تَرْبِيع ');
        clean = clean.replace(/(\d|[٠-٩])\s*-\s*(\d|[٠-٩])/g, '$1 نَاقِص $2');
        const trimmed = clean.trim();
        if (ARABIC_LETTER_NAMES[trimmed]) return ARABIC_LETTER_NAMES[trimmed];
        return clean.replace(/\s+/g, ' ').trim();
    }

    let ttsTimer = null;
    let ttsSessionId = 0;

    function stopAllTTS() {
        ttsSessionId++;
        clearTimeout(ttsTimer);
        if ('speechSynthesis' in window) {
            try { window.speechSynthesis.cancel(); } catch (e) {}
        }
        const card = document.querySelector('.lesson-text-card');
        if (card) card.classList.remove('speaking-highlight');
    }

    function speakSlideTextOnly(rawText, onDone) {
        stopAllTTS();
        if (!isTTSActive || isVideoMode || isLabMode) return;
        const processed = preprocessTTS(rawText);
        if (!processed) { if (onDone) onDone(); return; }

        const mySession = ttsSessionId;
        const card = document.querySelector('.lesson-text-card');
        if (card) card.classList.add('speaking-highlight');

        const startedAt = Date.now();
        const minReadMs = Math.min(15000, Math.max(4200, processed.length * 55));

        const finish = (allowAuto = true) => {
            if (mySession !== ttsSessionId) return;
            clearTimeout(ttsTimer);
            if (card) card.classList.remove('speaking-highlight');
            if (allowAuto && onDone) onDone();
        };

        if (!('speechSynthesis' in window)) {
            ttsTimer = setTimeout(() => finish(true), minReadMs);
            return;
        }
        try {
            const u = new SpeechSynthesisUtterance(processed);
            u.lang = 'ar-SA';
            u.rate = 0.9;
            const voices = window.speechSynthesis.getVoices();
            const arVoice = voices.find(v => v.lang && v.lang.startsWith('ar'));
            if (arVoice) u.voice = arVoice;
            u.onend = () => {
                if (Date.now() - startedAt < 1200) ttsTimer = setTimeout(() => finish(true), minReadMs);
                else finish(true);
            };
            u.onerror = () => { ttsTimer = setTimeout(() => finish(true), minReadMs); };
            ttsTimer = setTimeout(() => finish(true), Math.min(30000, processed.length * 95 + 3000));
            window.speechSynthesis.speak(u);
        } catch (e) { finish(false); }
    }

    // إدارة النجوم والتقدم
    function starKey(y, w, s) { return `s2_v2_star_y${y}_w${w}_s${s}`; }
    function stationKey(y, w, s) { return `s2_v2_st_y${y}_w${w}_s${s}`; }

    function hasSealStar(y, w, s) { return SafeStore.get(starKey(y, w, s)) === '1'; }
    function setSealStar(y, w, s) {
        if (isFreeExplore) return false;
        SafeStore.set(starKey(y, w, s), '1');
        SafeStore.set(stationKey(y, w, s), '3');
        return true;
    }
    function getSealStationProgress(y, w, s) {
        if (hasSealStar(y, w, s)) return 3;
        return parseInt(SafeStore.get(stationKey(y, w, s)) || '0', 10);
    }
    function setSealStationProgress(y, w, s, stCount) {
        if (isFreeExplore) return;
        if (stCount > getSealStationProgress(y, w, s)) SafeStore.set(stationKey(y, w, s), String(stCount));
    }
    function countLessonStars(y, w) {
        let c = 0;
        for (let s = 1; s <= 7; s++) if (hasSealStar(y, w, s)) c++;
        return c;
    }
    function countYearStars(y) {
        let c = 0, totW = (YEAR_CYCLES_MAP[y] || 1) * 28;
        for (let w = 1; w <= totW; w++) c += countLessonStars(y, w);
        return c;
    }
    function getMaxUnlockedWeek(y) {
        const totW = (YEAR_CYCLES_MAP[y] || 1) * 28;
        for (let w = 1; w <= totW; w++) if (countLessonStars(y, w) < 7) return w;
        return totW;
    }
    function getMaxUnlockedSealInWeek(y, w) {
        for (let s = 1; s <= 7; s++) if (!hasSealStar(y, w, s)) return s;
        return 7;
    }
    function isWeekUnlocked(w) { return isFreeExplore || w <= getMaxUnlockedWeek(activeYear); }
    function isSealUnlocked(w, s) {
        if (isFreeExplore) return true;
        if (!isWeekUnlocked(w)) return false;
        if (w < getMaxUnlockedWeek(activeYear)) return true;
        return s <= getMaxUnlockedSealInWeek(activeYear, w);
    }

    function getSealObj(y, w, s) {
        const yrObj = (window.curriculumData && window.curriculumData[y]) || {};
        if (yrObj[w]?.[s]) return yrObj[w][s];
        const localW = ((w - 1) % 28) + 1;
        if (yrObj[localW]?.[s] && w <= 28) return yrObj[localW][s];
        const sealTitle = SEAL_NAMES[s] || 'الدَّرْسُ';
        return {
            learn: {
                introTitle: `${sealTitle} — قَيْدُ التَّحْضِيرِ`,
                slides: [{ img: '', text: `هٰذَا الدَّرْسُ فِي خَتْمِ (${sealTitle}) قَيْدُ التَّحْضِيرِ.` }]
            },
            apply: { steps: [`طَبِّقْ مَا تَعَلَّمْتَهُ فِي خَتْمِ (${sealTitle}) بِإِتْقَانٍ.`] }
        };
    }

    function getLessonMeta(y, w) {
        const yrObj = (window.curriculumData && window.curriculumData[y]) || {};
        const localIdx = (w - 1) % 28;
        const ltr = yrObj[w]?.lessonMeta?.ltr || ABJAD[localIdx] || 'أ';
        const sealObj = getSealObj(y, w, activeSeal);
        const cyc = getCycleOfWeek(w);
        const cycPrefix = getTotalCycles() > 1 ? `د${toAr(cyc)} • ` : '';
        return {
            ltr: `${cycPrefix}${ltr}`,
            rawLtr: ABJAD[localIdx] || 'أ',
            lessonName: sealObj?.learn?.introTitle || yrObj[w]?.lessonMeta?.name || `دَرْسُ (${ABJAD[localIdx]})`,
            sealTitle: sealObj?.learn?.introTitle || SEAL_NAMES[activeSeal]
        };
    }

    function applyImageTransform() {
        const img = document.getElementById('slide-zoom-target');
        const frame = document.getElementById('slide-image-frame');
        const lvl = document.getElementById('zoom-level-pill');
        const panBtn = document.getElementById('zoom-pan-toggle');
        if (!img || !frame) return;
        img.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomScale})`;
        if (lvl) lvl.textContent = `${Math.round(zoomScale * 100)}%`;
        const panActive = forceHandPan || zoomScale > 1.01;
        frame.classList.toggle('pan-enabled', panActive);
        if (panBtn) panBtn.classList.toggle('pan-on', panActive);
    }

    function bindImageZoomAndPan(frame) {
        let dragging = false, startX = 0, startY = 0, originX = 0, originY = 0;
        frame.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.img-zoom-toolbar')) return;
            if (!(forceHandPan || zoomScale > 1.01)) return;
            dragging = true; frame.classList.add('dragging');
            startX = e.clientX; startY = e.clientY; originX = panX; originY = panY;
            try { frame.setPointerCapture(e.pointerId); } catch (err) {}
            e.preventDefault();
        });
        frame.addEventListener('pointermove', (e) => {
            if (!dragging) return;
            panX = originX + (e.clientX - startX); panY = originY + (e.clientY - startY);
            applyImageTransform();
        });
        const end = () => { dragging = false; frame.classList.remove('dragging'); };
        frame.addEventListener('pointerup', end); frame.addEventListener('pointercancel', end);
        frame.addEventListener('wheel', (e) => {
            if (!(forceHandPan || zoomScale > 1.01 || e.ctrlKey)) return;
            e.preventDefault();
            zoomScale = Math.min(4.5, Math.max(1, +(zoomScale + (e.deltaY < 0 ? 0.25 : -0.25)).toFixed(2)));
            if (zoomScale === 1) { panX = 0; panY = 0; }
            applyImageTransform();
        }, { passive: false });
    }

        const bodyEl = document.getElementById('quiz-interactive-body');
        document.getElementById('quiz-reroll-btn').onclick = () => renderQuestionStation(true);
        document.getElementById('quiz-speak-btn').onclick = () => {
            speakSlideTextOnly((q.prompt || q.modeLabel || '') + ' ' + (q.stem || q.statement || q.beforeText || ''));
        };

        if (q.type === 'order') {
            let placed = [], pool = q.tiles.map((t, i) => ({ ...t, uid: i }));
            const renderOrder = () => {
                bodyEl.innerHTML = `<div class="order-slots-zone" id="order-slots"></div><div class="order-pool-zone" id="order-pool"></div>`;
                const sEl = document.getElementById('order-slots'), pEl = document.getElementById('order-pool');
                if (!placed.length) sEl.innerHTML = `<span style="color:#64748b; font-weight:700;">اضْغَطْ عَلَى المَقَاطِعِ بِالتَّرْتِيبِ الصَّحِيحِ...</span>`;
                placed.forEach((it, idx) => {
                    const b = document.createElement('button'); b.type = 'button'; b.className = 'order-tile-btn placed-tile';
                    b.textContent = it.label;
                    b.onclick = () => { if (!currentQuestionResolved) { placed.splice(idx, 1); pool.push(it); renderOrder(); } };
                    sEl.appendChild(b);
                });
                pool.forEach((it, idx) => {
                    const b = document.createElement('button'); b.type = 'button'; b.className = 'order-tile-btn';
                    b.textContent = it.label;
                    b.onclick = () => {
                        if (currentQuestionResolved) return;
                        pool.splice(idx, 1); placed.push(it); renderOrder();
                        if (pool.length === 0) {
                            const ok = placed.every((x, k) => x.label === q.correctOrder[k]);
                            const btns = sEl.querySelectorAll('.order-tile-btn');
                            if (ok) { btns.forEach(bt => bt.classList.add('tile-correct')); markQuestionSolved(); }
                            else {
                                playChime(false);
                                btns.forEach((bt, k) => { if (placed[k].label !== q.correctOrder[k]) bt.classList.add('tile-wrong'); });
                                setTimeout(() => { pool = [...placed]; placed = []; renderOrder(); }, 950);
                            }
                        }
                    };
                    pEl.appendChild(b);
                });
            };
            renderOrder();
        }
        else if (q.type === 'mcq_half' || q.type === 'sport_steps') {
            bodyEl.innerHTML = `${q.stem ? `<div class="quiz-stem-box">${safeRenderText(q.stem)}</div>` : ''}<div class="mcq-options-grid" id="mcq-grid" style="margin-top:12px;"></div>`;
            const grid = document.getElementById('mcq-grid');
            q.options.forEach(opt => {
                const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'quiz-opt-btn';
                btn.innerHTML = `<span>🔹</span><span>${safeRenderText(opt.text)}</span>`;
                btn.onclick = () => {
                    if (currentQuestionResolved) return;
                    if (opt.correct) { btn.classList.add('correct'); grid.querySelectorAll('button').forEach(b => b.disabled = true); markQuestionSolved(); }
                    else { btn.classList.add('wrong'); btn.disabled = true; playChime(false); }
                };
                grid.appendChild(btn);
            });
        }
        else if (q.type === 'true_false') {
            bodyEl.innerHTML = `
                <div class="quiz-stem-box">${safeRenderText(q.statement)}</div>
                <div class="tf-buttons-row" style="margin-top:14px;">
                    <button type="button" class="tf-choice-btn tf-true" id="tf-t">✅ صَحٌّ</button>
                    <button type="button" class="tf-choice-btn tf-false" id="tf-f">❌ خَطَأٌ</button>
                </div>`;
            const tB = document.getElementById('tf-t'), fB = document.getElementById('tf-f');
            const pick = (val, btn) => {
                if (currentQuestionResolved) return;
                if (val === q.correctBool) { btn.style.background = '#dcfce7'; btn.style.borderColor = '#16a34a'; tB.disabled = true; fB.disabled = true; markQuestionSolved(); }
                else { btn.style.background = '#ffe4e6'; btn.style.borderColor = '#e11d48'; btn.disabled = true; playChime(false); }
            };
            tB.onclick = () => pick(true, tB); fB.onclick = () => pick(false, fB);
        }
        else if (q.type === 'math_baskets') {
            let rem = q.circles.slice();
            let selId = rem[0]?.id || null;
            const solved = {};
            q.baskets.forEach(b => solved[b.value] = []);
            const renderMath = () => {
                bodyEl.innerHTML = `<div class="math-circles-pool" id="m-pool"></div><div class="math-baskets-grid" id="m-baskets" style="margin-top:14px;"></div>`;
                const pEl = document.getElementById('m-pool'), bEl = document.getElementById('m-baskets');
                rem.forEach(c => {
                    const b = document.createElement('button'); b.type = 'button';
                    b.className = 'math-eq-circle' + (c.id === selId ? ' selected-circle' : '');
                    b.textContent = c.expr;
                    b.onclick = () => { selId = c.id; renderMath(); };
                    pEl.appendChild(b);
                });
                q.baskets.forEach(bsk => {
                    const d = document.createElement('div'); d.className = 'math-basket-box';
                    const chips = (solved[bsk.value] || []).map(ex => `<span class="mini-solved-eq">${ex}</span>`).join('');
                    d.innerHTML = `<div class="basket-target-num"><span>🧺</span><span>${bsk.label}</span></div><div class="basket-collected-chips">${chips}</div>`;
                    d.onclick = () => {
                        const idx = rem.findIndex(x => x.id === selId);
                        if (idx === -1) return;
                        if (rem[idx].answer === bsk.value) {
                            solved[bsk.value].push(rem[idx].expr);
                            rem.splice(idx, 1);
                            selId = rem[0]?.id || null;
                            playChime(true); renderMath();
                            if (rem.length === 0) markQuestionSolved();
                        } else { playChime(false); d.style.borderColor = '#e11d48'; setTimeout(() => d.style.borderColor = '#059669', 450); }
                    };
                    bEl.appendChild(d);
                });
            };
            renderMath();
        }
        else if (q.type === 'science_cloze') {
            bodyEl.innerHTML = `
                <div class="cloze-top-choices" id="clz-top"></div>
                <div class="quiz-stem-box" style="text-align:justify; margin-top:12px;">
                    ${safeRenderText(q.beforeText)}
                    <span class="cloze-blank-slot" id="clz-slot">........</span>
                    ${safeRenderText(q.afterText)}
                </div>`;
            const top = document.getElementById('clz-top'), slot = document.getElementById('clz-slot');
            q.choices.forEach(ch => {
                const p = document.createElement('button'); p.type = 'button'; p.className = 'cloze-word-pill';
                p.textContent = ch.word;
                p.onclick = () => {
                    if (currentQuestionResolved) return;
                    if (ch.correct) {
                        slot.textContent = ch.word; slot.classList.add('filled-right');
                        p.style.background = '#dcfce7'; p.style.borderColor = '#16a34a';
                        top.querySelectorAll('button').forEach(b => b.disabled = true);
                        markQuestionSolved();
                    } else { p.style.background = '#ffe4e6'; p.style.borderColor = '#e11d48'; p.disabled = true; playChime(false); }
                };
                top.appendChild(p);
            });
        }
        else if (q.type === 'adab_multiselect') {
            let found = 0;
            bodyEl.innerHTML = `
                <div style="display:flex; justify-content:center; margin-bottom:10px;">
                    <span class="adab-counter-badge" id="adab-cnt">العِبَارَاتُ الصَّحِيحَةُ المُخْتَارَةُ: ٠ / ${toAr(q.requiredCorrect)}</span>
                </div>
                <div class="adab-list-stack" id="adab-stack"></div>`;
            const stack = document.getElementById('adab-stack'), cnt = document.getElementById('adab-cnt');
            q.options.forEach(opt => {
                const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'quiz-opt-btn';
                btn.innerHTML = `<span>▫️</span><span>${safeRenderText(opt.text)}</span>`;
                btn.onclick = () => {
                    if (currentQuestionResolved || btn.disabled) return;
                    btn.disabled = true;
                    if (opt.correct) {
                        btn.classList.add('correct'); btn.firstElementChild.textContent = '✅';
                        found++; cnt.textContent = `العِبَارَاتُ الصَّحِيحَةُ المُخْتَارَةُ: ${toAr(found)} / ${toAr(q.requiredCorrect)}`;
                        playChime(true);
                        if (found >= q.requiredCorrect) { stack.querySelectorAll('button').forEach(b => b.disabled = true); markQuestionSolved(); }
                    } else { btn.classList.add('wrong'); btn.firstElementChild.textContent = '❌'; playChime(false); }
                };
                stack.appendChild(btn);
            });
        }
    }

    function renderApplyStation() {

        host.innerHTML = `
