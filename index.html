<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>مدرسة العلم | بوابة الدخول والاشتراك</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="cc.ico" type="image/x-icon">
    <meta name="theme-color" content="#064e3b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="مدرسة العلم">
    <link rel="apple-touch-icon" href="icon-512.png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
    <script>
    (function ensureSafeStorage(){
        try {
            var t = '__al3lm_test__';
            window.localStorage.setItem(t, '1');
            window.localStorage.removeItem(t);
        } catch (e) {
            var mem = {};
            var safeStore = {
                getItem: function(k){ return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; },
                setItem: function(k, v){ mem[k] = String(v); },
                removeItem: function(k){ delete mem[k]; },
                clear: function(){ mem = {}; },
                key: function(i){ return Object.keys(mem)[i] || null; },
                get length(){ return Object.keys(mem).length; }
            };
            try { Object.defineProperty(window, 'localStorage', { value: safeStore, configurable: true }); } catch (_) {}
        }
    })();
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            min-height: 100dvh;
            width: 100%;
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at 50% 12%, #065f46 0%, #06281e 52%, #09111e 100%);
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .auth-shell {
            width: 100%;
            max-width: 520px;
            background: linear-gradient(145deg, rgba(255,255,255,0.98), rgba(236,253,245,0.95));
            color: #0f172a;
            border: 3.5px solid #eab308;
            border-radius: 32px;
            padding: clamp(18px, 3.8vmin, 28px);
            box-shadow: 0 26px 65px rgba(0,0,0,0.68);
            display: flex;
            flex-direction: column;
            gap: 14px;
            text-align: center;
        }
        .active-session-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: #fef9c3;
            border: 1.5px solid #eab308;
            color: #713f12;
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 0.82rem;
            font-weight: 900;
            flex-wrap: wrap;
        }
        .active-session-bar a, .active-session-bar button {
            padding: 4px 12px;
            border-radius: 999px;
            border: none;
            background: #065f46;
            color: #fef08a;
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 900;
            text-decoration: none;
            cursor: pointer;
        }
        .brand-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .brand-hero-img {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #eab308;
            background: #064e3b;
            box-shadow: 0 8px 22px rgba(6,78,59,0.35);
        }
        .brand-title {
            font-family: 'Aref Ruqaa', serif;
            font-size: clamp(1.85rem, 5vmin, 2.3rem);
            color: #064e3b;
            line-height: 1.15;
        }
        .brand-sub {
            font-size: 0.88rem;
            font-weight: 800;
            color: #475569;
        }
        .install-app-btn {
            align-self: center;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 18px;
            border-radius: 999px;
            border: 2px solid #059669;
            background: #ecfdf5;
            color: #064e3b;
            font-family: inherit;
            font-size: 0.84rem;
            font-weight: 900;
            cursor: pointer;
            transition: transform 0.16s ease, background 0.16s ease;
        }
        .install-app-btn:hover { transform: scale(1.03); background: #d1fae5; }

        .role-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: #ecfdf5;
            padding: 5px;
            border-radius: 999px;
            border: 2px solid #6ee7b7;
        }
        .role-tab-btn {
            padding: 9px 12px;
            border-radius: 999px;
            border: none;
            background: transparent;
            font-family: inherit;
            font-weight: 900;
            font-size: 0.92rem;
            color: #065f46;
            cursor: pointer;
            transition: 0.2s;
        }
        .role-tab-btn.active {
            background: linear-gradient(135deg, #059669, #064e3b);
            color: #fef08a;
            box-shadow: 0 4px 12px rgba(6,78,59,0.3);
        }

        .mode-switch-row {
            display: flex;
            justify-content: center;
            gap: 10px;

        .mode-pill-btn {

            border: 1.5px solid #cbd5e1;

            font-size: 0.84rem;
            font-weight: 900;

        }

            background: #fef9c3;
            color: #713f12;
        }

        .field-col {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: right;
        }
        .auth-input, .auth-select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 15px;
            border: 2px solid #cbd5e1;
            background: #ffffff;
            color: #0f172a;
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 800;
            outline: none;
            transition: border-color 0.18s;

        .auth-input:focus, .auth-select:focus { border-color: #059669; }

        .fun-class-picker {
            display: none;
            flex-direction: column;
            gap: 10px;
            background: #f8fafc;
            border: 2px solid #a7f3d0;
            border-radius: 20px;
            padding: 12px;
            text-align: center;
        }
        .fun-picker-label {
            font-size: 0.86rem;
            font-weight: 900;
            color: #065f46;
        }
        .stage-mini-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .stg-mini-card {
            padding: 10px 6px;
            border-radius: 16px;
            border: 2.5px solid #cbd5e1;
            background: #ffffff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: 0.2s;
            font-family: inherit;
        }
        .stg-mini-card .stg-ar { font-family: 'Aref Ruqaa', serif; font-size: 1.25rem; line-height: 1.1; }
        .stg-mini-card .stg-rng { font-size: 0.74rem; font-weight: 900; direction: ltr; color: #475569; }
        .stg-mini-card.s1.selected { border-color: #0284c7; background: #e0f2fe; color: #0369a1; transform: translateY(-2px); }
        .stg-mini-card.s2.selected { border-color: #059669; background: #d1fae5; color: #065f46; transform: translateY(-2px); }
        .stg-mini-card.s3.selected { border-color: #be123c; background: #ffe4e6; color: #9f1239; transform: translateY(-2px); }

        .fun-years-bubbles {
            display: flex;
            justify-content: center;
            gap: 7px;
            flex-wrap: wrap;
            padding-top: 4px;
        }
        .yr-bubble-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid #94a3b8;
            background: #ffffff;
            color: #0f172a;
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 900;
            cursor: pointer;
            transition: 0.18s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .yr-bubble-btn.picked {
            background: linear-gradient(135deg, #eab308, #ca8a04);
            color: #0f172a;
            border-color: #713f12;
            transform: scale(1.12);
            box-shadow: 0 4px 12px rgba(234,179,8,0.45);
        }

        .teacher-reg-years-box {
            display: none;
            flex-direction: column;
            gap: 8px;
            background: #0f172a;
            color: #f8fafc;
            border-radius: 18px;
            padding: 12px;
            border: 2px solid #eab308;
            text-align: center;
        }
        .t-years-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            justify-items: center;
        }
        .t-yr-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1.5px dashed #64748b;
            background: rgba(255,255,255,0.08);
            color: #94a3b8;
            font-family: inherit;
            font-weight: 900;
            font-size: 0.82rem;
            cursor: pointer;
        }
        .t-yr-dot.lit {
            background: #16a34a;
            color: #ffffff;
            border: 2px solid #86efac;
        }

        .submit-auth-btn {
            width: 100%;
            padding: 12px;
            border-radius: 999px;
            border: 2.5px solid #fde047;
            background: linear-gradient(135deg, #059669, #064e3b);
            color: #fef08a;
            font-family: inherit;
            font-size: 1.02rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(5,150,105,0.35);
            transition: transform 0.16s ease, opacity 0.16s ease;
        }
        .submit-auth-btn:disabled { opacity: 0.6; cursor: wait; }
        .submit-auth-btn:hover:not(:disabled) { transform: translateY(-1px); }

        .feedback-box {
            min-height: 22px;
            font-size: 0.85rem;
            font-weight: 900;
            color: #be123c;
            line-height: 1.5;
        }
        .feedback-box.ok { color: #15803d; }
    </style>
</head>
<body>
    <div class="auth-shell">
        <div class="active-session-bar" id="active-session-bar">
            <span id="active-session-label">جلسة نشطة</span>
            <div style="display:flex; gap:6px;">
                <a href="student.html" id="return-portal-link">العودة لبوابتي</a>
                <button type="button" style="background:#dc2626;color:#fff;" onclick="logoutCurrentSession()">تسجيل الخروج</button>
            </div>
        </div>

        <div class="brand-row">
            <img src="icon-512.png" onerror="this.src='cc.ico'" alt="مدرسة العلم" class="brand-hero-img">
            <h1 class="brand-title">مدرسة العلم</h1>
            <p class="brand-sub">اطلبوا العلم من المهد إلى اللحد — بوابة التلميذ والمعلم</p>
        </div>

        <button type="button" class="install-app-btn" id="install-pwa-btn" onclick="triggerInstallApp()">
            <span>📲</span>
            <span>تنزيل المنصة كتطبيق على الهاتف</span>
        </button>

        <!-- ١. اختيار الصفة أولاً: تلميذ أو معلم -->
        <div class="role-tabs" role="tablist" aria-label="اختر نوع الحساب">
            <button type="button" class="role-tab-btn active" id="tab-student" onclick="setRole('student')">🎓 أنا تلميذ</button>
            <button type="button" class="role-tab-btn" id="tab-teacher" onclick="setRole('teacher')">🏫 أنا معلم / إدارة</button>
        </div>

        <!-- ٢. وضع العملية: تسجيل الدخول أو إنشاء حساب جديد فقط (مزامنة سحابية تلقائية عبر الإنترنت) -->
        <div class="mode-switch-row">
            <button type="button" class="mode-pill-btn active" id="mode-login-btn" onclick="setAuthMode('login')">🔑 تسجيل الدخول</button>
            <button type="button" class="mode-pill-btn" id="mode-register-btn" onclick="setAuthMode('register')">✨ إنشاء حساب جديد</button>
        </div>

        <!-- ٣. الحقول الأساسية -->
        <div class="field-col" id="auth-form-fields">
            <input type="text" id="auth-username" class="auth-input" placeholder="اسم المستخدم (Username)" autocomplete="username">
            <input type="password" id="auth-password" class="auth-input" placeholder="كلمة المرور (Password)" autocomplete="current-password" onkeydown="if(event.key==='Enter') handleAuthSubmit()">

            <!-- واجهة اختيار الصف الممتعة للتلميذ عند الاشتراك -->
            <div class="fun-class-picker" id="student-class-picker">
                <div class="fun-picker-label">🌟 اختر مرحلتك وعمرك الدراسي لرحلتك العلمية:</div>
                <div class="stage-mini-cards">
                    <button type="button" class="stg-mini-card s1 selected" id="stg-card-1" onclick="selectFunStage(1)">
                        <span class="stg-ar">سيد</span>
                        <span class="stg-rng">1 - 7</span>
                    </button>
                    <button type="button" class="stg-mini-card s2" id="stg-card-2" onclick="selectFunStage(2)">
                        <span class="stg-ar">عبد</span>
                        <span class="stg-rng">8 - 14</span>
                    </button>
                    <button type="button" class="stg-mini-card s3" id="stg-card-3" onclick="selectFunStage(3)">
                        <span class="stg-ar">صاحب</span>
                        <span class="stg-rng">15 - 21</span>
                    </button>
                </div>
                <div class="fun-years-bubbles" id="fun-years-bubbles"></div>
                <select id="student-school-branch" class="auth-select" title="اختر المدرسة">
                    <option value="main">🏫 مدرسة العلم (المنهج الأساسي)</option>
                </select>
            </div>

            <!-- إعدادات مدرسة المعلم عند إنشاء حساب معلم جديد -->
            <input type="text" id="auth-school-name" class="auth-input" placeholder="اسم مدرستك الخاصة (اتركه فارغاً للتصفح العام)" style="display:none;">
            <div class="teacher-reg-years-box" id="teacher-reg-years-box">
                <div style="font-size:0.8rem; font-weight:800; color:#fde047;">💡 حدّد الصفوف العمرية (1 - 21) المفعّلة في مدرستك الخاصة:</div>
                <div class="t-years-grid" id="teacher-reg-years-grid"></div>
            </div>
        </div>

        <button type="button" class="submit-auth-btn" id="auth-submit-btn" onclick="handleAuthSubmit()">دخول</button>
        <div class="feedback-box" id="auth-feedback"></div>
    </div>

    <script>
    (function initAl3lmGateway() {
        const CLOUD_SYNC_API = localStorage.getItem('al3lm_sync_api_url')
                            || localStorage.getItem('al3lm_tutor_worker_url')
                            || 'https://al-3lm-tutor.noorsaade-1841989.workers.dev';

        async function callCloudApi(payload, timeoutMs = 9000) {
            if (!navigator.onLine) return { ok: false, offline: true };
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), timeoutMs);
            try {
                const res = await fetch(CLOUD_SYNC_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    signal: ctrl.signal
                });
                const data = await res.json().catch(() => ({}));
                return { status: res.status, ...data };
            } catch (e) {
                return { ok: false, networkError: true };
            } finally {
                clearTimeout(t);
            }
        }

        function computeHash(rawStr, salt) {
            const str = `${salt}::${String(rawStr || '').trim()}`;
            let h1 = 0xdeadbeef ^ str.length, h2 = 0x41c6ce57 ^ str.length;
            for (let i = 0; i < str.length; i++) {
                const ch = str.charCodeAt(i);
                h1 = Math.imul(h1 ^ ch, 2654435761);
                h2 = Math.imul(h2 ^ ch, 1597334677);
            }
            h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
            h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
            return "h2_" + (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
        }

        function restoreStudentSnapshotToLocal(stu) {
            if (!stu) return;
            if (stu.progress && typeof stu.progress === 'object') {
                Object.keys(stu.progress).forEach(k => {
                    if (typeof stu.progress[k] === 'string') {
                        localStorage.setItem(k, stu.progress[k]);
                    }
                });
            }
            const yr = parseInt(stu.assignedYear, 10) || 1;
            localStorage.setItem('selected_school_year', String(yr));
            localStorage.setItem('selected_stage_group', String(Math.ceil(yr / 7)));
            localStorage.setItem('selected_school_branch', stu.schoolBranch || 'main');
        }

        const params = new URLSearchParams(window.location.search);
        if (params.get('logout') === '1') {
            localStorage.removeItem('al3lm_active_role');
            localStorage.removeItem('al3lm_active_student_user');
            localStorage.removeItem('al3lm_active_teacher_user');
        }

        const activeRole = localStorage.getItem('al3lm_active_role');
        const activeStuUser = localStorage.getItem('al3lm_active_student_user');
        const activeTchUser = localStorage.getItem('al3lm_active_teacher_user');
        const isSwitching = (params.get('switchAccount') === '1');

        if (!isSwitching) {
            if (activeRole === 'student' && activeStuUser) {
                const stuMap = JSON.parse(localStorage.getItem('al3lm_student_accounts_v1') || '{}');
                if (stuMap[activeStuUser]) {
                    restoreStudentSnapshotToLocal(stuMap[activeStuUser]);
                    window.location.replace('student.html');
                    return;
                }
            } else if (activeRole === 'teacher' && activeTchUser) {
                window.location.replace('teachers.html');
                return;
            }
        } else {
            const bar = document.getElementById('active-session-bar');
            const lbl = document.getElementById('active-session-label');
            const lnk = document.getElementById('return-portal-link');
            if (activeRole === 'student' && activeStuUser) {
                bar.style.display = 'flex';
                lbl.textContent = `🎓 متصل كطالب: ${activeStuUser}`;
                lnk.href = 'student.html';
                lnk.textContent = 'بوابة التلميذ ⬅';
            } else if (activeRole === 'teacher' && activeTchUser) {
                bar.style.display = 'flex';
                lbl.textContent = `🏫 متصل كمعلم: ${activeTchUser}`;
                lnk.href = 'teachers.html';
                lnk.textContent = 'بوابة المعلمين ⬅';
            }
        }

        window.logoutCurrentSession = function() {
            localStorage.removeItem('al3lm_active_role');
            localStorage.removeItem('al3lm_active_student_user');
            localStorage.removeItem('al3lm_active_teacher_user');
            localStorage.setItem('school_edit_mode', 'false');
            document.getElementById('active-session-bar').style.display = 'none';
            showMsg('تم تسجيل الخروج بنجاح.', true);
        };

        let deferredInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredInstallPrompt = e;
        });
        window.triggerInstallApp = async () => {
            if (deferredInstallPrompt) {
                deferredInstallPrompt.prompt();
                await deferredInstallPrompt.userChoice.catch(() => {});
                deferredInstallPrompt = null;
                return;
            }
            showMsg('لتثبيت المنصة كتطبيق على هاتفك: افتح قائمة المتصفح (⋮ أو زر المشاركة ⬆️) واختر «إضافة إلى الشاشة الرئيسية / تثبيت التطبيق».', true);
        };

        async function populateStudentSchools() {
            const sel = document.getElementById('student-school-branch');
            if (!sel) return;
            // مزامنة قائمة المدارس الخاصة من السحابة تلقائياً
            const dirRes = await callCloudApi({ action: 'list_directory' }, 5000);
            if (dirRes && dirRes.ok && Array.isArray(dirRes.schools)) {
                const localSc = JSON.parse(localStorage.getItem('private_schools_directory') || '[]');
                dirRes.schools.forEach(inc => {
                    if (!inc || !inc.id) return;
                    const idx = localSc.findIndex(s => s.id === inc.id);
                    if (idx >= 0) localSc[idx] = { ...localSc[idx], ...inc };
                    else localSc.push(inc);
                });
                localStorage.setItem('private_schools_directory', JSON.stringify(localSc));
            }
            const blocked = JSON.parse(localStorage.getItem('blocked_schools_list') || '[]');
            const schools = JSON.parse(localStorage.getItem('private_schools_directory') || '[]')
                .filter(s => !blocked.includes(s.id));
            schools.forEach(sc => {
                if (!sel.querySelector(`option[value="${sc.id}"]`)) {
                    const o = document.createElement('option');
                    o.value = sc.id;
                    o.textContent = `🌟 ${sc.name} — المعلم: ${sc.owner}`;
                    sel.appendChild(o);
                }
            });
        }
        populateStudentSchools();

        let currentRole = params.get('role') === 'teacher' ? 'teacher' : 'student';
        let currentMode = 'login';
        let pickedStage = 1;
        let pickedStudentYear = 1;
        let teacherRegYears = [1, 8, 15];

        function renderStudentYearBubbles() {
            const wrap = document.getElementById('fun-years-bubbles');
            if (!wrap) return;
            wrap.innerHTML = '';
            const startY = (pickedStage - 1) * 7 + 1;
            const endY = pickedStage * 7;
            if (pickedStudentYear < startY || pickedStudentYear > endY) pickedStudentYear = startY;

            for (let y = startY; y <= endY; y++) {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'yr-bubble-btn' + (y === pickedStudentYear ? ' picked' : '');
                b.textContent = y;
                b.onclick = () => {
                    pickedStudentYear = y;
                    renderStudentYearBubbles();
                };
                wrap.appendChild(b);
            }
        }

        window.selectFunStage = function(stg) {
            pickedStage = stg;
            for (let s = 1; s <= 3; s++) {
                document.getElementById('stg-card-' + s).classList.toggle('selected', s === stg);
            }
            pickedStudentYear = (stg - 1) * 7 + 1;
            renderStudentYearBubbles();
        };

        function renderTeacherRegYears() {
            const g = document.getElementById('teacher-reg-years-grid');
            if (!g) return;
            g.innerHTML = '';
            for (let y = 1; y <= 21; y++) {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 't-yr-dot' + (teacherRegYears.includes(y) ? ' lit' : '');
                b.textContent = y;
                b.onclick = () => {
                    if (teacherRegYears.includes(y)) teacherRegYears = teacherRegYears.filter(x => x !== y);
                    else { teacherRegYears.push(y); teacherRegYears.sort((a, b) => a - b); }
                    renderTeacherRegYears();
                };
                g.appendChild(b);
            }
        }

        function showMsg(txt, ok = false) {
            const fb = document.getElementById('auth-feedback');
            fb.className = 'feedback-box' + (ok ? ' ok' : '');
            fb.textContent = txt;
        }

        function updateFormUI() {
            document.getElementById('tab-student').classList.toggle('active', currentRole === 'student');
            document.getElementById('tab-teacher').classList.toggle('active', currentRole === 'teacher');

            document.getElementById('mode-login-btn').classList.toggle('active', currentMode === 'login');
            document.getElementById('mode-register-btn').classList.toggle('active', currentMode === 'register');

            const isReg = (currentMode === 'register');

            document.getElementById('auth-username').placeholder = currentRole === 'teacher'
                ? 'اسم المعلم / المستخدم أو معرّف المدرسة (ELM-XXXX)'
                : 'اسمك الموحّد للدخول والحساب (مثال: نور أو noor)';

            document.getElementById('student-class-picker').style.display = (isReg && currentRole === 'student') ? 'flex' : 'none';
            document.getElementById('auth-school-name').style.display = (isReg && currentRole === 'teacher') ? 'block' : 'none';
            document.getElementById('teacher-reg-years-box').style.display = (isReg && currentRole === 'teacher') ? 'flex' : 'none';

            const subBtn = document.getElementById('auth-submit-btn');
            if (isReg) subBtn.textContent = currentRole === 'student' ? '🚀 إنشاء حسابي والانتقال لبوابة التلميذ' : '🏫 إنشاء حساب المعلم والانتقال لبوابة المعلمين';
            else subBtn.textContent = currentRole === 'student' ? '🎓 دخول إلى بوابة التلميذ' : '🏫 دخول إلى بوابة المعلمين';

            showMsg('');
        }

        window.setRole = (r) => { currentRole = r; updateFormUI(); };
        window.setAuthMode = (m) => { currentMode = m; updateFormUI(); };

        function generateSchoolCode(existing) {
            const chars = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
            let code = "";
            do {
                let p = "";
                for (let i = 0; i < 4; i++) p += chars[Math.floor(Math.random() * chars.length)];
                code = "ELM-" + p;
            } while (existing.some(s => s.code === code));
            return code;
        }

        window.handleAuthSubmit = async () => {
            const rawUser = (document.getElementById('auth-username').value || '').trim();
            const username = rawUser.toLowerCase();
            const password = (document.getElementById('auth-password').value || '').trim();
            const schoolName = (document.getElementById('auth-school-name').value || '').trim();
            const stuSchoolBranch = document.getElementById('student-school-branch')?.value || 'main';
            const submitBtn = document.getElementById('auth-submit-btn');

            if (!username || !password) {
                showMsg('⚠️ يرجى إدخال اسم المستخدم وكلمة المرور.');
                return;
            }

            submitBtn.disabled = true;

            try {
                // ١. مسار التلميذ (Student) — مزامنة سحابية تلقائية عبر الإنترنت
                if (currentRole === 'student') {
                    const accounts = JSON.parse(localStorage.getItem('al3lm_student_accounts_v1') || '{}');
                    const pwHash = computeHash(password, 'stu_' + username);

                    if (currentMode === 'register') {
                        if (password.length < 3) {
                            showMsg('⚠️ يرجى اختيار كلمة مرور لا تقل عن 3 خانات.');
                            return;
                        }
                        const newStu = {
                            accountType: 'student',
                            username,
                            name: rawUser,
                            pwHash,
                            assignedYear: pickedStudentYear,
                            schoolBranch: stuSchoolBranch,
                            createdAt: new Date().toISOString(),
                            completed: false,
                            completedYears: [],
                            reminderTime: '08:30',
                            reminderEnabled: false,
                            lastVisitStatus: 'ready',
                            lastScore: '',
                            lessonHistory: [],
                            progress: {}
                        };

                        showMsg('⏳ جاري تسجيل حسابك على السحابة...', true);
                        const cloudReg = await callCloudApi({ action: 'register_student', profile: newStu });
                        if (cloudReg && cloudReg.error === 'USERNAME_EXISTS') {
                            showMsg('⚠️ اسم المستخدم هذا محجوز مسبقاً، اختر اسماً آخر أو سجّل الدخول.');
                            return;
                        }
                        if (!cloudReg.ok && accounts[username]) {
                            showMsg('⚠️ اسم المستخدم مسجّل مسبقاً، اختر اسماً آخر أو سجّل الدخول.');
                            return;
                        }

                        accounts[username] = cloudReg.profile || newStu;
                        localStorage.setItem('al3lm_student_accounts_v1', JSON.stringify(accounts));
                        localStorage.setItem('al3lm_active_student_user', username);
                        localStorage.setItem('al3lm_active_role', 'student');
                        restoreStudentSnapshotToLocal(accounts[username]);
                        window.location.href = 'student.html';
                        return;
                    } else {
                        showMsg('⏳ جاري فتح حسابك واسترجاع تقدمك...', true);
                        const cloudLogin = await callCloudApi({ action: 'login_student', username, pwHash });

                        if (cloudLogin && cloudLogin.ok && cloudLogin.profile) {
                            // دمج أي تقدم محلي إن وجد مع النسخة السحابية
                            const localCopy = accounts[username];
                            const merged = cloudLogin.profile;
                            if (localCopy && localCopy.pwHash === pwHash && localCopy.progress) {
                                merged.progress = { ...localCopy.progress, ...(merged.progress || {}) };
                            }
                            accounts[username] = merged;
                            localStorage.setItem('al3lm_student_accounts_v1', JSON.stringify(accounts));
                            localStorage.setItem('al3lm_active_student_user', username);
                            localStorage.setItem('al3lm_active_role', 'student');
                            restoreStudentSnapshotToLocal(merged);
                            window.location.href = 'student.html';
                            return;
                        }

                        if (cloudLogin && cloudLogin.error === 'WRONG_PASSWORD') {
                            showMsg('❌ كلمة المرور غير صحيحة.');
                            return;
                        }

                        // احتياطي العمل دون اتصال (Offline Fallback) إن كان الحساب محفوظاً على نفس الجهاز
                        const localAcc = accounts[username];
                        if (localAcc && localAcc.pwHash === pwHash) {
                            // إذا كان السيرفر يعمل ولكن الحساب لم يُرفع له بعد، نرفعه تلقائياً الآن!
                            callCloudApi({ action: 'sync_student', username, pwHash, profile: localAcc });
                            localStorage.setItem('al3lm_active_student_user', username);
                            localStorage.setItem('al3lm_active_role', 'student');
                            restoreStudentSnapshotToLocal(localAcc);
                            window.location.href = 'student.html';
                            return;
                        }

                        showMsg('❌ اسم المستخدم أو كلمة المرور غير صحيحة.');
                        return;
                    }
                }

                // ٢. مسار المعلم والإدارة (Teacher) — مزامنة سحابية تلقائية
                const teachers = JSON.parse(localStorage.getItem('al3lm_teacher_accounts_v1') || '{}');
                const pwHash = computeHash(password, 'tch_' + username);

                if (currentMode === 'register') {
                    if (password.length < 3) {
                        showMsg('⚠️ يرجى اختيار كلمة مرور لا تقل عن 3 خانات.');
                        return;
                    }
                    let linkedSchoolId = 'main';
                    let linkedSchoolCode = '';
                    let newSchoolObj = null;

                    if (schoolName && schoolName !== 'مدرسة العلم') {
                        const schools = JSON.parse(localStorage.getItem('private_schools_directory') || '[]');
                        linkedSchoolId = 'school_' + Date.now() + '_' + Math.floor(Math.random() * 900 + 100);
                        linkedSchoolCode = generateSchoolCode(schools);
                        const yrs = teacherRegYears.length > 0 ? [...teacherRegYears] : [1];
                        newSchoolObj = {
                            id: linkedSchoolId,
                            code: linkedSchoolCode,
                            name: schoolName,
                            owner: rawUser,
                            targetYears: yrs,
                            pinHash: computeHash(password, linkedSchoolId),
                            warnings: 0,
                            warningMessage: '',
                            yearHashes: {}
                        };
                        schools.push(newSchoolObj);
                        localStorage.setItem('private_schools_directory', JSON.stringify(schools));
                        localStorage.setItem('selected_school_branch', linkedSchoolId);
                        localStorage.setItem('active_private_school_meta', JSON.stringify(newSchoolObj));
                        localStorage.setItem('school_edit_mode', 'true');
                        localStorage.setItem('edit_mode_owner', linkedSchoolId);
                    }

                    const newTch = {
                        accountType: 'teacher',
                        username,
                        name: rawUser,
                        pwHash,
                        schoolId: linkedSchoolId,
                        schoolCode: linkedSchoolCode,
                        schoolName: schoolName || 'مدرسة العلم',
                        schoolMeta: newSchoolObj,
                        createdAt: new Date().toISOString()
                    };

                    showMsg('⏳ جاري إنشاء حساب المعلم على السحابة...', true);
                    const cloudTchReg = await callCloudApi({ action: 'register_teacher', profile: newTch });
                    if (cloudTchReg && cloudTchReg.error === 'USERNAME_EXISTS') {
                        showMsg('⚠️ اسم مستخدم المعلم مسجّل مسبقاً، يرجى تسجيل الدخول.');
                        return;
                    }

                    teachers[username] = cloudTchReg.profile || newTch;
                    localStorage.setItem('al3lm_teacher_accounts_v1', JSON.stringify(teachers));
                    localStorage.setItem('al3lm_active_role', 'teacher');
                    localStorage.setItem('al3lm_active_teacher_user', username);
                    window.location.href = 'teachers.html';
                    return;
                } else {
                    showMsg('⏳ جاري التحقق من حساب المعلم...', true);
                    const cloudTchLogin = await callCloudApi({ action: 'login_teacher', username, pwHash });
                    if (cloudTchLogin && cloudTchLogin.ok && cloudTchLogin.profile) {
                        const tProf = cloudTchLogin.profile;
                        teachers[username] = tProf;
                        localStorage.setItem('al3lm_teacher_accounts_v1', JSON.stringify(teachers));
                        if (cloudTchLogin.schoolMeta) {
                            const schools = JSON.parse(localStorage.getItem('private_schools_directory') || '[]');
                            const idx = schools.findIndex(s => s.id === cloudTchLogin.schoolMeta.id);
                            if (idx >= 0) schools[idx] = cloudTchLogin.schoolMeta; else schools.push(cloudTchLogin.schoolMeta);
                            localStorage.setItem('private_schools_directory', JSON.stringify(schools));
                        }
                        localStorage.setItem('al3lm_active_role', 'teacher');
                        localStorage.setItem('al3lm_active_teacher_user', username);
                        if (tProf.schoolId && tProf.schoolId !== 'main') {
                            localStorage.setItem('selected_school_branch', tProf.schoolId);
                            localStorage.setItem('school_edit_mode', 'true');
                            localStorage.setItem('edit_mode_owner', tProf.schoolId);
                        }
                        window.location.href = 'teachers.html';
                        return;
                    }

                    const tAcc = teachers[username];
                    if (tAcc && tAcc.pwHash === pwHash) {
                        callCloudApi({ action: 'sync_teacher', username, pwHash, profile: tAcc, schoolMeta: tAcc.schoolMeta || null });
                        localStorage.setItem('al3lm_active_role', 'teacher');
                        localStorage.setItem('al3lm_active_teacher_user', username);
                        if (tAcc.schoolId && tAcc.schoolId !== 'main') {
                            localStorage.setItem('selected_school_branch', tAcc.schoolId);
                            localStorage.setItem('school_edit_mode', 'true');
                            localStorage.setItem('edit_mode_owner', tAcc.schoolId);
                        }
                        window.location.href = 'teachers.html';
                        return;
                    }

                    const schools = JSON.parse(localStorage.getItem('private_schools_directory') || '[]');
                    const matchedSchool = schools.find(s =>
                        ((s.code && s.code.toLowerCase() === username) || (s.name && s.name.trim().toLowerCase() === username)) &&
                        s.pinHash === computeHash(password, s.id)
                    );
                    if (matchedSchool) {
                        localStorage.setItem('al3lm_active_role', 'teacher');
                        localStorage.setItem('al3lm_active_teacher_user', matchedSchool.owner || matchedSchool.code);
                        localStorage.setItem('selected_school_branch', matchedSchool.id);
                        localStorage.setItem('active_private_school_meta', JSON.stringify(matchedSchool));
                        localStorage.setItem('school_edit_mode', 'true');
                        localStorage.setItem('edit_mode_owner', matchedSchool.id);
                        window.location.href = 'teachers.html';
                        return;
                    }

                    const savedOwnerHash = localStorage.getItem('school_admin_pin_hash');
                    const isMaster = savedOwnerHash ? (computeHash(password, 'owner_master') === savedOwnerHash) : (password === '1234');
                    if (isMaster) {
                        localStorage.setItem('al3lm_active_role', 'teacher');
                        localStorage.setItem('al3lm_active_teacher_user', rawUser || 'الإدارة');
                        window.location.href = 'teachers.html';
                        return;
                    }

                    showMsg('❌ بيانات دخول المعلم غير صحيحة.');
                }
            } finally {
                submitBtn.disabled = false;
            }
        };

        renderStudentYearBubbles();
        renderTeacherRegYears();
        updateFormUI();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        }
    })();
    </script>
</body>
</html>
